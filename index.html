/* ---- Lebenszeichen ----
   Ein einziger Taktgeber für die ganze App: in unregelmäßigen Abständen
   blinzelt eine sichtbare Figur oder schaut kurz zur Seite. Ohne das wirken
   die Figuren eingefroren, egal wie gut die Idle-Schleife ist.
   Kostet einen Timer und einen Klassenwechsel – kein Rendering. */
let _lifeT=null;
function charLife(){
 if(_lifeT)clearTimeout(_lifeT);
 const tick=()=>{
  if(!document.hidden){
   const els=document.querySelectorAll('.char.is-idle,.char.is-talking');
   if(els.length){
    const el=els[ri(0,els.length-1)];
    const akt=Math.random()<.74?'blink':'glance';
    el.classList.remove('blink','glance');void el.offsetWidth;
    el.classList.add(akt);
    setTimeout(()=>el.classList.remove(akt),akt==='blink'?400:1600);
   }
  }
  _lifeT=setTimeout(tick,1500+Math.random()*2800);
 };
 _lifeT=setTimeout(tick,800+Math.random()*1400);
}
function charLifeStart(){
 try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
 charLife();
}

/* ---------- Wahrscheinlichkeit ----------
   Gibt die (evtl. höhere) Stufe zurück. Mehrfach-Upgrades sind möglich:
   nach einem Treffer wird die nächste Stufe erneut gewürfelt. */
function rollChestUpgrade(variant,rng){
 rng=rng||Math.random;
 const start=chestKey(variant);
 if(!CHEST[start].up)return start;               /* höchste Stufe: Pity bleibt unberührt */
 /* Der Pity-Bonus gilt nur für den ersten Wurf. Sonst würde jede Kette
    mit einem Fehlwurf enden und der Zähler nie sinnvoll zurückgesetzt. */
 const bonus=Math.min(CHEST_PITY.max,(state.chestPity||0)*CHEST_PITY.step);
 let v=start,erster=true;
 for(;;){
  const cfg=CHEST[v];
  if(!cfg||!cfg.up)break;
  if(rng()<cfg.up+(erster?bonus:0)){
   v=CHEST_ORDER[CHEST_ORDER.indexOf(v)+1];
   erster=false;
  }else break;
 }
 state.chestPity=(v!==start)?0:(state.chestPity||0)+1;
 return v;
}

/* chest(variant, mode, size, cls) -> HTML-String
   ≙ <Chest variant state size className/> */
function chest(variant,mode,size,cls){
 const v=chestKey(variant),c=CHEST[v];
 mode=CHEST_STATES.indexOf(mode)>=0?mode:'idle';
 size=({sm:1,md:1,lg:1})[size]?size:'md';
 const vars='--glow:'+c.glow+';--idle:'+c.idle+';--hover:'+c.hover+';--bounce:'+c.bounce;
 return '<span class="chest chest--'+v+' chest--'+size+' is-'+mode+(cls?' '+cls:'')+
  '" data-chest="'+v+'" style="'+vars+'">'+CHEST_SVG+'<span class="ch-parts"></span></span>';
}

/* Zustand wechseln, ohne neu zu rendern. */
function chestState(el,mode){
 el=typeof el==='string'?document.querySelector(el):el;
 if(!el||CHEST_STATES.indexOf(mode)<0)return;
 for(let i=0;i<CHEST_STATES.length;i++)el.classList.remove('is-'+CHEST_STATES[i]);
 void el.offsetWidth;
 el.classList.add('is-'+mode);
}

/* Partikel: Anzahl kommt aus der Konfiguration, Richtung aus dem Kreis. */
function chestBurst(el){
 el=typeof el==='string'?document.querySelector(el):el;
 if(!el)return;
 const box=el.querySelector('.ch-parts');if(!box)return;
 const n=(CHEST[el.dataset.chest]||CHEST.bronze).parts;
 let h='';
 for(let i=0;i<n;i++){
  const a=(Math.PI*2*i)/n+Math.random()*.6;
  const d=42+Math.random()*48;
  h+='<i style="--dx:'+Math.round(Math.cos(a)*d)+'px;--dy:'+Math.round(Math.sin(a)*d-18)+
     'px;animation-delay:'+(Math.random()*.18).toFixed(2)+'s"></i>';
 }
 box.innerHTML=h;
 setTimeout(()=>{if(box)box.textContent='';},1400);
}

/* ---------- Drop, Belohnung, Öffnen ---------- */
function addChest(type,why){
 const base=chestKey(type);
 const v=rollChestUpgrade(base);
 const steps=CHEST_ORDER.indexOf(v)-CHEST_ORDER.indexOf(base);
 state.chests.push({t:v,w:why||'',up:steps});
 save();
 toast(ico('gift','sm')+' <b>'+CHEST[v].n+'</b> erhalten'+
   (steps>0?' – <b>aufgewertet!</b>':'')+(why?' ('+why+')':''));
}

function chestReward(type){
 const v=chestKey(type),r=[];
 if(v==='bronze')r.push({k:'xp',v:pick([20,25,30,40])},{k:'sticker'},{k:'xp',v:pick([20,30])});
 if(v==='silver')r.push({k:'xp',v:pick([60,75,90])},{k:'boost',v:10},{k:'sticker'},{k:'joker',v:1});
 if(v==='gold')  r.push({k:'xp',v:pick([120,150,200])},{k:'boost',v:20},{k:'joker',v:2},{k:'sticker'});
 if(v==='purple')r.push({k:'xp',v:pick([260,320,400])},{k:'boost',v:30},{k:'joker',v:3},{k:'sticker'},{k:'sticker'});
 const p=pick(r);
 if(p.k==='sticker'){
  const left=STICKERS.map((s,i)=>i).filter(i=>state.stickers.indexOf(i)<0);
  if(!left.length)return {k:'xp',txt:'+50 XP <span class="mut">(Sticker-Album komplett)</span>',v:(addXP(50),50)};
  const id=pick(left);state.stickers.push(id);save();
  return {k:'sticker',id:id,txt:STICKERS[id].e+' Sticker „'+STICKERS[id].n+'" – neu im Album'};
 }
 if(p.k==='xp'){addXP(p.v);return {k:'xp',txt:'+'+p.v+' XP'};}
 if(p.k==='boost'){state.boost=(state.boost||0)+p.v;save();
  return {k:'boost',txt:ico('bolt','sm')+' XP-Boost: doppelte XP für die nächsten '+p.v+' Aufgaben'};}
 state.jokers+=p.v;save();updHeader();
 return {k:'joker',txt:ico('shield','sm')+' '+p.v+' Streak-Joker extra – deine Serie ist sicherer'};
}

function chestOpen(){
 const wrap=$('#chBig'),el=wrap&&wrap.querySelector('.chest'),btn=$('#chBtn');
 if(!el||el.dataset.done)return;
 el.dataset.done='1';btn.disabled=true;
 chestState(el,'opening');
 if(typeof sfx!=='undefined')sfx.click();
 setTimeout(()=>{
  const c=state.chests.shift();
  const rew=chestReward(c.t);
  chestState(el,'reward');chestBurst(el);
  if(typeof sfx!=='undefined')sfx.chest();
  cheer();
  $('#chRes').innerHTML='<div class="rewcard">'+rew.txt+'</div>';
  saveNow('flash');
  btn.disabled=false;btn.innerHTML=(state.chests.length?'Nächste Truhe ':'Weiter ')+ico('right');
  btn.onclick=()=>{if(state.chests.length)renderChest();else go('home');};
 },620);
}

let lastLockTap=null;
function nodeTap(id,locked,isCur){
 if(typeof sfx!=='undefined')sfx.click();
 if(locked){
  if(lastLockTap===id){lastLockTap=null;renderModule(id);return;}
  lastLockTap=id;
  const idx=MODS.findIndex(x=>x.id===id);
  const prev=idx>0?MODS[idx-1].t:'';
  toast(ico('lock','sm')+' Hol dir erst einen Stern in „'+prev+'" – oder tippe nochmal, um trotzdem zu üben.');
  return;
 }
 if(isCur){go('daily');return;}
 renderModule(id);
}

function importState(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{state=Object.assign(state,JSON.parse(r.result));saveNow();updHeader();go('home');toast(ico('check','sm')+' Fortschritt geladen.');}
  catch(e){alert('Die Datei konnte nicht gelesen werden.');}};
 r.readAsText(f);}

let strkOff=0;
function strkNav(d){if(strkOff+d>0)return;strkOff+=d;renderStreak();}
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function renderStreak(){
 setTab('');
 const now=new Date();
 const base=new Date(now.getFullYear(),now.getMonth()+strkOff,1);
 const y=base.getFullYear(),mo=base.getMonth();
 const dim=new Date(y,mo+1,0).getDate();
 const startCol=(base.getDay()+6)%7;
 const today=dstr();
 const set={};(state.days||[]).forEach(d=>set[d]=1);
 let practiced=0;
 let cells='';
 ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>{cells+='<div class="hd">'+w+'</div>';});
 for(let i=0;i<startCol;i++)cells+='<div class="cd"></div>';
 for(let d=1;d<=dim;d++){
  const ds=dstr(new Date(y,mo,d));
  const p=!!set[ds];if(p)practiced++;
  const col=(startCol+d-1)%7;
  const prevP=d>1&&col>0&&!!set[dstr(new Date(y,mo,d-1))];
  const nextP=d<dim&&col<6&&!!set[dstr(new Date(y,mo,d+1))];
  let cls='cd'+(p?' p':'')+(p&&!prevP?' rs':'')+(p&&!nextP?' re':'')+(ds===today?' td':'');
  cells+='<div class="'+cls+'">'+d+'</div>';
 }
 const isCurMonth=strkOff===0;
 const lastDay=isCurMonth?now.getDate():dim;
 let perfect=practiced>0&&lastDay>0;
 for(let d=1;d<=lastDay;d++)if(!set[dstr(new Date(y,mo,d))]){perfect=false;break;}
 let h='<div class="lessonhead"><button class="lx" onclick="go(\'home\')" aria-label="Zurück">'+ico('close')+'</button><b style="flex:1;text-align:center">Deine Serie</b><span style="width:34px"></span></div>';
 h+='<div class="card"><div class="flamezone"><div class="flameglow"></div><span class="flamebig">🔥</span>';

 h+='<div class="bubble" style="margin-top:14px">Ein Training pro Tag genügt. Verpasst du einen Tag, springt automatisch ein <b>Joker</b> ein – du hast noch '+state.jokers+'.</div></div>';
 h+='<div class="card"><div class="calnav"><button onclick="strkNav(-1)" aria-label="Vorheriger Monat">'+ico('left')+'</button><b>'+MONATE[mo]+' '+y+(perfect?' <span class="perfbadge">Perfekt</span>':'')+'</b><button onclick="strkNav(1)" '+(strkOff>=0?'disabled':'')+' aria-label="Nächster Monat">'+ico('right')+'</button></div>';
 h+='<div class="strkstat"><div><b>'+ico('flame')+practiced+'</b><small>Tage geübt</small></div><div><b>'+ico('shield')+state.jokers+'</b><small>Joker übrig</small></div></div>';
 h+='<div class="cal"><div class="calgrid">'+cells+'</div></div></div>';

 h+='</div></div>';
 $('#app').innerHTML=h;

let exSteps=[],curModId=null;
function exStep(i){
 const mod=modById(curModId);
 if(!mod)return;

 if(exSteps[i]<e.steps.length){
  const d=document.createElement('div');d.className='stp';d.innerHTML=e.steps[exSteps[i]];
  $('#exs'+i).appendChild(d);exSteps[i]++;
  if(exSteps[i]>=e.steps.length)$('#exb'+i).style.display='none';
 }
}
let curPracticeMod=null,practiceFirst=true;
function practiceNext(id){
 if(id){curPracticeMod=id;practiceFirst=true;}
 const m=modById(curPracticeMod);
 const selEl=$('#lvlSel');
 const sel=selEl?parseInt(selEl.value):0;

 mountTask($('#taskarea'),m.id,lvl,()=>practiceNext());
 /* Null kündigt jede neue Aufgabe an und geht wieder in Ruhehaltung. */
 if(practiceFirst)practiceFirst=false;
 else zeroSay(pick(ZERO_ASK));
 charState('#zeroFig .char','idle');
}


/* ============ Prüfer ============
   Ein Prüfer für alle Module: Minus. Pro Thema gibt es nur noch die
   Prüfungsansage – Zwischenruf, Lob und Urteil sind seine feste Art. */
const OUCH=['Richtig.','Sitzt.','Sauber gerechnet.','Korrekt – weiter.','Das war die richtige Überlegung.','Angenommen.'];
const MOCK=['Nicht korrekt.','Das war zu schnell.','Da fehlt ein Schritt.','Notiert. Schau es dir nachher an.','Leider nein.'];
const EXAMINER={

 win:['Noch nicht bestanden. Schau dir die Fehler an und komm wieder.','Das reicht noch nicht. Der zweite Anlauf klappt meistens.','Durchgefallen – aber knapp. Nochmal in Ruhe.'],
 fallback:['Zeig mir, dass du dieses Thema sicher beherrschst.','Ich prüfe jetzt. Nimm dir für jeden Schritt Zeit.']};
const BOSSTOPIC={
 bru:['Kürzen, addieren, in Prozent umrechnen. Zeig mir, dass das sitzt.','Ich prüfe Brüche. Nimm dir für den Hauptnenner Zeit.'],
 klm:['Vorzeichen – der häufigste Fehler überhaupt. Mal sehen.','Jede Klammer wird geprüft. Besonders die mit einem Minus davor.'],
 pot:['Potenzgesetze und Wurzeln. Sauber angewendet, bitte.','Ich achte auf die Exponenten. Da rutscht am meisten weg.'],
 ter:['Zusammenfassen, ausmultiplizieren, ausklammern. Zeig mir alle drei.','Nur gleichartige Terme. Ich schaue genau hin.'],
 glg:['Beide Seiten gleich behandeln – das prüfe ich Schritt für Schritt.','Löse nach x auf. Und mach die Probe im Kopf.'],
 ung:['Ungleichungen. Ich warte auf die Stelle, an der sich das Zeichen dreht.','Ein negativer Faktor genügt, und das Zeichen kippt. Pass auf.'],
 bin:['Alle drei Formeln, vorwärts und rückwärts. Los.','Der Mittelterm ist die Falle. Ich zähle mit.'],
 fak:['Aus einer Summe wird ein Produkt. Zeig mir, dass du zerlegen kannst.','Ausklammern, binomisch, Trinom – ich prüfe alle Wege.'],
 brt:['Erst die Definitionsmenge, dann rechnen. In dieser Reihenfolge.','Ein Nenner darf nie null werden. Darauf achte ich zuerst.'],
 qua:['Zwei Lösungen. Ich will beide sehen.','x² heißt: nichts unterschlagen. Auch die negative Lösung zählt.'],
 txt:['Deutsch in Mathematik übersetzen. Genau das prüfe ich.','Was ist gesucht? Nenn es x und stell die Gleichung auf.'],
 fun:['Jedem x genau ein y. Zeig mir, dass du das erkennst.','Einsetzen, ablesen, Nullstelle bestimmen. Der Reihe nach.'],
 lin:['Steigung und y-Achsenabschnitt – sicher ablesen, sicher aufstellen.','Zwei Geraden, ein Schnittpunkt. Ich warte.'],

 log:['Hoch wie viel? Diese Frage stelle ich jetzt mehrfach.','Der Logarithmus als Umkehrung – sauber begründet, bitte.'],

function bossOf(id){return {n:EXAMINER.n,t:BOSSTOPIC[id]||EXAMINER.fallback,
 mid:EXAMINER.mid,lose:EXAMINER.lose,win:EXAMINER.win};}
function bossReact(ok){
 const fig=$('#bossFig');if(!fig||!sess||sess.type!=='boss')return;
 sess.say=ok?pick(OUCH):pick(MOCK);sess.sayStep=sess.i;
 const say=$('#bossSay');if(say)say.textContent=sess.say;
 fig.classList.remove('hit','mock');void fig.offsetWidth;
 fig.classList.add(ok?'hit':'mock');
 const hp=$('#bossHp');if(hp)hp.style.width=Math.max(0,Math.round((sess.pass-sess.ok-(ok?1:0))/sess.pass*100))+'%';
}

/* ============ Sessions ============ */
let sess=null,timerH=null,sessRoot=null;
function shufArr(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function startDaily(){
 const rec=recMod();
 const due=dueMods().filter(m=>m.id!==rec.id);
 const started=MODS.filter(m=>st(m.id).c>0&&m.id!==rec.id);
 const q=[];
 for(let i=0;i<3;i++){
  let m;
  if(due[i])m=due[i];
  else m=started.length?pick(started):rec;
  q.push({m:m.id,lvl:Math.min(2,autoLvl(st(m.id))),ph:'Aufwärmen',phi:'repeat'});
 }
 for(let i=0;i<8;i++)q.push({m:rec.id,lvl:autoLvl(st(rec.id)),ph:'Fokus · '+rec.t,phi:'target'});
 const mixPool=started.concat(due).concat([rec]);
 for(let i=0;i<3;i++){const m=pick(mixPool);q.push({m:m.id,lvl:autoLvl(st(m.id)),ph:'Gemischter Abschluss',phi:'spark'});}
 sess={q:q,i:0,ok:0,t0:Date.now(),type:'daily',focus:rec.id,combo:0,maxCombo:0,shields:5};
 if(!st(rec.id).seen)startLesson(rec.id,true);
 else renderSessTask();
}
function startErrTraining(){
 if(!state.errors.length){go('home');return;}
 const take=state.errors.slice(0,12);
 state.errors=state.errors.slice(take.length);save();
 const q=take.map(e=>({m:e.m,lvl:e.lvl,ph:'Fehler-Training',phi:'repeat'}));
 sess={q:q,i:0,ok:0,t0:Date.now(),type:'err',combo:0,maxCombo:0,shields:4};
 renderSessTask();
}
function startBoss(id){
 const bs=bossState(id);
 if(bs.done||!bs.unlocked)return;
 const lvls=shufArr(bs.t.lvls.slice());
 const q=lvls.map(l=>({m:id,lvl:l,ph:bs.t.name+' · '+modById(id).t,phi:'sword'}));
 sess={q:q,i:0,ok:0,t0:Date.now(),type:'boss',mod:id,tier:bs.tier,pass:bs.t.pass,xp:bs.t.xp,name:bs.t.name,combo:0,maxCombo:0};
 renderSessTask();
}
function startReview(id){
 const q=[];
 for(let i=0;i<5;i++)q.push({m:id,lvl:autoLvl(st(id)),ph:'Wiederholung · '+modById(id).t,phi:'cal'});
 sess={q:q,i:0,ok:0,t0:Date.now(),type:'rev',mod:id,combo:0,maxCombo:0};

function sessBegin(){const m=modById(sess.focus);st(m.id).seen=true;save();renderSessTask();}
function sessTime(){const s=Math.floor((Date.now()-sess.t0)/1000);
 return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);}

/* Der Boss-Spruch bleibt stehen, bis es einen Anlass gibt ihn zu wechseln
   (früher wurde bei jedem Neuzeichnen neu gewürfelt). */
function bossSayText(){
 const B=bossOf(sess.mod);
 if(sess.sayStep!==sess.i){
  sess.sayStep=sess.i;
  if(sess.i===0)sess.say=pick(B.t);
  else if(sess.i===Math.floor(sess.q.length/2))sess.say=pick(B.mid);
  else if(!sess.say)sess.say=pick(B.t);
 }
 return sess.say;
}
function updBossArena(){
 const el=$('#bossSay');if(!el)return;
 el.textContent=bossSayText();
 const hp=$('#bossHp');
 if(hp)hp.style.width=Math.max(0,Math.round((sess.pass-sess.ok)/sess.pass*100))+'%';
 const maxErr=sess.q.length-sess.pass,used=sess.i-sess.ok,left=Math.max(0,maxErr-used);
 const sh=$('#bossShields');
 if(sh)sh.innerHTML='Deine Schilde: '+(left>0?ico('shield','sm').repeat(left):'keine mehr – jede Aufgabe muss sitzen')+' · ein Versuch pro Aufgabe';
}

/* Nur der Aufgabenbereich wird pro Frage neu aufgebaut, nicht der ganze
   Bildschirm. Das war die Hauptursache für das Ruckeln zwischen Aufgaben. */
function buildSessShell(){
 const B=sess.type==='boss'?bossOf(sess.mod):null;
 let h='<div class="lessonhead"><button class="lx" onclick="quitSess()" aria-label="Einheit verlassen">'+ico('close')+'</button>';
 h+='<div class="lprog"><div id="sProg" style="width:0%"></div></div>';
 h+='<span id="sCombo"></span><span class="lshield" id="sShield"></span></div>';
 h+='<div class="card" id="sessRoot">';
 h+='<div class="lmeta"><span class="phase" id="sPhase"></span><span class="hint" id="sCount"></span></div>';
 if(B){
  h+='<div class="bossarena"><div style="text-align:center;min-width:70px"><span id="bossFig">'+character('minus','idle','sm')+'</span><div class="bossname">'+B.n+'</div></div>';
  h+='<div style="flex:1"><div class="bubble" id="bossSay"></div>';
  h+='<div class="bossmeta" style="margin-top:8px">Boss-Energie – besiege ihn mit '+sess.pass+' richtigen</div>';
  h+='<div class="bosshp"><div id="bossHp" style="width:100%"></div></div>';
  h+='<div class="bossmeta" id="bossShields" style="margin-top:6px"></div></div></div>';
 }
 /* Begleiter je Trainingsart – wird einmal gebaut und danach nur noch
    per Klassenwechsel umgeschaltet, nicht neu gerendert. */
 const buddy=SESS_CHAR[sess.type];
 h+='<div class="sesshead"><h2 id="sTitle"></h2>'+
    (buddy?'<span id="sChar">'+character(buddy,'idle','sm')+'</span>':'')+'</div>';
 h+='<div id="taskarea"></div></div>';
 $('#app').innerHTML=h;
 sessRoot=true;
 if(sess.shields==null){
  if(timerH)clearInterval(timerH);
  timerH=setInterval(()=>{
   const el=$('#stimer');
   if(!el||!sess){clearInterval(timerH);timerH=null;return;}
   el.textContent=sessTime();
  },1000);
 }
}
function renderSessTask(){
 if(!sess||!sess.q||!sess.q[sess.i]){go('home');return;}
 const item=sess.q[sess.i];
 const m=modById(item.m);
 if(!sessRoot||!document.getElementById('sessRoot'))buildSessShell();
 $('#sProg').style.width=Math.round(sess.i/sess.q.length*100)+'%';
 const shEl=$('#sShield');
 shEl.className='lshield'+(sess.shields!=null?' shields':'');
 shEl.innerHTML=sess.shields!=null
   ? ico('shield')+' '+Math.max(0,sess.shields)
   : ico('clock')+' <span id="stimer">'+sessTime()+'</span>';
 $('#sPhase').innerHTML=ico(item.phi||'spark','sm')+' '+item.ph;
 $('#sCount').textContent='Aufgabe '+(sess.i+1)+' / '+sess.q.length;
 $('#sCombo').innerHTML=sess.combo>=2
   ? '<span class="comboflame">'+ico('flame','sm')+' x'+sess.combo+'</span>' : '';
 $('#sTitle').innerHTML=modIcon(m)+' '+m.t;
 if(sess.type==='boss')updBossArena();
 mountTask($('#taskarea'),item.m,item.lvl,(c)=>{
  if($('#tfb').classList.contains('ok'))sess.ok++;
  if(sess.combo>sess.maxCombo)sess.maxCombo=sess.combo;
  sess.i++;
  if(sess.shields!=null&&sess.shields<=0){sess.broke=true;renderSessEnd();return;}
  if(sess.type==='boss'&&(sess.ok>=sess.pass||sess.i-sess.ok>sess.q.length-sess.pass)){renderSessEnd();return;}
  if(sess.i>=sess.q.length)renderSessEnd();else renderSessTask();
 },{strict:sess.type==='boss'});
}
function quitSess(){if(timerH){clearInterval(timerH);timerH=null;}sess=null;sessRoot=null;go('home');}

function renderSessEnd(){
 if(timerH){clearInterval(timerH);timerH=null;}
 sessRoot=null;dockMount(null);
 const n=sess.q.length;
 const quote=Math.round(sess.ok/n*100);
 let h='<div class="card">';
 if(sess.type==='boss'){
  const B=bossOf(sess.mod);
  const win=sess.ok>=sess.pass;
  if(win){
   const s=st(sess.mod);s.boss=Math.min(3,s.boss+1);
   if(s.boss===1)scheduleStart(sess.mod);
   addXP(sess.xp);checkBadges();save();
   h+='<div style="text-align:center">'+character('minus','happy','lg')+'</div>';
   h+='<h1 style="text-align:center">Prüfung bestanden</h1>';
   h+='<div class="bossarena"><div class="bubble">'+pick(B.lose)+'</div></div>';
   h+='<p style="text-align:center;font-size:1.15rem">'+modById(sess.mod).t+': jetzt <span class="stars">'+starStr(s.boss)+'</span> · <b>+'+sess.xp+' XP</b></p>';
   h+='<p class="mut" style="text-align:center">'+sess.ok+' richtige Antworten – der Boss hatte keine Chance.</p>';
  }else{
   h+='<div style="text-align:center">'+character('minus','thinking','lg')+'</div>';
   h+='<h1 style="text-align:center">Noch nicht bestanden</h1>';
   h+='<div class="bossarena"><div class="bubble">'+pick(B.win)+'</div></div>';
   h+='<p style="text-align:center">'+sess.ok+' richtig – du brauchst '+sess.pass+'.</p>';
   h+='<p class="mut" style="text-align:center">Kein Drama: Übe noch ein paar Aufgaben, besonders im Fehler-Training, und fordere ihn erneut heraus. Beim zweiten Anlauf klappt es fast immer.</p>';
  }
  h+='<div class="btnrow"><button class="btn big" onclick="go(\'mod\',\''+sess.mod+'\')">Zurück zum Modul</button></div>';

/* ============ Blitzrunde ============ */
const BLITZLEN=300;
function startBlitz(){
 sess={type:'blitz',t0:Date.now(),end:Date.now()+BLITZLEN*1000,ok:0,n:0};
 renderBlitzTask();
}
function blitzPool(){
 const started=MODS.filter(m=>st(m.id).c>0);
 return started.length?started:MODS.slice(0,3);
}
function blitzLeft(){return Math.max(0,Math.ceil((sess.end-Date.now())/1000));}
function renderBlitzTask(){
 if(!sess||sess.type!=='blitz')return;
 if(Date.now()>=sess.end){renderBlitzEnd();return;}
 const m=pick(blitzPool());
 const lvl=pick([1,1,2]);
 if(!sessRoot||!document.getElementById('sessRoot')){
  let h='<div class="lessonhead"><button class="lx" onclick="quitSess()" aria-label="Blitzrunde abbrechen">'+ico('close')+'</button>';
  h+='<span class="blitztime" id="btime">'+fmtT(blitzLeft())+'</span>';
  h+='<div class="lprog"><div id="bProg" style="width:0%;background:var(--warn)"></div></div>';
  h+='<span class="lshield" id="bOk" style="color:var(--ok)"></span></div>';
  h+='<div class="card" id="sessRoot"><div class="lmeta"><span class="phase hot">'+ico('bolt','sm')+' Blitzrunde</span></div>';
  h+='<div class="sesshead"><h2 id="sTitle"></h2><span id="sChar">'+character(SESS_CHAR.blitz,'idle','sm')+'</span></div>';
  h+='<div id="taskarea"></div></div>';
  $('#app').innerHTML=h;
  sessRoot=true;
  if(timerH)clearInterval(timerH);
  timerH=setInterval(()=>{
   if(!sess||sess.type!=='blitz'){clearInterval(timerH);timerH=null;return;}
   if(Date.now()>=sess.end){clearInterval(timerH);timerH=null;renderBlitzEnd();return;}
   const el=$('#btime');if(el)el.textContent=fmtT(blitzLeft());
  },500);
 }
 $('#bProg').style.width=Math.min(100,Math.round(sess.n/25*100))+'%';
 $('#bOk').innerHTML=ico('check')+' '+sess.ok;
 $('#sTitle').innerHTML=modIcon(m)+' '+m.t;
 mountTask($('#taskarea'),m.id,lvl,()=>{
  if($('#tfb')&&$('#tfb').classList.contains('ok'))sess.ok++;
  sess.n++;
  renderBlitzTask();
 },{strict:true,autoNext:true});
}
function fmtT(s){return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);}
function renderBlitzEnd(){

 if(sess.ok>=8)addChest('silver','Starke Blitzrunde');else if(sess.ok>0)addChest('bronze','Blitzrunde gespielt');

/* ============ Themen-Icons ============
   m.ic hält den Icon-Schlüssel (nicht mehr ein Emoji). Eine Formensprache
   für alle 21 Lektionen, gezeichnet im selben 24er-Raster wie die UI-Icons. */
function modIcon(m,cls){
 const k=(m&&m.ic)||'frac';
 return '<svg class="micon'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#m-'+k+'"/></svg>';
}

/* Verbindungsstück zwischen zwei Pfadknoten. o1/o2 sind Rasterstufen 0..4,
   dieselben, die .prow per translateX(%) verschiebt – dadurch passt die
   Kurve auf jeder Bildschirmbreite ohne Nachmessen. */
function pathConn(o1,o2,zustand){
 const x1=50+(o1-2)*8.5, x2=50+(o2-2)*8.5;
 return '<div class="pconn '+zustand+'" aria-hidden="true">'+
  '<svg viewBox="0 0 100 56" preserveAspectRatio="none">'+
   '<path class="pc-line" vector-effect="non-scaling-stroke" '+
   'd="M'+x1+' 0C'+x1+' 26 '+x2+' 30 '+x2+' 56"/></svg></div>';
}

/* ============ Lektions-Pfad ============
   Fünf Stationen: 1× Erklärung (Plus) · 3× Übung (Null) · 1× Prüfung (Minus).
   Zustände: intro · practice · bossAvailable · completed
   Der Pfad liest den vorhandenen Modulzustand, er hält keinen eigenen. */

const LP_NODES=[
 {x:36, y:100,k:'start'},
 {x:106,y:58, k:'practice'},
 {x:176,y:104,k:'practice'},
 {x:246,y:58, k:'practice'},
 {x:316,y:100,k:'boss'}
];
const LP_D='M36 100C66 100 76 58 106 58S146 104 176 104S216 58 246 58S286 100 316 100';
/* Position des Orbs beim letzten Rendern – damit er sichtbar weiterwandert. */
const lpLast={};

/* ---------- Zustand ---------- */
function lessonPhase(id){
 const s=st(id),bs=bossState(id);
 if(bs.done)return 'completed';
 if(!s.seen)return 'intro';
 return bs.unlocked?'bossAvailable':'practice';
}
/* Fortschritt 0..1 über den gesamten Pfad. */
function lessonProgress(id){
 const s=st(id),bs=bossState(id);
 if(bs.done)return 1;
 if(!s.seen)return 0;
 const p=Math.min(1,s.c/bs.t.need);
 return bs.unlocked?.94:.08+p*.78;
}
/* Wie viele Übungsstationen sind erledigt (0..3)? */
function lessonStations(id){
 const s=st(id),bs=bossState(id);
 if(bs.done)return 3;
 if(!s.seen)return 0;
 return Math.min(3,Math.floor(s.c/(bs.t.need/3)));
}

/* ---------- Sterne ---------- */
function lessonStars(v,cls){
 let h='<div class="lp-stars '+(cls||'')+'">';
 for(let i=0;i<3;i++)h+='<span class="lp-star'+(i<v?' on':'')+'">'+ico('star')+'</span>';
 return h+'</div>';
}

/* ---------- Schwierigkeits-Anzeige ---------- */
function diffIndicator(tier){
 const t=BOSSTIERS[Math.min(tier,2)];
 const c={1:0,2:0,3:0};t.lvls.forEach(l=>c[l]++);
 let h='<div class="lp-diff"><div class="lp-difftop"><b>'+t.name+'</b>'+
   '<span>'+t.n+' Aufgaben · höchstens '+(t.n-t.pass)+' Fehler</span></div><div class="lp-bars">';
 [1,2,3].forEach(l=>{
  h+='<span class="lp-bar lvl'+l+'" style="flex:'+Math.max(c[l],0.001)+'" title="Typ '+l+': '+c[l]+' Aufgaben">'+
     (c[l]?c[l]+'× Typ '+l:'')+'</span>';
 });
 return h+'</div></div>';
}

/* ---------- Pfad ---------- */
function lessonPathHTML(id){
 const s=st(id),bs=bossState(id),phase=lessonPhase(id);
 const need=bs.done?0:bs.t.need, doneSt=lessonStations(id);
 const prog=lessonProgress(id);
 const start=lpLast[id]!=null?lpLast[id]:0;   /* Orb startet, wo er zuletzt stand */

 let nodes='';
 LP_NODES.forEach((n,i)=>{
  let cls=n.k,state_;
  if(n.k==='start')      state_=s.seen?'done':'active';
  else if(n.k==='boss')  state_=bs.done?'done':(bs.unlocked?'active':'locked');
  else{const idx=i;      /* Übungsstationen 1..3 */
   state_=doneSt>=idx?'done':(s.seen&&doneSt===idx-1?'active':'locked');}
  const r=n.k==='boss'?24:19;
  nodes+='<g class="lp-node lp-'+n.k+' is-'+state_+'" transform="translate('+n.x+','+n.y+')">'+
    '<circle class="lp-pulse" r="'+(r+7)+'"/>'+
    '<circle class="lp-disc" r="'+r+'"/>'+
    '<g class="lp-glyph">'+lpGlyph(n.k,state_)+'</g>'+
   '</g>';
 });

 let h='<div class="lp" data-lp="'+id+'">';
 h+='<svg class="lp-svg" viewBox="0 0 352 152" aria-hidden="true">'+
    '<path class="lp-track" d="'+LP_D+'" pathLength="100"/>'+
    '<path class="lp-fill" d="'+LP_D+'" pathLength="100" style="stroke-dashoffset:'+(100-start*100)+'"/>'+
    nodes+
    '<g class="lp-orb"><circle class="lp-orb-glow" r="11"/><circle class="lp-orb-core" r="5"/></g>'+
    '</svg>';
 /* Klartext darunter – der wichtigste Teil für das Verständnis */
 h+='<div class="lp-legend">';
 if(phase==='intro')
  h+='<b>Schritt 1:</b> Lies die Erklärung von Plus.';
 else if(phase==='practice')
  h+='<b>Übe mit Null:</b> noch <b>'+Math.max(0,need-s.c)+'</b> von '+need+' Aufgaben bis zur Prüfung.';
 else if(phase==='bossAvailable')
  h+='<b>Prüfung frei.</b> Minus wartet – du kannst aber weiter üben.';
 else
  h+='<b>Lektion gemeistert.</b> Alle drei Sterne verdient.';
 h+='</div>';
 return h+'</div>';
}

function lpGlyph(k,state_){
 if(k==='start')   return '<path d="M-8 0h16M0 -8v16"/>';
 if(k==='boss')    return state_==='locked'
   ? '<path d="M-6 -1v-4a6 6 0 0 1 12 0v4" fill="none"/><rect x="-8" y="-1" width="16" height="11" rx="3" stroke="none" class="lp-lockbody"/>'
   : '<path d="M-10 0h20"/>';
 return '<circle r="7" fill="none"/>';
}

/* ---------- Nach dem Rendern: Orb setzen, Funke auslösen ---------- */
function lessonPathMount(id){
 const wrap=document.querySelector('.lp[data-lp="'+id+'"]');
 if(!wrap)return;
 const track=wrap.querySelector('.lp-track'),
       fill=wrap.querySelector('.lp-fill'),
       orb=wrap.querySelector('.lp-orb');
 if(!track||!orb)return;
 const prog=lessonProgress(id);
 const put=p=>{
  try{const L=track.getTotalLength(),pt=track.getPointAtLength(L*p);
   orb.setAttribute('transform','translate('+pt.x+','+pt.y+')');}catch(e){}
 };
 put(lpLast[id]!=null?lpLast[id]:prog);
 /* im nächsten Frame auf den neuen Stand – die CSS-Transition macht die Fahrt */
 const apply=()=>{
  put(prog);
  if(fill)fill.style.strokeDashoffset=String(100-prog*100);
  lpLast[id]=prog;
 };
 requestAnimationFrame(()=>requestAnimationFrame(apply));
 /* Sicherheitsnetz: feuert requestAnimationFrame nicht (Tab im Hintergrund),
    wäre der Balken sonst dauerhaft falsch. apply ist mehrfach aufrufbar. */
 setTimeout(apply,260);
}

 {q:'Vereinfache: 2<sup>3</sup> · 2<sup>4</sup>',o:['2<sup>7</sup>','2<sup>12</sup>','4<sup>7</sup>'],a:0,ok:'Gleiche Basis → Exponenten addieren. 3 + 4 = 7!',no:'Gleiche Basis, Mal-Zeichen → Exponenten ADDIEREN, nicht multiplizieren.'},
 {m:'Wurzeln sind die Umkehrung: Sie fragen „Welche Zahl mal sich selbst…?"',b:wz(49)+' = 7, denn 7² = 49'},
 {m:'Große Wurzeln vereinfachst du über Quadratzahlen:',b:wz(50)+' = '+wz('25 · 2')+' = 5'+wz(2)},
 {q:'Vereinfache: '+wz(72),o:['6'+wz(2),'36'+wz(2),'8'+wz(3)],a:0,ok:'Richtig. 72 = 36 · 2 und '+wz(36)+' = 6.',no:'Suche die größte Quadratzahl in 72: Es ist 36, denn 72 = 36 · 2.'},
 {m:'Zum Schluss: Negative Exponenten bedeuten <b>Kehrwert</b>.',b:'2<sup>−3</sup> = '+frac(1,'2<sup>3</sup>')+' = '+frac(1,8)},
 {q:'Was ist 5<sup>−2</sup>?',o:[frac(1,25),'−25','−10'],a:0,ok:'Du bist bereit für die Prüfung! Kehrwert von 5² = 25.',no:'Negativer Exponent heißt NICHT negative Zahl – sondern 1 geteilt durch 5².'},
 {m:'Erst üben, dann der Test. Nimm dir für die Exponenten Zeit.'}],
ter:[
 {m:'Ein Term ist ein Rechenausdruck ohne Gleichheitszeichen. Ihn umzuformen ist die wichtigste Fertigkeit der ganzen Algebra.'},
 {m:'Regel Nr. 1: Nur <b>gleichartige</b> Teile lassen sich zusammenfassen.',b:'3x + 5x = 8x&nbsp;&nbsp;&nbsp;aber:&nbsp;&nbsp;3x + 5y bleibt 3x + 5y'},
 {q:'Was ist 2x + 3y + 4x?',o:['6x + 3y','9xy','6x + 4y'],a:0,ok:'Sauber sortiert! x zu x, y bleibt allein.',no:'Sortiere: nur die x-Teile zusammenfassen (2x + 4x). Das y bleibt eigenständig!'},
 {m:'Werkzeug Nr. 2: <b>Ausmultiplizieren</b> – die Zahl vor der Klammer trifft jeden darin.',b:'2(x + 3) = 2x + 6'},
 {q:'Multipliziere aus: 3(2a − 4)',o:['6a − 12','6a − 4','5a − 7'],a:0,ok:'Beide getroffen: 3·2a und 3·(−4).',no:'Die 3 muss BEIDE Teile treffen: 3 · 2a = 6a und 3 · (−4) = −12.'},
 {m:'Werkzeug Nr. 3: <b>Ausklammern</b> – das Gegenteil. Gemeinsamen Faktor rausziehen.',b:'6x + 12 = 6(x + 2)'},
 {q:'Klammere aus: 10y + 15',o:['5(2y + 3)','10(y + 15)','5(2y + 15)'],a:0,ok:'Der ggT 5 sauber rausgezogen. Probe: 5·2y + 5·3 = 10y + 15 ✓',no:'Was teilt 10 UND 15? Die 5! Also 5 · (… + …).'},
 {m:'Gute Gewohnheit: Nach jedem Umformen kurz die <b>Probe</b> durch Rückwärtsrechnen. Jetzt du.'}],
glg:[
 {m:'Hier gilt ein einziges Gesetz, und daran hältst du dich immer: <b>Beide Seiten werden gleich behandelt.</b>'},
 {m:'Eine Gleichung ist eine Waage im Gleichgewicht. Was du links tust, musst du auch rechts tun.',b:'2x + 3 = 11'},
 {m:'Ziel: x allein stellen. Wir räumen Schritt für Schritt auf – zuerst die +3 durch −3 auf beiden Seiten.',b:'2x + 3 = 11&nbsp;&nbsp;| −3<br>2x = 8'},
 {q:'Und jetzt? Wie bekommst du das x ganz allein?',o:['Beide Seiten durch 2 teilen','Auf beiden Seiten −2 rechnen','Links das x streichen'],a:0,ok:'Genau so. 2x : 2 = x und 8 : 2 = 4.',no:'Vor dem x steht „2 mal" – das Gegenteil von Mal ist Geteilt.'},
 {m:'Das Ergebnis:',b:'x = 4&nbsp;&nbsp;&nbsp;Probe: 2 · 4 + 3 = 11 ✓'},
 {q:'Dein Fall: Löse 3x = 21',o:['x = 7','x = 18','x = 63'],a:0,ok:'Einwandfrei: 21 : 3 = 7.',no:'Beide Seiten durch 3 teilen: 21 : 3 = ?'},
 {m:'Steht x auf beiden Seiten, hole zuerst alle x auf eine Seite.',b:'3x + 5 = 2x + 12&nbsp;&nbsp;| −2x<br>x + 5 = 12&nbsp;&nbsp;| −5<br>x = 7'},
 {q:'Löse: 5x + 3 = 18',o:['x = 3','x = 4','x = 15'],a:0,ok:'Fertig. −3, dann :5 ergibt 3.',no:'Erst −3 auf beiden Seiten (→ 5x = 15), dann durch 5.'},
 {m:'Und vergiss nie die <b>Probe</b> – Ergebnis einsetzen und prüfen, ob beide Seiten gleich sind. Jetzt ins Training.'}],
ung:[
 {m:'Das Ungleichheitszeichen ist wie ein Krokodilmaul: Es öffnet sich immer zur <b>größeren</b> Zahl – 3 &lt; 5. Merk dir das Maul.'},
 {q:'Zu welcher Zahl zeigt das offene Maul bei 8 &gt; 2?',o:['Zur 8 – die ist größer','Zur 2','Zu beiden'],a:0,ok:'Genau – das Maul zeigt immer zur größeren Zahl.',no:'Das offene Ende zeigt immer zur GRÖSSEREN Zahl.'},
 {m:'Ungleichungen löst du fast genau wie Gleichungen: plus, minus, mal, geteilt auf beiden Seiten.',b:'2x − 4 &lt; 6&nbsp;&nbsp;| +4<br>2x &lt; 10&nbsp;&nbsp;| :2<br>x &lt; 5'},
 {m:'ABER – jetzt die eine Ausnahme: Multiplizierst oder dividierst du mit einer <b>negativen</b> Zahl, dreht sich das Zeichen um.',b:'−2x &gt; 8&nbsp;&nbsp;| :(−2) ⚠️ Zeichen dreht sich!<br>x &lt; −4'},
 {q:'Löse: −3x ≤ 12',o:['x ≥ −4','x ≤ −4','x ≤ 4'],a:0,ok:'Genau. Durch −3 geteilt → Maul dreht sich: aus ≤ wird ≥.',no:'Du teilst durch −3 (negativ!) → das Zeichen MUSS sich umdrehen.'},
 {q:'Und bei x + 5 &gt; 8 – dreht sich das Zeichen?',o:['Nein, bei Plus/Minus nie','Ja, immer','Nur bei geraden Zahlen'],a:0,ok:'Richtig. Nur bei Mal/Geteilt mit NEGATIVEN Zahlen dreht sich das Zeichen. Hier: x &gt; 3.',no:'Plus und Minus sind harmlos – nur negatives Multiplizieren/Dividieren dreht das Zeichen.'},
 {m:'Das war schon das ganze Geheimnis. Im Test wird genau diese Stelle geprüft – vergiss das Umdrehen nicht.'}],
bin:[
 {m:'Drei Formeln, die lange Rechnungen kurz machen. Du brauchst sie vorwärts zum Ausmultiplizieren und rückwärts zum Faktorisieren.'},
 {m:'Hier die drei Formeln – gleich siehst du, was dahintersteckt:',b:'(a + b)² = a² + 2ab + b²<br>(a − b)² = a² − 2ab + b²<br>(a + b)(a − b) = a² − b²'},
 {q:'Achtung, beliebter Trugschluss: Ist (a + b)² dasselbe wie a² + b²?',o:['Nein – der Mittelterm 2ab fehlt!','Ja, klar','Nur wenn a = b'],a:0,ok:'Du durchschaust die Illusion! Probier es mit a=1, b=2: (1+2)²=9, aber 1²+2²=5.',no:'Vorsicht, Falle! Teste mit Zahlen: (1+2)² = 9, aber 1² + 2² = 5. Der Mittelterm 2ab fehlt!'},
 {m:'So wirkt Formel 1 in Aktion:',b:'(x + 3)² = x² + 2·x·3 + 3² = x² + 6x + 9'},
 {q:'Multipliziere aus: (a − 5)²',o:['a² − 10a + 25','a² − 25','a² + 10a − 25'],a:0,ok:'Genau. a², dann 2·a·5 mit Minus, dann 5².',no:'Formel 2: a² MINUS 2·a·5 PLUS 5². Das letzte Vorzeichen ist immer Plus!'},
 {m:'Wichtig: Es geht auch <b>rückwärts</b>! Erkenne die Formel im Term.',b:'x² − 10x + 25 = (x − 5)²&nbsp;&nbsp;&nbsp;Check: 2 · x · 5 = 10x ✓'},
 {q:'Faktorisiere: x² − 9',o:['(x + 3)(x − 3)','(x − 3)²','(x − 9)(x + 1)'],a:0,ok:'Formel 3 rückwärts – a² − b² zerfällt in (a+b)(a−b)!',no:'Kein Mittelterm? Dann ist es die 3. Formel: a² − b² = (a + b)(a − b).'},
 {m:'Mit diesen drei Formeln kommst du durch Faktorisieren, quadratische Gleichungen und später durchs Abitur. Ab ins Training.'}],
fak:[
 {m:'Faktorisieren heißt: etwas in seine <b>Bausteine</b> zerlegen – aus einer Summe wird ein Produkt.'},
 {m:'Werkzeug 1: Den größten gemeinsamen Teiler ausklammern.',b:'8x + 12 = 4(2x + 3)'},
 {q:'Klammere aus: 15m − 10',o:['5(3m − 2)','5(3m − 10)','10(5m − 1)'],a:0,ok:'Richtig. ggT von 15 und 10 ist 5.',no:'Was teilt 15 UND 10? Die 5. Dann: 15m:5 = 3m und 10:5 = 2.'},
 {m:'Werkzeug 2: Steckt in jedem Teil ein x, zieh es raus.',b:'x² + 5x = x(x + 5)'},
 {m:'Werkzeug 3 – der Trinom-Trick: Suche zwei Zahlen mit passendem <b>Produkt</b> und passender <b>Summe</b>.',b:'x² + 5x + 6:&nbsp;Produkt 6, Summe 5 → 2 und 3<br>x² + 5x + 6 = (x + 2)(x + 3)'},
 {q:'Welche zwei Zahlen brauchst du für x² + 7x + 12?',o:['3 und 4','6 und 2','12 und 1'],a:0,ok:'Passt. 3 · 4 = 12 und 3 + 4 = 7 → (x+3)(x+4).',no:'Produkt muss 12 sein, Summe 7. Geh die Paare durch: 1·12, 2·6, 3·4…'},
 {q:'Und bei Minus? x² − 2x − 8: Welches Paar passt?',o:['−4 und +2','+4 und −2','−4 und −2'],a:0,ok:'Stark! (−4)·2 = −8 ✓ und −4+2 = −2 ✓ → (x−4)(x+2).',no:'Produkt −8 (ein Minus!), Summe −2. Teste: −4 und +2.'},
 {m:'Warum das Ganze? Zerlegte Produkte lösen dir die quadratischen Gleichungen fast von selbst. Jetzt üben.'}],
brt:[
 {m:'Bruchterme sind Brüche mit Variablen. Es gelten dieselben Regeln wie bei Zahlen – plus eine neue: die <b>Null im Nenner</b> ist verboten.'},
 {q:'Warum ist '+frac(3,'x − 1')+' für x = 1 verboten?',o:['Weil der Nenner dann 0 wird','Weil das Ergebnis negativ wird','Weil 3 eine Primzahl ist'],a:0,ok:'Genau! Durch 0 teilen geht nie. Wir notieren: x ≠ 1 (Definitionsmenge).',no:'Setz mal x = 1 ein: Der Nenner wird 1 − 1 = 0. Und durch 0 teilen ist verboten!'},
 {m:'Gleiche Nenner? Dann einfach die Zähler verrechnen.',b:frac(2,'x')+' + '+frac(3,'x')+' = '+frac(5,'x')},
 {m:'Verschiedene Nenner? Erst auf den <b>Hauptnenner</b> erweitern – wie bei Zahlbrüchen.',b:frac(1,'x')+' + '+frac(1,'2x')+' = '+frac(2,'2x')+' + '+frac(1,'2x')+' = '+frac(3,'2x')},
 {q:'Fasse zusammen: '+frac(3,'a')+' − '+frac(1,'2a'),o:[frac(5,'2a'),frac(2,'a'),frac(3,'2a')],a:0,ok:'Sauber gerechnet. '+frac(6,'2a')+' − '+frac(1,'2a')+' = '+frac(5,'2a')+'.',no:'Hauptnenner 2a: erweitere '+frac(3,'a')+' zu '+frac(6,'2a')+', dann Zähler subtrahieren.'},
 {m:'Bruchgleichungen löst du so: verbotene x notieren, dann mit dem Nenner multiplizieren – weg ist der Bruch.',b:frac(3,'x − 1')+' = 6&nbsp;&nbsp;(x ≠ 1)&nbsp;&nbsp;| · (x − 1)<br>3 = 6x − 6 → x = 1,5 ✓ erlaubt'},
 {q:'Löse: '+frac('x',2)+' = 5',o:['x = 10','x = 2,5','x = 7'],a:0,ok:'Richtig. Beide Seiten mal 2.',no:'Multipliziere beide Seiten mit 2 – dann steht x allein.'},
 {m:'Merke: erst Definitionsmenge, dann rechnen, am Ende prüfen, ob die Lösung erlaubt ist. Jetzt üben.'}],
qua:[
 {m:'Quadratische Gleichungen haben meist <b>zwei Lösungen</b>. Wir schauen uns an, wie du beide zuverlässig findest.'},
 {m:'Das wichtigste Werkzeug – die Nullprodukt-Regel:',b:'Ein Produkt ist 0, wenn (mindestens) ein Faktor 0 ist.<br>x(x − 5) = 0 → x = 0 oder x = 5'},
 {q:'(x − 2)(x + 3) = 0. Wie lauten die Lösungen?',o:['x = 2 oder x = −3','x = −2 oder x = 3','x = 2 oder x = 3'],a:0,ok:'Volltreffer. Jeder Faktor wird einzeln 0 gesetzt – Vorzeichen drehen sich.',no:'Setze jeden Faktor = 0: x − 2 = 0 → x = 2. Und x + 3 = 0 → x = −3.'},
 {m:'Fehlt das konstante Glied, klammere x aus:',b:'x² − 5x = 0 → x(x − 5) = 0 → x₁ = 0, x₂ = 5'},
 {m:'Steht ein Trinom da, nutze den Produkt-Summen-Trick:',b:'x² + 6x + 8 = 0 → (x + 2)(x + 4) = 0 → x₁ = −2, x₂ = −4'},
 {q:'Löse: x² = 9',o:['x = 3 oder x = −3','nur x = 3','x = 81'],a:0,ok:'Beide Lösungen gefunden. (−3)² ist auch 9 – das vergessen viele.',no:'Achtung: Auch (−3)² = 9! Beim Wurzelziehen gibt es ±.'},
 {q:'Erster Schritt bei x² + 5x = 14?',o:['Alles auf eine Seite: x² + 5x − 14 = 0','Wurzel ziehen','Durch x teilen'],a:0,ok:'Korrekt. Erst = 0 herstellen, dann faktorisieren: (x+7)(x−2)=0.',no:'Die Regel braucht eine 0 auf einer Seite – also erst −14 rechnen. (Durch x teilen verliert eine Lösung!)'},
 {m:'Denk immer an BEIDE Lösungen. Erst trainieren, dann der Test.'}],
txt:[
 {m:'Textaufgaben sind Übersetzungsarbeit: Deutsch → Mathematik. Genau diese Fähigkeit brauchst du bei jeder unbekannten Klausuraufgabe.'},
 {m:'Ein kleines Wörterbuch:',b:'„das Dreifache" → 3x&nbsp;&nbsp;„um 5 mehr" → +5<br>„die Summe" → +&nbsp;&nbsp;„ergibt / ist" → ='},
 {q:'Übersetze: „Das Doppelte einer Zahl plus 3 ergibt 11."',o:['2x + 3 = 11','x² + 3 = 11','2(x + 3) = 11'],a:0,ok:'Perfekt übersetzt.',no:'„Das Doppelte einer Zahl" = 2x. Dann „plus 3" und „ergibt 11".'},
 {m:'Und dann? Einfach lösen wie immer:',b:'2x + 3 = 11 → 2x = 8 → x = 4'},
 {m:'Der 4-Schritte-Plan:',b:'1. Was ist gesucht? → nenne es x<br>2. Text Stück für Stück übersetzen<br>3. Gleichung lösen<br>4. Im Satz antworten + Sinn prüfen!'},
 {q:'„Die Summe zweier aufeinanderfolgender Zahlen ist 31." Welcher Ansatz stimmt?',o:['x + (x + 1) = 31','x + x = 31','2x + 2 = 31'],a:0,ok:'Genau – die zweite Zahl ist genau 1 größer: x und x+1. → 15 und 16.',no:'Aufeinanderfolgend heißt: die zweite Zahl ist x + 1. Also x + (x+1) = 31.'},
 {q:'Warum lohnt Schritt 4 (Sinn prüfen)?',o:['Weil z. B. −3 Personen unmöglich sind','Weil man sonst Punkte geschenkt bekommt','Er lohnt nicht'],a:0,ok:'Gut mitgedacht. Ein Alter von −3 oder 2,5 Personen zeigt sofort: Rechenfehler!',no:'Denk nach: Wenn „Anzahl Personen = −3" rauskommt, MUSS ein Fehler drin sein. Das fängt Schritt 4 ab.'},
 {m:'Genau diese Übersetzungskunst wird in Klausuren geprüft. Hier lohnt sich das Üben besonders.'}],
fun:[
 {m:'Eine Funktion ist wie Jonglieren: <b>Jeder Ball (x) landet in genau einer Hand (y)</b> – nie in zwei.'},
 {q:'Welche Zuordnung ist eine Funktion?',o:['x ↦ 2x + 1','x ↦ ±'+wz('x'),'Jede Zahl bekommt ihre zwei Nachbarn'],a:0,ok:'Richtig: genau ein Ergebnis pro x – das ist eine Funktion.',no:'Bei ± bekommt ein x ZWEI Werte – ein Ball in zwei Händen? Unmöglich!'},
 {m:'f(x) liest du als „f von x": Wirf x hinein, ein y kommt raus.',b:'f(x) = 2x + 1<br>f(3) = 2 · 3 + 1 = 7'},
 {q:'f(x) = x² − 1. Berechne f(2).',o:['3','1','5'],a:0,ok:'Richtig: 2² − 1 = 3.',no:'Setze die 2 ein: 2² = 4, dann − 1.'},
 {m:'Zwei Punkte bestimmst du bei jedem Graphen zuerst:',b:'y-Achsenabschnitt: f(0) berechnen<br>Nullstelle: f(x) = 0 lösen'},
 {q:'f(x) = 2x − 6. Wo ist die Nullstelle?',o:['x = 3','x = −6','x = 0'],a:0,ok:'Genau. 2x − 6 = 0 → x = 3. Dort schneidet der Graph die x-Achse.',no:'Setze f(x) = 0: also 2x − 6 = 0 und nach x auflösen.'},
 {m:'Das war die Grundlage ALLER Funktionen – Geraden, Parabeln, Exponentialkurven. Alle folgen dieser Regel. Weiter zum Training.'}],
lin:[
 {m:'Lineare Funktionen sind wie Wanderwege: immer gleichmäßig steil. Die Karte dazu ist <b>y = mx + b</b>.'},
 {m:'m ist die <b>Steigung</b> (wie steil), b der <b>Startpunkt</b> auf der y-Achse.',b:graphSVG([{f:x=>2*x+1},{dot:[0,1],col:'#ffc233'},{dot:[1,3],col:'#35d39a'}])+'y = 2x + 1: Start bei 1 (orange), pro Schritt nach rechts 2 hoch (grün)'},
 {q:'Bei y = 3x − 2: Was passiert mit y, wenn x um 1 wächst?',o:['y wächst um 3','y sinkt um 2','y wächst um 1'],a:0,ok:'Genau. Genau das bedeutet m.',no:'Die Zahl VOR dem x (m = 3) sagt: pro Schritt nach rechts geht es 3 nach oben.'},
 {q:'Und wo startet y = 3x − 2 auf der y-Achse?',o:['Bei −2','Bei 3','Bei 0'],a:0,ok:'Genau: b = −2!',no:'b ist die Zahl OHNE x – hier −2. Dort schneidet die Gerade die y-Achse.'},
 {m:'Steigung aus zwei Punkten? Höhenunterschied durch Wegstrecke:',b:'m = '+frac('y₂ − y₁','x₂ − x₁')+'&nbsp;&nbsp;z. B. (0|2) und (2|6): m = '+frac(4,2)+' = 2'},
 {m:'Wo schneiden sich zwei Geraden? <b>Gleichsetzen!</b>',b:'2x + 1 = x + 4 → x = 3 → y = 7<br>Schnittpunkt (3 | 7)'},
 {q:'Schnittpunkt von y = 2x und y = x + 5: Wie lautet der Ansatz?',o:['2x = x + 5','2x + x = 5','y = 2x + 5'],a:0,ok:'Beide Geraden treffen sich, wo beide y gleich sind – also Terme gleichsetzen. (x = 5, y = 10)',no:'Am Schnittpunkt haben beide dasselbe y – setze die Terme gleich: 2x = x + 5.'},
 {m:'Mit m und b liest du jede Gerade wie eine Wanderkarte. Jetzt Übungszeit.'}],
qfk:[
 {m:'Jeder geworfene Ball fliegt eine <b>Parabel</b> – genau die Kurve der quadratischen Funktionen.'},
 {m:'Die Scheitelpunktform verrät fast alles:',b:'f(x) = a(x − d)² + e → Scheitel S(d | e)<br>'+graphSVG([{f:x=>(x-2)*(x-2)-1},{dot:[2,-1],col:'#ffc233'}])+'f(x) = (x − 2)² − 1: Scheitel S(2 | −1)'},
 {q:'Scheitelpunkt von f(x) = (x + 1)² + 3?',o:['S(−1 | 3)','S(1 | 3)','S(−1 | −3)'],a:0,ok:'Genau. (x + 1) = (x − (−1)) → d = −1. Das Vorzeichen dreht sich!',no:'Achtung, Trick: (x + 1)² heißt d = −1, denn die Form ist (x − d)². e = +3 bleibt.'},
 {q:'f(x) = −2x² + 3: Wie ist die Parabel geöffnet?',o:['Nach unten (a < 0)','Nach oben','Gar nicht'],a:0,ok:'Erst hoch, dann runter: a = −2 ist negativ!',no:'Entscheidend ist die Zahl vor x²: negativ → Öffnung nach unten.'},
 {m:'Nullstellen = wo der Ball den Boden trifft. Setze f(x) = 0:',b:'(x − 1)² − 4 = 0 → (x − 1)² = 4<br>x − 1 = ±2 → x = 3 oder x = −1'},
 {q:'Parabel öffnet nach oben, Scheitel liegt ÜBER der x-Achse. Wie viele Nullstellen?',o:['Keine','Genau eine','Zwei'],a:0,ok:'Richtig. Die Kurve kommt nie unter den Scheitel – kein Bodenkontakt.',no:'Stell es dir vor: Tiefster Punkt über der Achse, Kurve geht nach oben – sie kann die Achse nie berühren.'},
 {m:'Scheitel, Öffnung, Nullstellen – das Dreier-Set jeder Parabel-Analyse. Auf ins Training.'}],
exp:[
 {m:'Bakterien wachsen nicht mit Plus, sondern mit <b>Mal</b>. Genau das ist exponentielles Wachstum.'},
 {m:'Wachstum um 10 % heißt: jedes Jahr <b>mal 1,1</b> – vom neuen Wert!',b:'100 € → 110 € → 121 € (nicht 120!)<br>Zinseszins: Es wird immer vom neuen Betrag gerechnet'},
 {q:'Ein Bestand wächst um 25 % pro Jahr. Der Faktor ist…',o:['1,25','0,25','25'],a:0,ok:'Korrekt beobachtet! 1 + 25/100 = 1,25.',no:'Faktor = 1 + p/100. Bei +25 % also 1 + 0,25.'},
 {q:'Und bei 20 % <b>Abnahme</b> pro Jahr?',o:['0,8','1,2','−0,2'],a:0,ok:'Präzise! Es bleiben 80 % übrig: Faktor 0,8.',no:'Abnahme: 1 − 20/100 = 0,8. Es bleiben 80 % übrig.'},
 {m:'Nach n Schritten gilt:',b:'Endwert = Startwert · Faktor<sup>n</sup><br>200 g, jedes Jahr halbiert: 200 · 0,5³ = 25 g'},
 {q:'Was wächst langfristig am schnellsten?',o:['y = 2<sup>x</sup>','y = x²','y = 1000x'],a:0,ok:'Exponentiell schlägt ALLES – bei x = 20 ist 2²⁰ schon über eine Million!',no:'Vergleich bei x = 20: 2²⁰ ≈ 1 000 000, x² = 400, 1000x = 20 000. Mal schlägt Plus!'},
 {m:'Merke: Prozent-Wachstum heißt multiplizieren, nie addieren. Jetzt du.'}],
log:[
 {m:'Es gibt nur eine Frage, die der Logarithmus stellt – aber die hat es in sich: <b>„Hoch wie viel?"</b>'},
 {m:'Der Logarithmus ist die Umkehrung des Potenzierens:',b:'log<sub>2</sub>(8) = 3, weil 2³ = 8<br>Frage: „2 hoch wie viel ergibt 8?"'},
 {q:'log<sub>2</sub>(16) = ?',o:['4','8','2'],a:0,ok:'Genau: 2·2·2·2 = 16, also hoch 4.',no:'Frag dich: 2 hoch wie viel ergibt 16? Zähle: 2, 4, 8, 16…'},
 {q:'log<sub>10</sub>(1000) = ?',o:['3','100','10'],a:0,ok:'Richtig – drei Nullen, dreimal die 10.',no:'10 hoch wie viel ergibt 1000? Zähle die Nullen!'},
 {m:'Damit löst du Exponentialgleichungen:',b:'3<sup>x</sup> = 81 → x = log<sub>3</sub>(81) = 4<br>denn 3 · 3 · 3 · 3 = 81'},

/* ============ Lektions-Player ============ */
let les=null;
function startLesson(id,toSession){
 if(!LESSONS[id]){renderModule(id,'ueben');return;}
 les={mod:id,i:0,toSession:!!toSession,answered:false,tried:false};
 renderLesson();
}
function renderLesson(){
 const L=LESSONS[les.mod],step=L[les.i],m=modById(les.mod);
 let h='<div class="lessonhead"><button class="lx" onclick="lesQuit()" aria-label="Lektion verlassen">'+ico('close')+'</button>';
 h+='<div class="lprog"><div style="width:'+Math.round(les.i/L.length*100)+'%"></div></div>';
 h+='<span class="lshield" style="color:var(--ink-3)">'+(les.i+1)+' / '+L.length+'</span></div>';
 h+='<div class="card">';
 h+='<div class="lmeta"><span class="phase grow">'+ico('book','sm')+' Lektion · '+m.t+'</span></div>';
 h+='<div class="mentorarena"><div style="text-align:center;min-width:70px"><span id="menFig">'+character('plus','talking','sm')+'</span><div class="mname">'+TEACHER.n+'</div></div>';
 h+='<div style="flex:1"><div class="bubble" id="menSay">'+(step.q?step.q:step.m)+'</div></div></div>';
 let board='';
 for(let k=0;k<=les.i;k++)if(L[k].b)board+='<div class="tl'+(k===les.i?' neu':'')+'">'+L[k].b+'</div>';
 if(board)h+='<div class="tafel">'+board+'</div>';
 if(step.q){
  if(!les.perm||les.perm.length!==step.o.length)les.perm=shuffled(step.o.map((_,i)=>i));
  les.perm.forEach((oi,i)=>{h+='<button class="mcopt" onclick="lesPick(this,'+i+')">'+step.o[oi]+'</button>';});
 }
 h+='<div class="btnrow taskbar"><button class="btn" id="lesNext" onclick="lesNext()" '+(step.q?'style="display:none"':'')+'>'+
  (les.i===L.length-1?'Lektion abschließen':'Weiter '+ico('right'))+'</button></div>';
 h+='</div>';
 const app=$('#app');
 app.innerHTML=h;
 dockMount(app);
 const nx=$('#lesNext');if(nx&&!step.q)nx.focus({preventScroll:true});
}
function lesPick(btn,i){
 if(!les||les.answered)return;
 if(typeof sfx!=='undefined')sfx.click();
 const step=LESSONS[les.mod][les.i];
 const fig=$('#menFig .char'),say=$('#menSay');
 const orig=les.perm?les.perm[i]:i;
 if(orig===step.a){
  les.answered=true;
  btn.classList.add('ok');
  document.querySelectorAll('.mcopt').forEach(b=>b.disabled=true);
  if(say)say.innerHTML=ico('check','sm')+' '+step.ok;
  charState(fig,'happy');
  if(!les.tried)addXP(5);
  const nx=$('#lesNext');if(nx){nx.style.display='';nx.focus({preventScroll:true});syncChrome();}
 }else{
  les.tried=true;
  btn.classList.add('bad');btn.disabled=true;
  if(say)say.innerHTML=ico('spark','sm')+' '+step.no;
  charState(fig,'thinking');
 }
}
function lesNext(){
 if(!les)return;
 les.i++;les.answered=false;les.tried=false;les.perm=null;
 if(les.i>=LESSONS[les.mod].length)lesEnd();else renderLesson();
}
function lesQuit(){
 const toSess=les&&les.toSession;les=null;
 if(toSess)sess=null;
 go('home');
}
function lesEnd(){
 dockMount(null);
 const id=les.mod,m=modById(id),s=st(id);
 const first=!s.seen;
 s.seen=true;
 if(first)addXP(25);
 saveNow('flash');
 let h='<div class="card"><div style="text-align:center">'+character('plus','happy','md')+'</div>';
 h+='<h1 style="text-align:center">Lektion geschafft'+(first?' · <b>+25 XP</b>':'')+'</h1>';
 h+='<p class="mut" style="text-align:center">'+TEACHER.n+': „Stark gemacht. Jetzt festigt das Üben alles – Wissen wächst beim Rechnen."</p>';
 h+='<h2 style="margin-top:18px">'+ico('book')+'Dein Spickzettel</h2>'+m.ex;
 if(les.toSession){
  h+='<button class="btn big" style="margin-top:14px" onclick="lesToSess()">Weiter zum Training</button>';
 }else{
  h+='<div class="btnrow"><button class="btn big" onclick="les=null;renderModule(\''+id+'\',\'ueben\')">Jetzt üben</button></div>';
  h+='<button class="crumb" onclick="go(\'home\')">Zur Übersicht</button>';
 }
 h+='</div>';
 $('#app').innerHTML=h;cheer();
}
function lesToSess(){les=null;renderSessTask();}

puzzle:{manual:true,

  let h='<p class="hint">Tippe die Schritte in der richtigen Reihenfolge an. Nochmal tippen nimmt zurück.</p>';
  h+='<div class="gslots" id="gSlots"><span class="ghint">noch nichts gewählt</span></div>';
  h+='<div id="gPool">';
  t.order.forEach((idx,i)=>{h+='<button class="steprow" id="gs'+i+'" onclick="puzTap('+i+')">'+t.steps2[idx]+'</button>';});
  h+='</div>';
  return h;},
 init:function(t){gState={picked:[]};},

  const want=t.steps2.map((_,i)=>i);
  return sameOrder(gState.picked.map(i=>t.order[i]),want);}
},

fehler:{manual:false,

/* --- 4) Term-Baukasten: Ergebnis aus Bausteinen zusammensetzen --- */
bau:{manual:true,

  h+='<div class="gslots" id="gSlots"><span class="ghint">dein Term erscheint hier</span></div><div id="gPool">';

  return t.acc.some(a=>normTxt(a)===normTxt(got));}
},

memory:{manual:false,

  return h;},

/* --- 8) Sortieren nach Größe --- */
sortier:{manual:true,
 html:function(t){
  let h='<p class="hint">Tippe die Werte der Größe nach an – vom kleinsten zum größten.</p>';
  h+='<div class="gslots" id="gSlots"><span class="ghint">noch nichts gewählt</span></div><div id="gPool">';
  t.items.forEach((it,i)=>{h+='<button class="chip-tap" id="gc'+i+'" onclick="sortTap('+i+')">'+it.txt+'</button>';});
  return h+'</div>';},
 init:function(t){gState={picked:[]};},
 check:function(t){
  if(gState.picked.length!==t.items.length)return false;
  const vals=gState.picked.map(i=>t.items[i].v);
  return vals.every((v,i)=>i===0||v>=vals[i-1]);}
}
};

/* ---- Interaktionen ---- */
function slotsRender(txts){
 const el=$('#gSlots');if(!el)return;
 el.innerHTML=txts.length?txts.map(x=>'<span class="slotchip">'+x+'</span>').join(''):'<span class="ghint">noch nichts gewählt</span>';
}
function puzTap(i){
 if(cur.done)return;
 const t=cur.task,p=gState.picked,at=p.indexOf(i);
 if(at>=0)p.splice(at,1);else p.push(i);
 document.querySelectorAll('.steprow').forEach((b,k)=>{
  const pos=p.indexOf(k);
  b.classList.toggle('sel',pos>=0);
  b.dataset.pos=pos>=0?(pos+1):'';
 });
 slotsRender(p.map(k=>t.steps2[t.order[k]]));
}
function bauTap(i){
 if(cur.done)return;
 const t=cur.task,p=gState.picked;
 p.push(i);
 slotsRender(p.map(k=>t.chips[k]));
 const el=$('#gc'+i);if(el){el.classList.add('used');setTimeout(()=>el.classList.remove('used'),200);}
}
function slotUndo(){if(cur.done||!gState||!gState.picked)return;gState.picked.pop();
 const t=cur.task;slotsRender(gState.picked.map(k=>t.chips?t.chips[k]:t.steps2[t.order[k]]));}
function sortTap(i){
 if(cur.done)return;
 const t=cur.task,p=gState.picked,at=p.indexOf(i);
 if(at>=0)p.splice(at,1);else p.push(i);
 document.querySelectorAll('.chip-tap').forEach((b,k)=>b.classList.toggle('sel',p.indexOf(k)>=0));
 slotsRender(p.map(k=>t.items[k].txt));
}
function errTap(i){
 if(cur.done)return;
 const t=cur.task;
 const el=$('#ge'+i);
 if(i===t.bad){el.classList.add('ok');gameResult(true);}
 else{el.classList.add('miss');gameResult(false);const b=$('#ge'+t.bad);if(b)b.classList.add('ok');}
}
function wgTap(i){
 if(cur.done)return;
 const t=cur.task,mv=t.moves[i];
 gState.n++;
 mv.f(gState);
 const L=$('#wL'),R=$('#wR');
 if(L)L.innerHTML=linStr(gState.a,gState.b);
 if(R)R.innerHTML=''+gState.c;
 const log=$('#wLog');if(log)log.innerHTML='Schritte: '+gState.n+' &nbsp;·&nbsp; zuletzt: '+mv.l;
 const w=document.querySelector('.waage');
 if(w){w.classList.remove('tilt');void w.offsetWidth;w.classList.add('tilt');}
 if(gState.a===1&&gState.b===0){gameResult(true);}
 else if(gState.n>=5){gameResult(false);}
}
function memTap(i){
 if(cur.done||!gState)return;
 const t=cur.task,el=$('#gm'+i);
 if(!el||el.classList.contains('found')||gState.open.indexOf(i)>=0)return;
 el.classList.add('open');gState.open.push(i);
 if(gState.open.length===2){
  const [a,b]=gState.open;
  const ca=t.cards[a],cb=t.cards[b];
  if(ca.g===cb.g&&a!==b){
   $('#gm'+a).classList.add('found');$('#gm'+b).classList.add('found');
   gState.done++;gState.open=[];
   if(gState.done===t.pairs.length)gameResult(gState.miss<=1);
  }else{
   gState.miss++;
   const A=$('#gm'+a),B=$('#gm'+b);
   A.classList.add('wrong');B.classList.add('wrong');
   gState.open=[];
   setTimeout(()=>{if(A)A.classList.remove('open','wrong');if(B)B.classList.remove('open','wrong');},700);
   if(gState.miss>2)gameResult(false);
  }
 }
}
function regMove(){
 if(cur.done)return;
 const t=cur.task;
 gState.v1=parseInt($('#gr1').value);gState.v2=parseInt($('#gr2').value);
 $('#gv1').textContent=gState.v1;$('#gv2').textContent=gState.v2;
 $('#gGraph').innerHTML=t.draw(gState.v1,gState.v2);
}
function wfTap(ans){
 if(cur.done)return;
 gameResult(ans===cur.task.truth);
}

function mkPuzzle(steps){return {game:'puzzle',steps2:steps,order:shuffled(steps.map((_,i)=>i)),
 q:'<b>Lösungsweg-Puzzle:</b> Bringe die Schritte in die richtige Reihenfolge.',
 steps:['Richtige Reihenfolge:'].concat(steps.map((s,i)=>(i+1)+'. '+s))};}
function mkFehler(lines,bad,why){return {game:'fehler',lines:lines,bad:bad,
 q:'<b>Fehlersuche:</b> Wo steckt der Fehler?',
 steps:['Der Fehler steckt in <b>Zeile '+(bad+1)+'</b>.',why]};}
function mkWahr(stmt,truth,why){return {game:'wahr',stmt:stmt,truth:truth,
 q:'<b>Wahr oder falsch?</b>',steps:[(truth?'Die Aussage ist <b>wahr</b>.':'Die Aussage ist <b>falsch</b>.'),why]};}
function mkSort(items){return {game:'sortier',items:shuffled(items),
 q:'<b>Sortieren:</b> vom kleinsten zum größten Wert',
 steps:['Richtige Reihenfolge: '+items.slice().sort((a,b)=>a.v-b.v).map(i=>i.txt).join(' &lt; ')]};}
function mkMemory(pairs){
 const cards=[];pairs.forEach((p,g)=>{p.forEach(txt=>cards.push({txt:txt,g:g}));});
 return {game:'memory',pairs:pairs,cards:shuffled(cards),
  q:'<b>Memory:</b> Finde die gleichwertigen Paare.',
  steps:['Zusammen gehören:'].concat(pairs.map(p=>p.join('  =  ')))};}
function mkBau(chips,acc,frage){return {game:'bau',chips:shuffled(chips),acc:acc,
 q:'<b>Term-Baukasten:</b> '+frage,steps:['Richtige Lösung: <b>'+acc[0]+'</b>']};}
function mkWaage(a,b,c){
 // a·x + b = c  (Lösung ganzzahlig)
 const moves=[];
 moves.push({l:'− '+Math.abs(b)+(b<0?' … nein: + '+Math.abs(b):''),f:s=>{s.b-=b;s.c-=b;}});
 moves[0].l=(b<0?'+ ':'− ')+Math.abs(b);
 moves.push({l:': '+a,f:s=>{if(s.b%a===0&&s.c%a===0){s.a/=a;s.b/=a;s.c/=a;}else{s.a=s.a/a;s.b=s.b/a;s.c=s.c/a;}}});
 moves.push({l:(b<0?'− ':'+ ')+Math.abs(b),f:s=>{s.b+=b;s.c+=b;}});
 moves.push({l:'· '+a,f:s=>{s.a*=a;s.b*=a;s.c*=a;}});
 return {game:'waage',a:a,b:b,c:c,lhs:linStr(a,b),rhs:''+c,moves:shuffled(moves),
  q:'<b>Waage:</b> Löse '+linStr(a,b)+' = '+c+' Schritt für Schritt.',
  steps:['Erst die Zahl wegräumen: '+(b<0?'+ ':'− ')+Math.abs(b),'Dann durch die Zahl vor dem x teilen: : '+a,'<b>x = '+((c-b)/a)+'</b>']};}
function mkRegler(task,l1,r1,l2,r2,sol,draw){
 let s1=sol[0],s2=sol[1],g=0;
 while(s1===sol[0]&&g<20){s1=ri(r1[0],r1[1]);g++;}
 s2=sol[1]===r2[0]?r2[1]:r2[0];
 return {game:'regler',task:task,l1:l1,r1:r1,l2:l2,r2:r2,sol:sol,start:[s1,s2],draw:draw,
  q:'<b>Regler-Spiel</b>',steps:['Richtig ist: '+l1+' '+sol[0]+' und '+l2+' '+sol[1]]};}
