<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathe-Basis-Trainer</title>
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mathe-Trainer">
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1e2533; --mut:#6b7486;
  --pri:#3b5bdb; --pri2:#4c6ef5; --ok:#2b8a3e; --okbg:#e6f7ea;
  --bad:#c92a2a; --badbg:#fdecec; --warn:#e8590c;
  --gold:#f5a623; --line:#e3e7ef; --rad:14px;
  --sh:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;border-radius:10px}
input,textarea,select{font-family:inherit;font-size:1.05rem;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri2)}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#3b5bdb,#5f3dc4);color:#fff;padding:10px 16px;box-shadow:var(--sh)}
.hrow{display:flex;align-items:center;gap:14px;max-width:980px;margin:0 auto;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
.hstat{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;white-space:nowrap}
.xpwrap{display:flex;align-items:center;gap:8px;min-width:170px}
.xpbar{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;min-width:90px}
.xpbar>div{height:100%;background:#ffd43b;border-radius:99px;transition:width .4s}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
h1{font-size:1.5rem;margin-bottom:6px}
h2{font-size:1.2rem;margin-bottom:10px}
h3{font-size:1.05rem;margin:14px 0 6px}
.mut{color:var(--mut);font-size:.95rem}
.btn{background:var(--pri);color:#fff;padding:11px 20px;font-weight:700;transition:transform .1s, background .2s}
.btn:hover{background:var(--pri2)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:1.1rem;padding:14px 26px;width:100%}
.btn.sec{background:#e7ecf7;color:var(--pri)}
.btn.sec:hover{background:#dbe4f5}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--line)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.mcard{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;cursor:pointer;border:2px solid transparent;transition:border .15s, transform .1s}
.mcard:hover{border-color:var(--pri2);transform:translateY(-2px)}
.mcard .ic{font-size:1.6rem}
.mcard .tt{font-weight:700;margin:4px 0 2px;font-size:.98rem}
.pbar{height:8px;background:#edf0f6;border-radius:99px;overflow:hidden;margin-top:8px}
.pbar>div{height:100%;background:linear-gradient(90deg,#4c6ef5,#15aabf);border-radius:99px;transition:width .4s}
.stars{color:var(--gold);font-size:.95rem;letter-spacing:2px}
.blockh{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.blockh .bnum{background:var(--pri);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#e9edf5;font-weight:700;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--pri);color:#fff}
.merk{background:#eef3ff;border-left:5px solid var(--pri);border-radius:10px;padding:12px 16px;margin:12px 0}
.merk b{color:var(--pri)}
.exbox{background:#fbf7ee;border-left:5px solid var(--gold);border-radius:10px;padding:12px 16px;margin:12px 0}
.exbox .stp{padding:6px 0;border-bottom:1px dashed #e8ddc4}
.exbox .stp:last-child{border-bottom:none}
.formel{background:#f5f6fa;border-radius:8px;padding:8px 14px;margin:6px 0;font-size:1.08rem;display:inline-block}
.q{font-size:1.22rem;margin:14px 0;line-height:1.9}
.lvlb{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.lvl1{background:#e6f7ea;color:#2b8a3e}
.lvl2{background:#fff3e0;color:#e8590c}
.lvl3{background:#f3e8ff;color:#7048e8}
.fieldrow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.fieldrow label{font-weight:600;min-width:0}
.fieldrow input{width:170px}
.fb{border-radius:10px;padding:12px 16px;margin:12px 0;font-weight:600;display:none}
.fb.ok{background:var(--okbg);color:var(--ok);display:block}
.fb.bad{background:var(--badbg);color:var(--bad);display:block}
.steps{background:#f5f6fa;border-radius:10px;padding:14px 18px;margin:12px 0;display:none}
.steps.show{display:block}
.steps .st{padding:5px 0;line-height:1.9}
.steps .st::before{content:"→ ";color:var(--pri);font-weight:800}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mcopt{display:block;width:100%;text-align:left;background:#f2f4fa;border:2px solid var(--line);border-radius:10px;padding:11px 16px;margin:7px 0;font-size:1.05rem;transition:all .15s}
.mcopt:hover{border-color:var(--pri2)}
.mcopt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.mcopt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 5px}
.fr>span:last-child{padding:0 5px}
.ol{text-decoration:overline}
sup{font-size:.72em}
.phase{background:#5f3dc4;color:#fff;border-radius:999px;padding:4px 16px;font-weight:700;font-size:.9rem;display:inline-block}
.sesshead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sessbar{height:10px;background:#e6eaf2;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.sessbar>div{height:100%;background:linear-gradient(90deg,#3b5bdb,#15aabf);transition:width .3s}
.bigemoji{font-size:3rem;text-align:center;margin:10px 0}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.statbox{flex:1;min-width:130px;background:#f5f7fc;border-radius:12px;padding:14px;text-align:center}
.statbox .v{font-size:1.6rem;font-weight:800;color:var(--pri)}
.statbox .l{font-size:.85rem;color:var(--mut)}
.jentry{border-left:4px solid var(--pri2);background:#f7f9fd;border-radius:8px;padding:10px 14px;margin:10px 0}
.cheer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cheer span{position:absolute;top:-40px;font-size:1.8rem;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(340deg);opacity:.2}}
.navrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumb{background:none;color:var(--pri);font-weight:700;padding:6px 2px}
.hint{font-size:.88rem;color:var(--mut);margin-top:4px}
.badgewrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{background:#fff8e1;border:1.5px solid #ffd43b;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
table.wt{border-collapse:collapse;margin:8px 0}
table.wt td,table.wt th{border:1px solid var(--line);padding:5px 12px;text-align:center}
.path{position:relative;max-width:560px;margin:0 auto;padding:6px 0}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #c5cfe6;transform:translateX(-1.5px)}
.stn{position:relative;width:46%;background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:12px 14px;margin:16px 0;cursor:pointer;border:2px solid transparent;transition:transform .1s,border .15s;z-index:1}
.stn:hover{border-color:var(--pri2);transform:translateY(-2px)}
.stn.l{margin-right:auto}.stn.r{margin-left:auto}
.stn .ic{font-size:1.5rem}
.stn .tt{font-weight:700;font-size:.95rem;margin:2px 0}
.stn.rec{border-color:var(--pri);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,91,219,.35)}50%{box-shadow:0 0 0 9px rgba(59,91,219,0)}}
.stn .flags{position:absolute;top:-11px;right:-6px;font-size:1.1rem;background:#fff;border-radius:999px;padding:1px 7px;box-shadow:var(--sh)}
.pblock{position:relative;text-align:center;margin:24px 0 4px;z-index:1}
.pblock span{background:var(--pri);color:#fff;border-radius:999px;padding:5px 18px;font-weight:800;font-size:.9rem;box-shadow:var(--sh)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:#1e2533;color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;z-index:120;opacity:0;transition:all .35s;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bossbox{background:linear-gradient(135deg,#fff4e6,#ffe8cc);border:2px solid #ffc078;border-radius:12px;padding:14px 16px;margin:10px 0}
.ringwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.blitztime{font-size:1.5rem;font-weight:800;color:var(--warn)}
.duebar{background:#fff9db;border:1.5px solid #ffe066;border-radius:12px;padding:10px 14px;margin:12px 0}
.filebtn input{display:none}
@media(max-width:560px){ .fieldrow input{width:130px} .q{font-size:1.1rem} .stn{width:47%;padding:10px} }
.bossarena{background:linear-gradient(135deg,#2b2d42,#4a3f6b);border-radius:14px;padding:14px 16px;margin:10px 0 16px;color:#fff;display:flex;gap:14px;align-items:center}
.bossfig{font-size:3rem;display:inline-block;animation:bossbob 2.4s ease-in-out infinite}
.bossfig.hit{animation:bosshit .55s ease}
.bossfig.mock{animation:bossmock .65s ease}
.bossfig.dead{animation:bossdead 1.4s ease forwards}
@keyframes bossbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bosshit{0%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-9deg);filter:brightness(1.8) hue-rotate(-45deg)}40%{transform:translateX(9px) rotate(7deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes bossmock{0%,100%{transform:scale(1)}30%{transform:scale(1.28) rotate(-7deg)}60%{transform:scale(1.15) rotate(7deg)}}
@keyframes bossdead{0%{transform:rotate(0) translateY(0);opacity:1}100%{transform:rotate(180deg) translateY(46px);opacity:.15}}
.bossname{font-weight:800;font-size:.85rem;margin-top:4px}
.bossmeta{font-size:.82rem;opacity:.92}
.bubble{position:relative;background:#fff;color:#1e2533;border-radius:12px;padding:9px 14px;font-weight:600}
.bubble::before{content:'';position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:#fff;border-left:none}
.bosshp{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:4px}
.bosshp>div{height:100%;background:linear-gradient(90deg,#ff8787,#fa5252);border-radius:99px;transition:width .5s}
.mentorarena{background:linear-gradient(135deg,#e8f3ff,#f3ecff);border-radius:14px;padding:14px 16px;margin:10px 0 16px;display:flex;gap:14px;align-items:flex-start}
.mentorfig{font-size:3rem;display:inline-block;animation:bossbob 2.6s ease-in-out infinite}
.mentorfig.happy{animation:mhappy .7s ease}
.mentorfig.think{animation:mthink .7s ease}
@keyframes mhappy{0%,100%{transform:scale(1)}40%{transform:translateY(-14px) scale(1.18) rotate(8deg)}70%{transform:translateY(0) scale(1.05)}}
@keyframes mthink{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
.mname{font-weight:800;font-size:.85rem;margin-top:4px;color:#4a3f6b}
.tafel{background:#2f4538;color:#f4f8f3;border-radius:14px;padding:14px 20px;margin:12px 0;font-size:1.12rem;line-height:2.1;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.tafel .tl{padding:3px 0}
.tafel .tl.neu{animation:tlin .5s ease}
@keyframes tlin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo" onclick="go('home')">🧮 Mathe-Basis-Trainer</div>
    <div class="hstat">
      <span class="chip" id="hStreak">🔥 0</span>
      <span class="chip" id="hJoker">🃏 2</span>
      <span class="chip" id="hLvl">Level 1</span>
      <div class="xpwrap"><div class="xpbar"><div id="hXp" style="width:0%"></div></div><span class="chip" id="hXpTxt">0 XP</span></div>
    </div>
  </div>
</header>
<main id="app"></main>
<script>
/* ============ Hilfsfunktionen ============ */
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,Math.abs(a%b)):Math.abs(a);
function fmt(x){let r=Math.round(x*1000)/1000;return (''+r).replace('.',',');}
function frac(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}
function wz(x){return '√<span class="ol">'+x+'</span>';}
function sgn(n){return n<0?'− '+Math.abs(n):'+ '+n;}
function co(c,v){if(c===0)return'';return (c===1?'':(c===-1?'-':c))+v;}
function linStr(a,b,v){v=v||'x';let p=[];
 if(a!==0)p.push(co(a,v));
 if(b!==0)p.push((b>0&&p.length?'+':'')+b);
 return p.length?p.join(''):'0';}
function linAcc(a,b,v){v=v||'x';const s1=linStr(a,b,v);let p=[];
 if(b!==0)p.push(''+b);
 if(a!==0)p.push((a>0&&p.length?'+':'')+co(a,v));
 const s2=p.length?p.join(''):'0';
 return s1===s2?[s1]:[s1,s2];}
function normTxt(s){return (''+s).toLowerCase()
 .replace(/\s+/g,'').replace(/\*/g,'').replace(/·/g,'').replace(/−/g,'-')
 .replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
 .replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/^f\(x\)=/,'y=').replace(/\(\+/g,'(')
 .replace(/wurzel/g,'√');}
function parseNum(s){s=(''+s).trim().toLowerCase().replace(/\s+/g,'').replace(',', '.').replace('−','-').replace(/^=+/,'').replace(/(grad|cm|mm|km|kg|std|min|jahre|jahr|tage|h|g|m|%|€|°|\u20ac)+$/,'');
 const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
 if(m)return parseFloat(m[1])/parseFloat(m[2]);
 if(!/^-?\d+(\.\d+)?$/.test(s))return null;
 return parseFloat(s);}
function redFrac(n,d){const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d;}return [n,d];}
function fracTxt(n,d){const r=redFrac(n,d);return r[1]===1?(''+r[0]):r[0]+'/'+r[1];}
function ineqAcc(v,sign){const flip={'<':'>','>':'<','<=':'>=','>=':'<='};
 return ['x'+sign+v, v+flip[sign]+'x'];}
const disp={'<':'&lt;','>':'&gt;','<=':'≤','>=':'≥'};

/* ============ Koordinatensystem (SVG) ============ */
function graphSVG(items,opts){
 opts=opts||{};const R=5,W=240,u=W/(2*R);
 const X=x=>W/2+x*u, Y=y=>W/2-y*u;
 let g='';
 for(let i=-R;i<=R;i++){
  g+='<line x1="'+X(i)+'" y1="0" x2="'+X(i)+'" y2="'+W+'" stroke="#e4e8f0" stroke-width="1"/>';
  g+='<line x1="0" y1="'+Y(i)+'" x2="'+W+'" y2="'+Y(i)+'" stroke="#e4e8f0" stroke-width="1"/>';
 }
 g+='<line x1="0" y1="'+Y(0)+'" x2="'+W+'" y2="'+Y(0)+'" stroke="#7a8499" stroke-width="1.6"/>';
 g+='<line x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+W+'" stroke="#7a8499" stroke-width="1.6"/>';
 g+='<polygon points="'+W+','+Y(0)+' '+(W-8)+','+(Y(0)-4)+' '+(W-8)+','+(Y(0)+4)+'" fill="#7a8499"/>';
 g+='<polygon points="'+X(0)+',0 '+(X(0)-4)+',8 '+(X(0)+4)+',8" fill="#7a8499"/>';
 g+='<text x="'+(W-10)+'" y="'+(Y(0)+14)+'" font-size="10" fill="#6b7486">x</text>';
 g+='<text x="'+(X(0)+6)+'" y="10" font-size="10" fill="#6b7486">y</text>';
 [-4,-2,2,4].forEach(i=>{
  g+='<text x="'+(X(i)-3)+'" y="'+(Y(0)+13)+'" font-size="9" fill="#6b7486">'+i+'</text>';
  g+='<text x="'+(X(0)+4)+'" y="'+(Y(i)+3)+'" font-size="9" fill="#6b7486">'+i+'</text>';
 });
 (items||[]).forEach(it=>{
  const col=it.col||'#3b5bdb';
  if(it.f){
   let seg=[];const segs=[];
   for(let x=-R;x<=R+0.001;x+=0.05){
    const y=it.f(x);
    if(isFinite(y)&&y>=-R-0.6&&y<=R+0.6)seg.push(X(x).toFixed(1)+','+Y(y).toFixed(1));
    else{if(seg.length>1)segs.push(seg);seg=[];}
   }
   if(seg.length>1)segs.push(seg);
   segs.forEach(s=>{g+='<polyline points="'+s.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.6"/>';});
  }
  if(it.dot){g+='<circle cx="'+X(it.dot[0])+'" cy="'+Y(it.dot[1])+'" r="4.5" fill="'+(it.col||'#e8590c')+'" stroke="#fff" stroke-width="1.5"/>';}
 });
 return '<div style="text-align:center;margin:8px 0"><svg width="'+W+'" height="'+W+'" viewBox="0 0 '+W+' '+W+'" style="max-width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px">'+g+'</svg></div>';
}

/* ============ Zustand ============ */
const GOAL=100;
const IVL=[1,3,7,14,30];
let state={xp:0,streak:0,lastDay:null,journal:[],mods:{},sessions:0,errors:[],
 dayXP:{d:'',xp:0},jokers:2,jokerWeek:'',goalDone:'',badges:[],blitzBest:0,blitzRuns:0};
function save(){try{localStorage.setItem('mbtState',JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem('mbtState');if(s){const p=JSON.parse(s);
 state=Object.assign(state,p);
 if(!state.dayXP)state.dayXP={d:'',xp:0};
 if(state.jokers==null)state.jokers=2;
 if(!state.badges)state.badges=[];
 if(!state.blitzBest)state.blitzBest=0;if(!state.blitzRuns)state.blitzRuns=0;
}}catch(e){}}
function st(id){if(!state.mods[id])state.mods[id]={c:0,t:0,a:0,seen:false,boss:0,stage:-1,due:''};
 const s=state.mods[id];
 if(s.boss==null)s.boss=0;if(s.stage==null)s.stage=-1;if(s.due==null)s.due='';
 return s;}
function stars(s){return s.boss||0;}
function starStr(n){return '★'.repeat(n)+'<span style="color:#d8dbe2">'+'★'.repeat(3-n)+'</span>';}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function addDays(n){return dstr(new Date(Date.now()+n*864e5));}
function weekKey(){const d=new Date();const off=(d.getDay()+6)%7;return dstr(new Date(Date.now()-off*864e5));}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

function touchDay(){
 const wk=weekKey();
 if(state.jokerWeek!==wk){state.jokerWeek=wk;state.jokers=2;}
 const today=dstr();if(state.lastDay===today)return;
 if(state.lastDay==null){state.streak=1;}
 else{const diff=dayDiff(state.lastDay,today);
  if(diff===1)state.streak++;
  else if(diff===2&&state.jokers>0){state.jokers--;state.streak++;toast('🃏 Joker eingesetzt – deine Serie lebt weiter! ('+state.jokers+' übrig)');}
  else state.streak=1;}
 state.lastDay=today;}

function lvlOf(xp){return Math.floor(xp/150)+1;}

let cur={task:null,tries:0,done:false,onDone:null,modId:null,strict:false,autoNext:false};

function mountTask(container,modId,lvl,onDone,opts){
 opts=opts||{};
 const m=modById(modId);
 const task=m.gen(lvl);
 task.lvl=lvl;
 cur={task:task,tries:0,done:false,onDone:onDone,modId:modId,strict:!!opts.strict,autoNext:!!opts.autoNext};
 container.innerHTML=taskHTML(task,cur.strict);
 const inp=container.querySelectorAll('input');
 inp.forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')checkTask();}));
 if(inp[0])inp[0].focus();
}

function fieldOK(f,val){
 if(f.type==='txt'){const n=normTxt(val);return f.acc.some(a=>normTxt(a)===n);}
 const v=parseNum(val);if(v===null)return false;return Math.abs(v-f.a)<0.006;}

function checkTask(){
 if(cur.done)return;
 const t=cur.task;let allOk=true;
 if(t.setAns){
  const vals=t.fields.map((f,i)=>parseNum($('#fin'+i).value));
  if(vals.some(v=>v===null)){allOk=false;}
  else{const want=t.fields.map(f=>f.a).sort((a,b)=>a-b);
   const got=vals.slice().sort((a,b)=>a-b);
   allOk=want.every((w,i)=>Math.abs(w-got[i])<0.006);}
 }else{
  t.fields.forEach((f,i)=>{const el=$('#fin'+i);const okf=fieldOK(f,el.value);
   el.style.borderColor=okf?'var(--ok)':'var(--bad)';
   if(!okf)allOk=false;});
 }
 finishAttempt(allOk);
}

function mcPick(btn,i){
 if(cur.done)return;
 const t=cur.task;
 if(i===t.mc.a){btn.classList.add('ok');finishAttempt(true);}
 else{btn.classList.add('bad');btn.disabled=true;finishAttempt(false);}
}

function finishAttempt(ok){
 const fb=$('#tfb');const t=cur.task;
 if(ok){
  cur.done=true;
  const base={1:10,2:15,3:25}[t.lvl];
  const xp=cur.tries>0?Math.ceil(base/2):base;
  addXP(xp);
  const s=st(cur.modId);s.c++;s.a++;if(t.lvl===3)s.t++;save();
  fb.className='fb ok';fb.innerHTML=pick(praise)+' <b>+'+xp+' XP</b>';
  lockTask();
  if(sess&&sess.type==='boss')bossReact(true);
  if(cur.autoNext){const tk=cur.task;setTimeout(()=>{if(cur.task===tk&&cur.done)nextTask();},750);}
 }else{
  cur.tries++;
  if(cur.tries===1&&!cur.strict){
   fb.className='fb bad';fb.textContent=pick(retry);
  }else{
   cur.done=true;
   const s=st(cur.modId);s.a++;save();
   state.errors.push({m:cur.modId,lvl:t.lvl});
   if(state.errors.length>40)state.errors.shift();
   save();
   fb.className='fb bad';fb.textContent=pick(wrongMsg);
   $('#tsteps').classList.add('show');
   lockTask();
   if(sess&&sess.type==='boss')bossReact(false);
  }
 }
}
function lockTask(){
 document.querySelectorAll('#taskarea input').forEach(i=>i.disabled=true);
 document.querySelectorAll('.mcopt').forEach(b=>b.disabled=true);
 const bc=$('#bCheck');if(bc)bc.style.display='none';
 $('#bNext').style.display='inline-block';$('#bNext').focus();
}
function showSteps(){
 $('#tsteps').classList.add('show');
 if(!cur.done){
  cur.done=true;cur.peeked=true;
  const s=st(cur.modId);s.a++;
  state.errors.push({m:cur.modId,lvl:cur.task.lvl});
  if(state.errors.length>40)state.errors.shift();
  save();
  const fb=$('#tfb');fb.className='fb bad';
  fb.innerHTML='👀 Lösungsweg vor der Antwort angeschaut – diese Aufgabe zählt nicht. Lies ihn genau: Eine ähnliche kommt gleich wieder!';
  lockTask();
 }
}

let sess=null,timerH=null;
function shufArr(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function startDaily(){
 const rec=recMod();
 const due=dueMods().filter(m=>m.id!==rec.id);
 const started=MODS.filter(m=>st(m.id).c>0&&m.id!==rec.id);
 const q=[];
 for(let i=0;i<3;i++){
  let m;
  if(due[i])m=due[i];
  else m=started.length?pick(started):rec;
  q.push({m:m.id,lvl:Math.min(2,autoLvl(st(m.id))),ph:'🔄 Aufwärmen & Wiederholen'});
 }
 for(let i=0;i<8;i++)q.push({m:rec.id,lvl:autoLvl(st(rec.id)),ph:'🎯 Fokus: '+rec.t});
 const mixPool=started.concat(due).concat([rec]);
 for(let i=0;i<3;i++){const m=pick(mixPool);q.push({m:m.id,lvl:autoLvl(st(m.id)),ph:'🧩 Gemischter Abschluss'});}
 sess={q:q,i:0,ok:0,t0:Date.now(),type:'daily',focus:rec.id};
 if(!st(rec.id).seen)startLesson(rec.id,true);
 else renderSessTask();
}

function renderLog(){

 h+='<div class="card"><h1>🏅 Abzeichen</h1><div class="badgewrap">';
 BADGES.forEach(b=>{
  const has=state.badges.indexOf(b.id)>=0;
  h+='<span class="badge" style="'+(has?'':'opacity:.38;filter:grayscale(1)')+'" title="'+b.d+'">'+b.e+' '+b.n+'</span>';
 });
 h+='</div><p class="hint" style="margin-top:8px">Grau = noch nicht verdient. Tippe auf ein Abzeichen für die Bedingung.</p></div>';
 h+='<div class="card"><h2>⚡ Blitzrunde</h2><p>Rekord: <b>'+state.blitzBest+' richtige</b> in 5 Minuten · '+state.blitzRuns+' Runden gespielt</p></div>';
 h+='<div class="card"><h1>📓 Logbuch</h1>';
 if(!state.journal.length)h+='<p class="mut">Noch keine Einträge. Schließe dein erstes Tagestraining ab!</p>';
 state.journal.slice().reverse().forEach(j=>{
  h+='<div class="jentry"><b>'+j.d+'</b> · '+j.ok+'/'+j.n+' richtig';
  if(j.a1)h+='<br>✅ Verstanden: '+j.a1;
  if(j.a2)h+='<br>❓ Schwer: '+j.a2;
  if(j.a3)h+='<br>🔁 Morgen: '+j.a3;
  h+='</div>';
 });
 h+='</div>';
 $('#app').innerHTML=h;
}

/* ============ Lektions-Player ============ */
let les=null;
function lesMentor(){return MENTORS[les.mod]||{e:'🧑‍🏫',n:'Mentor'};}
function startLesson(id,toSession){
 if(!LESSONS[id]){renderModule(id,'ueben');return;}
 les={mod:id,i:0,toSession:!!toSession,answered:false,tried:false};
 renderLesson();
}
function renderLesson(){
 const L=LESSONS[les.mod],step=L[les.i],M=lesMentor(),m=modById(les.mod);
 let h='<div class="card"><div class="sesshead"><span class="phase" style="background:#2b8a3e">🎓 Lektion: '+m.ic+' '+m.t+'</span>';
 h+='<span class="chip" style="background:#e9edf5;color:var(--ink)">Schritt '+(les.i+1)+' / '+L.length+'</span></div>';
 h+='<div class="sessbar"><div style="width:'+Math.round(les.i/L.length*100)+'%"></div></div>';
 h+='<div class="mentorarena"><div style="text-align:center;min-width:86px"><span class="mentorfig" id="menFig">'+M.e+'</span><div class="mname">'+M.n+'</div></div>';
 h+='<div style="flex:1"><div class="bubble" id="menSay">'+(step.q?step.q:step.m)+'</div></div></div>';
 let board='';
 for(let k=0;k<=les.i;k++)if(L[k].b)board+='<div class="tl'+(k===les.i?' neu':'')+'">'+L[k].b+'</div>';
 if(board)h+='<div class="tafel">'+board+'</div>';
 if(step.q){
  step.o.forEach((o,i)=>{h+='<button class="mcopt" onclick="lesPick(this,'+i+')">'+o+'</button>';});
 }
 h+='<div class="btnrow"><button class="btn" id="lesNext" onclick="lesNext()" '+(step.q?'style="display:none"':'')+'>'+(les.i===L.length-1?'Lektion abschließen ✅':'Weiter ▸')+'</button></div>';
 h+='</div><button class="crumb" onclick="lesQuit()">✕ Lektion verlassen</button>';
 $('#app').innerHTML=h;
 const nx=$('#lesNext');if(nx&&!step.q)nx.focus();
}
function lesPick(btn,i){
 if(!les||les.answered)return;
 const step=LESSONS[les.mod][les.i];
 const fig=$('#menFig'),say=$('#menSay');
 if(i===step.a){
  les.answered=true;
  btn.classList.add('ok');
  document.querySelectorAll('.mcopt').forEach(b=>b.disabled=true);
  if(say)say.innerHTML='✅ '+step.ok;
  if(fig){fig.classList.remove('think');void fig.offsetWidth;fig.classList.add('happy');}
  if(!les.tried)addXP(5);
  const nx=$('#lesNext');if(nx){nx.style.display='inline-block';nx.focus();}
 }else{
  les.tried=true;
  btn.classList.add('bad');btn.disabled=true;
  if(say)say.innerHTML='🤔 '+step.no;
  if(fig){fig.classList.remove('happy');void fig.offsetWidth;fig.classList.add('think');}
 }
}
function lesNext(){
 if(!les)return;
 les.i++;les.answered=false;les.tried=false;
 if(les.i>=LESSONS[les.mod].length)lesEnd();else renderLesson();
}
function lesQuit(){
 const toSess=les&&les.toSession;les=null;
 if(toSess)sess=null;
 go('home');
}
function lesEnd(){
 const id=les.mod,m=modById(id),M=lesMentor(),s=st(id);
 const first=!s.seen;
 s.seen=true;save();
 if(first)addXP(25);
 let h='<div class="card"><div class="bigemoji"><span class="mentorfig">'+M.e+'</span></div>';
 h+='<h1 style="text-align:center">Lektion geschafft!'+(first?' <b>+25 XP</b>':'')+'</h1>';
 h+='<p class="mut" style="text-align:center">'+M.n+': „Stark gemacht! Jetzt festigt das Üben alles – Wissen wächst beim Rechnen."</p>';
 h+='<h2 style="margin-top:16px">📌 Dein Spickzettel</h2>'+m.ex;
 if(les.toSession){
  h+='<button class="btn big" onclick="lesToSess()">Weiter zum Training 🚀</button>';
 }else{
  h+='<div class="btnrow"><button class="btn big" onclick="les=null;renderModule(\''+id+'\',\'ueben\')">Jetzt üben ✏️</button></div>';
  h+='<button class="crumb" onclick="les=null;go(\'home\')">Zur Übersicht</button>';
 }
 h+='</div>';
 $('#app').innerHTML=h;cheer();
}
function lesToSess(){les=null;renderSessTask();}
/* ============ Module: Block A + B ============ */
function polyStr(a2,a1,a0,v){v=v||'x';let p=[];
 if(a2!==0)p.push(co(a2,v+'²'));
 if(a1!==0)p.push((a1>0&&p.length?'+':'')+co(a1,v));
 if(a0!==0)p.push((a0>0&&p.length?'+':'')+a0);
 return p.length?p.join(''):'0';}

  return {q:'Vereinfache: '+co(a,'x')+' '+kd+'('+linStr(c,d)+')',
   fields:[{l:'Ergebnis:',type:'txt',acc:linAcc(X,C)}],
   steps:['Klammer ausmultiplizieren: '+k+'('+linStr(c,d)+') = '+linStr(k*c,k*d),'x-Terme: '+a+' + ('+(k*c)+') = '+X,'Ergebnis: <b>'+linStr(X,C)+'</b>'],hint:'z. B. 5y-2'};}
 const k=pick([2,3,4,5]),c=ri(2,6);
 return {q:'Klammere vollständig aus: '+co(k,'a²')+' + '+co(k*c,'a'),
  fields:[{l:'Ergebnis:',type:'txt',acc:[k+'a(a+'+c+')','a·'+k+'(a+'+c+')',k+'a('+c+'+a)']}],
  steps:['Beide Terme enthalten '+k+' und a','Gemeinsamer Faktor: '+k+'a','Ergebnis: <b>'+k+'a(a + '+c+')</b>'],hint:'z. B. 3a(a+2)'};
}},

/* ---------- B2 Lineare Gleichungen ---------- */
{id:'glg',ic:'⚖️',t:'Lineare Gleichungen',blk:1,
ex:'<p>Eine Gleichung ist wie eine Waage: Was du links machst, musst du auch rechts machen. Ziel: <b>x allein auf einer Seite</b>.</p>'+
'<div class="merk"><b>Strategie:</b><br>1. Klammern auflösen.<br>2. Alle x-Terme auf eine Seite, alle Zahlen auf die andere (durch + / −).<br>3. Zusammenfassen.<br>4. Durch die Zahl vor dem x teilen.<br>5. <b>Probe machen!</b> Einsetzen und prüfen.</div>',
exm:[
 {q:'2x + 3 = 11',steps:['Beide Seiten − 3:  2x = 8','Beide Seiten : 2:  <b>x = 4</b>','Probe: 2 · 4 + 3 = 11 ✓']},
 {q:'3x + 5 = 2x + 12',steps:['Beide Seiten − 2x:  x + 5 = 12','Beide Seiten − 5:  <b>x = 7</b>','Probe: 3·7+5 = 26 und 2·7+12 = 26 ✓']}],
gen:function(lvl){
 if(lvl===1){
  const v=pick([0,1,2]);
  if(v===0){const x=ri(-9,15),a=ri(1,20);
   return {q:'Löse: x + '+a+' = '+(x+a),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten − '+a,'x = '+(x+a)+' − '+a+' = <b>'+x+'</b>']};}
  if(v===1){const a=ri(2,9),x=ri(-6,12);
   return {q:'Löse: '+co(a,'x')+' = '+(a*x),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten : '+a,'x = '+(a*x)+' : '+a+' = <b>'+x+'</b>']};}
  const a=ri(2,7),x=ri(-5,10),b=ri(1,15),c=a*x+b;
  return {q:'Löse: '+linStr(a,b)+' = '+c,fields:[{l:'x =',a:x}],
   steps:['Beide Seiten − '+b+':  '+co(a,'x')+' = '+(c-b),'Beide Seiten : '+a+':  <b>x = '+x+'</b>','Probe: '+a+'·'+x+'+'+b+' = '+c+' ✓']};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const a=ri(2,6),b=ri(1,8),x=ri(-5,9),c=a*(x+b);
   return {q:'Löse: '+a+'(x + '+b+') = '+c,fields:[{l:'x =',a:x}],
    steps:['Beide Seiten : '+a+':  x + '+b+' = '+(c/a),'Beide Seiten − '+b+':  <b>x = '+x+'</b>']};}
  if(v===1){
   const a=ri(3,9),c=ri(1,5),x=ri(-6,9),b=ri(1,12);
   const cc=Math.min(a-1,c);const d=b+(a-cc)*x;
   return {q:'Löse: '+linStr(a,b)+' = '+linStr(cc,d),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten − '+co(cc,'x')+':  '+linStr(a-cc,b)+' = '+d,'Beide Seiten − '+b+':  '+co(a-cc,'x')+' = '+(d-b),'Beide Seiten : '+(a-cc)+':  <b>x = '+x+'</b>']};}
  const b=ri(2,6),c=ri(2,9),a=ri(1,8),x=b*c-a;
  return {q:'Löse: '+frac('x + '+a,b)+' = '+c,fields:[{l:'x =',a:x}],
   steps:['Beide Seiten · '+b+':  x + '+a+' = '+(b*c),'Beide Seiten − '+a+':  <b>x = '+x+'</b>']};
 }
 if(pick([0,1])===0){
  let a=ri(2,6),c=ri(1,5),g=0;while(a-c<1&&g<10){c=ri(1,5);g++;}if(a<=c)a=c+1;
  const b=ri(1,6),d=ri(1,6),x=ri(-5,8),e=(a-c)*x+(a*b-c*d);
  return {q:'Löse: '+a+'(x + '+b+') − '+c+'(x + '+d+') = '+e,fields:[{l:'x =',a:x}],
   steps:['Ausmultiplizieren: '+linStr(a,a*b)+' − ('+linStr(c,c*d)+') = '+e,'Zusammenfassen: '+linStr(a-c,a*b-c*d)+' = '+e,'Beide Seiten − '+(a*b-c*d)+':  '+co(a-c,'x')+' = '+(e-(a*b-c*d)),'Beide Seiten : '+(a-c)+':  <b>x = '+x+'</b>']};}
 let p=ri(2,4),x=ri(1,9),q2=ri(1,9),r=ri(2,5),s=0,g=0,found=false;
 for(g=0;g<60;g++){x=ri(-4,9);q2=ri(1,9);if((p*x-q2)%r===0){s=(p*x-q2)/r;found=true;break;}}
 if(!found){p=2;x=5;q2=4;r=2;s=3;}
 return {q:'Löse: '+frac(linStr(p,-q2),r)+' = '+s,fields:[{l:'x =',a:x}],
  steps:['Beide Seiten · '+r+':  '+linStr(p,-q2)+' = '+(s*r),'Beide Seiten + '+q2+':  '+co(p,'x')+' = '+(s*r+q2),'Beide Seiten : '+p+':  <b>x = '+x+'</b>']};
}},

/* ---------- B3 Ungleichungen ---------- */
{id:'ung',ic:'↔️',t:'Ungleichungen',blk:1,
ex:'<p>Ungleichungen löst du fast genauso wie Gleichungen – mit <b>einer</b> wichtigen Ausnahme.</p>'+
'<div class="merk"><b>Merke:</b> Wenn du mit einer <b>negativen Zahl multiplizierst oder dividierst</b>, dreht sich das Ungleichheitszeichen um!<br>−2x &gt; 8  →  x &lt; −4</div>'+
'<p>Bei Plus und Minus passiert dem Zeichen nichts.</p>',
exm:[
 {q:'2x − 4 &lt; 6',steps:['Beide Seiten + 4:  2x &lt; 10','Beide Seiten : 2 (positiv, Zeichen bleibt):  <b>x &lt; 5</b>']},
 {q:'−3x ≤ 12',steps:['Beide Seiten : (−3) → <b>Zeichen dreht sich um!</b>','<b>x ≥ −4</b>']}],
gen:function(lvl){
 const signs=['<','>','<=','>='];
 if(lvl===1){
  const sign=pick(signs);
  if(pick([0,1])===0){
   const a=ri(2,6),sol=ri(-6,9),b=a*sol;
   return {q:'Löse: '+co(a,'x')+' '+disp[sign]+' '+b,
    fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,sign)}],
    steps:['Beide Seiten : '+a+' (positiv → Zeichen bleibt)','<b>x '+disp[sign]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};}
  const a=ri(1,12),sol=ri(-6,12),b=sol+a;
  return {q:'Löse: x + '+a+' '+disp[sign]+' '+b,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,sign)}],
   steps:['Beide Seiten − '+a,'<b>x '+disp[sign]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};
 }
 if(lvl===2){
  const a=ri(2,5),sol=ri(-8,8),b=-a*sol,sign=pick(signs);
  return {q:'Löse: −'+co(a,'x')+' '+disp[sign]+' '+b,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,flipS[sign])}],
   steps:['Beide Seiten : (−'+a+')','<b>Achtung: Zeichen dreht sich um!</b>','<b>x '+disp[flipS[sign]]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};
 }
 if(pick([0,1])===0){
  const k=ri(2,4),m=ri(-6,6),c=ri(5,20),d=c-k*m,sign=pick(['>','>=']);
  return {q:'Löse: '+c+' − '+co(k,'x')+' '+disp[sign]+' '+d,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(m,flipS[sign])}],
   steps:['Beide Seiten − '+c+':  −'+co(k,'x')+' '+disp[sign]+' '+(d-c),'Beide Seiten : (−'+k+') → Zeichen dreht sich um!','<b>x '+disp[flipS[sign]]+' '+m+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};}
 const a=ri(1,3),b=a+ri(1,3),e=ri(1,6),x0=ri(-5,9),f=a*e+x0*(a-b),sign=pick(['<','<=']);
 return {q:'Löse: '+a+'(x + '+e+') '+disp[sign]+' '+linStr(b,f),
  fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(x0,flipS[sign])}],
  steps:['Ausmultiplizieren: '+linStr(a,a*e)+' '+disp[sign]+' '+linStr(b,f),'Beide Seiten − '+co(b,'x')+':  '+linStr(a-b,a*e)+' '+disp[sign]+' '+f,'Beide Seiten − '+(a*e)+':  '+co(a-b,'x')+' '+disp[sign]+' '+(f-a*e),'Durch '+(a-b)+' (negativ!) → Zeichen dreht sich um: <b>x '+disp[flipS[sign]]+' '+x0+'</b>'],hint:'Schreibe z. B. x>9'};
}},

/* ---------- B4 Binomische Formeln ---------- */
{id:'bin',ic:'🎁',t:'Binomische Formeln',blk:1,
ex:'<p>Die drei binomischen Formeln brauchst du ständig – beim Ausmultiplizieren <b>und</b> rückwärts beim Faktorisieren.</p>'+
'<div class="merk"><span class="formel">(a + b)² = a² + 2ab + b²</span><br><span class="formel">(a − b)² = a² − 2ab + b²</span><br><span class="formel">(a + b)(a − b) = a² − b²</span></div>'+
'<p>Rückwärts: Steht da x² + 6x + 9, frage dich: Ist das (x + 3)²? Prüfe: 2 · x · 3 = 6x ✓</p>',
exm:[
 {q:'(x + 3)²',steps:['a = x, b = 3','a² + 2ab + b² = x² + 2·x·3 + 3²','= <b>x² + 6x + 9</b>']},
 {q:'x² − 10x + 25 faktorisieren',steps:['x² = (x)², 25 = 5² – passt zur 2. Formel?','Prüfe Mittelterm: 2 · x · 5 = 10x ✓ (mit Minus)','= <b>(x − 5)²</b>']}],
gen:function(lvl){
 if(lvl===1){
  const a=ri(1,9),plus=pick([true,false]);
  const inner='(x '+(plus?'+':'−')+' '+a+')²';
  const mid=plus?2*a:-2*a;
  return {q:'Multipliziere aus: '+inner,
   fields:[{l:'Ergebnis:',type:'txt',acc:[polyStr(1,mid,a*a)]}],
   steps:['Binomische Formel: (a '+(plus?'+':'−')+' b)² = a² '+(plus?'+':'−')+' 2ab + b²','a = x, b = '+a,'x² '+(plus?'+':'−')+' 2·'+a+'·x + '+(a*a)+' = <b>'+polyStr(1,mid,a*a)+'</b>'],
   hint:'z. B. x^2+6x+9 (nach fallenden Potenzen sortieren)'};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const a=ri(2,3),b=ri(1,5),plus=pick([true,false]);
   const mid=plus?2*a*b:-2*a*b;
   return {q:'Multipliziere aus: ('+co(a,'x')+' '+(plus?'+':'−')+' '+b+')²',
    fields:[{l:'Ergebnis:',type:'txt',acc:[polyStr(a*a,mid,b*b)]}],
    steps:['a = '+co(a,'x')+', b = '+b,'('+co(a,'x')+')² = '+co(a*a,'x²')+',  2 · '+co(a,'x')+' · '+b+' = '+co(2*a*b,'x')+',  '+b+'² = '+(b*b),'Ergebnis: <b>'+polyStr(a*a,mid,b*b)+'</b>'],hint:'z. B. 4x^2+4x+1'};}
  const a=ri(1,9),v=pick(['x','m','a']);
  return {q:'Multipliziere aus: ('+v+' + '+a+')('+v+' − '+a+')',
   fields:[{l:'Ergebnis:',type:'txt',acc:[v+'^2-'+(a*a)]}],
   steps:['3. binomische Formel: (a + b)(a − b) = a² − b²','= <b>'+v+'² − '+(a*a)+'</b>'],hint:'z. B. x^2-16'};
 }
 const v=pick([0,1,2]);
 if(v===0){
  const a=ri(1,9),plus=pick([true,false]);
  const mid=plus?2*a:-2*a;
  const acc=plus?['(x+'+a+')^2','('+a+'+x)^2']:['(x-'+a+')^2','('+a+'-x)^2'];
  return {q:'Faktorisiere mit einer binomischen Formel: '+polyStr(1,mid,a*a),
   fields:[{l:'Ergebnis:',type:'txt',acc:acc}],
   steps:['x² = (x)² und '+(a*a)+' = '+a+'²','Prüfe Mittelterm: 2 · x · '+a+' = '+(2*a)+'x ✓','= <b>(x '+(plus?'+':'−')+' '+a+')²</b>'],hint:'z. B. (x+3)^2'};}
 if(v===1){
  const c=pick([2,3,4,5]),b=ri(1,7),v2=pick(['y','x']);
  return {q:'Faktorisiere: '+co(c*c,v2+'²')+' − '+(b*b),
   fields:[{l:'Ergebnis:',type:'txt',acc:['('+c+v2+'+'+b+')('+c+v2+'-'+b+')','('+c+v2+'-'+b+')('+c+v2+'+'+b+')']}],
   steps:[co(c*c,v2+'²')+' = ('+co(c,v2)+')² und '+(b*b)+' = '+b+'²','3. binomische Formel rückwärts: a² − b² = (a + b)(a − b)','= <b>('+co(c,v2)+' + '+b+')('+co(c,v2)+' − '+b+')</b>'],hint:'z. B. (3y+4)(3y-4)'};}
 const a=ri(2,3),b=ri(1,6),v2=pick(['m','x']);
 return {q:'Multipliziere aus: ('+co(a,v2)+' − '+b+')('+co(a,v2)+' + '+b+')',
  fields:[{l:'Ergebnis:',type:'txt',acc:[co(a*a,v2+'^2')+'-'+(b*b)]}],
  steps:['3. binomische Formel: a² − b²','a = '+co(a,v2)+', b = '+b,'= <b>'+co(a*a,v2+'²')+' − '+(b*b)+'</b>'],hint:'z. B. 4m^2-25'};
}},

/* ---------- B5 Faktorisieren ---------- */
{id:'fak',ic:'✂️',t:'Faktorisieren',blk:1,
ex:'<p>Faktorisieren heißt: eine Summe in ein <b>Produkt</b> verwandeln. Das ist das Gegenteil vom Ausmultiplizieren – und der Schlüssel zum Lösen quadratischer Gleichungen.</p>'+
'<div class="merk"><b>Drei Werkzeuge:</b><br>1. <b>Gemeinsamen Faktor ausklammern:</b> 6x + 12 = 6(x + 2)<br>2. <b>Binomische Formeln rückwärts</b><br>3. <b>Trinom zerlegen:</b> x² + 5x + 6 = (x + 2)(x + 3) – suche zwei Zahlen mit Produkt 6 und Summe 5.</div>',
exm:[
 {q:'2x² + 6x',steps:['Gemeinsamer Faktor: 2x','= <b>2x(x + 3)</b>','Probe: 2x · x + 2x · 3 = 2x² + 6x ✓']},
 {q:'x² − 2x − 8',steps:['Suche zwei Zahlen: Produkt −8, Summe −2','−4 und +2 passen: (−4)·2 = −8, −4+2 = −2','= <b>(x − 4)(x + 2)</b>']}],
gen:function(lvl){
 if(lvl===1){
  let g2=pick([2,3,4,5,6,7]),a=ri(1,5),b=ri(1,7),tries=0;
  while(gcd(a,b)!==1&&tries<20){a=ri(1,5);b=ri(1,7);tries++;}
  if(gcd(a,b)!==1){a=1;}
  const minus=pick([true,false]);const ib=minus?-b:b;
  const inner=linStr(a,ib)+'';
  const shown=co(g2*a,'x')+(g2*ib<0?' − '+Math.abs(g2*ib):' + '+(g2*ib));
  const acc=linAcc(a,ib).map(s=>g2+'('+s+')');
  return {q:'Klammere den größten gemeinsamen Faktor aus: '+shown,
   fields:[{l:'Ergebnis:',type:'txt',acc:acc}],
   steps:['ggT von '+(g2*a)+' und '+Math.abs(g2*ib)+' ist '+g2,'= <b>'+g2+'('+inner+')</b>','Probe durch Ausmultiplizieren!'],hint:'z. B. 4(2x+3)'};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const a=ri(2,9),v=pick(['x','a']);
   return {q:'Faktorisiere: '+v+'² + '+co(a,v),
    fields:[{l:'Ergebnis:',type:'txt',acc:[v+'('+v+'+'+a+')','('+v+'+'+a+')'+v,'('+v+'+'+a+')·'+v]}],
    steps:['Beide Terme enthalten '+v,'= <b>'+v+'('+v+' + '+a+')</b>'],hint:'z. B. x(x+5)'};}
  const k=ri(2,4),a=ri(2,6),v=pick(['x','m']);
  return {q:'Faktorisiere vollständig: '+co(k,v+'²')+' − '+co(k*a,v),
   fields:[{l:'Ergebnis:',type:'txt',acc:[k+v+'('+v+'-'+a+')','('+v+'-'+a+')'+k+v]}],
   steps:['Gemeinsamer Faktor: '+k+v,'= <b>'+k+v+'('+v+' − '+a+')</b>'],hint:'z. B. 4m(m-2)'};
 }
 let a=ri(-6,6),b=ri(-6,6),g=0;
 while((a===0||b===0||a===b||a+b===0)&&g<40){a=ri(-6,6);b=ri(-6,6);g++;}
 if(a===0||b===0||a===b||a+b===0){a=2;b=5;}
 const p=a+b,q2=a*b;
 return {q:'Faktorisiere das Trinom: '+polyStr(1,p,q2),
  fields:[{l:'Ergebnis:',type:'txt',acc:[facR(a)+facR(b),facR(b)+facR(a)]}],
  steps:['Suche zwei Zahlen mit <b>Produkt '+q2+'</b> und <b>Summe '+p+'</b>','Das sind '+a+' und '+b,'= <b>'+facR(a)+facR(b)+'</b>','Probe: Ausmultiplizieren ergibt wieder '+polyStr(1,p,q2)+' ✓'],hint:'z. B. (x+2)(x-3)'};
}},

/* ---------- B6 Bruchterme ---------- */
{id:'brt',ic:'🍰',t:'Bruchterme & Bruchgleichungen',blk:1,
ex:'<p>Bruchterme sind Brüche mit Variablen. Es gelten dieselben Regeln wie bei Zahlbrüchen – plus eine neue: Der <b>Nenner darf nie 0 werden</b> (Definitionsmenge!).</p>'+
'<div class="merk"><b>Merke:</b><br>• Gleiche Nenner: nur Zähler verrechnen: '+frac(2,'x')+' + '+frac(3,'x')+' = '+frac(5,'x')+'<br>• Verschiedene Nenner: erst Hauptnenner bilden.<br>• Bruchgleichungen: mit dem Hauptnenner multiplizieren – aber vorher notieren, welche x verboten sind.</div>',
exm:[
 {q:frac(1,'x')+' + '+frac(1,'2x'),steps:['Hauptnenner: 2x','Erweitern: '+frac(1,'x')+' = '+frac(2,'2x'),frac(2,'2x')+' + '+frac(1,'2x')+' = <b>'+frac(3,'2x')+'</b>']},
 {q:frac(3,'x − 1')+' = 6 lösen',steps:['Definitionsmenge: x ≠ 1 (sonst Nenner = 0)','Mal (x − 1): 3 = 6(x − 1) = 6x − 6','+6, dann :6: 9 = 6x → <b>x = 1,5</b> ✓ (erlaubt, da ≠ 1)']}],
gen:function(lvl){
 if(lvl===1){
  const c2=pick([2,3,4]),mult=ri(2,4);
  return {q:'Kürze: '+frac((c2*mult)+'x²',c2+'x'),
   fields:[{l:'Ergebnis:',type:'txt',acc:coAcc(mult,'x')}],
   steps:['Zahlen kürzen: '+(c2*mult)+' : '+c2+' = '+mult,'x² : x = x','= <b>'+co(mult,'x')+'</b>'],hint:'z. B. 2x'};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const a=ri(1,7),b=ri(1,7);
   return {q:'Fasse zusammen: '+frac(a,'x')+' + '+frac(b,'x'),
    fields:[{l:'Ergebnis:',type:'txt',acc:[(a+b)+'/x']}],
    steps:['Gleiche Nenner → Zähler addieren','= <b>'+frac(a+b,'x')+'</b>'],hint:'z. B. 5/x'};}
  if(v===1){const k=pick([2,3,4]);
   return {q:'Fasse zusammen: '+frac(1,'x')+' + '+frac(1,k+'x'),
    fields:[{l:'Ergebnis:',type:'txt',acc:[(k+1)+'/('+k+'x)',(k+1)+'/'+k+'x']}],
    steps:['Hauptnenner: '+k+'x','Erweitern: '+frac(1,'x')+' = '+frac(k,k+'x'),frac(k,k+'x')+' + '+frac(1,k+'x')+' = <b>'+frac(k+1,k+'x')+'</b>'],hint:'z. B. 3/(2x)'};}
  let c=ri(2,7),d=ri(1,5),g=0;while(2*c-d<=0&&g<10){c=ri(2,7);g++;}
  const num=2*c-d;
  return {q:'Fasse zusammen: '+frac(c,'a')+' − '+frac(d,'2a'),
   fields:[{l:'Ergebnis:',type:'txt',acc:[num+'/(2a)',num+'/2a']}],
   steps:['Hauptnenner: 2a','Erweitern: '+frac(c,'a')+' = '+frac(2*c,'2a'),frac(2*c,'2a')+' − '+frac(d,'2a')+' = <b>'+frac(num,'2a')+'</b>'],hint:'z. B. 5/(2a)'};
 }
 const v=pick([0,1,2]);
 if(v===0){const a=ri(2,12),b=pick([2,3,4,6]);
  return {q:'Löse (beachte: x ≠ 0): '+frac(a,'x')+' = '+b,
   fields:[{l:'x = (Bruch oder Dezimalzahl)',a:a/b}],
   steps:['Definitionsmenge: x ≠ 0','Beide Seiten · x:  '+a+' = '+co(b,'x'),'Beide Seiten : '+b+':  <b>x = '+fracTxt(a,b)+'</b>']};}
 if(v===1){const d=pick([2,3,4]),c=ri(1,9),b=d*ri(1,3),a=ri(1,8),x=c*b/d-a;
  return {q:'Löse: '+frac('x + '+a,b)+' = '+frac(c,d),
   fields:[{l:'x =',a:x}],
   steps:['Über Kreuz multiplizieren: '+d+'(x + '+a+') = '+c+' · '+b,linStr(d,d*a)+' = '+(c*b),'− '+(d*a)+', dann : '+d+':  <b>x = '+x+'</b>']};}
 const k=pick([2,3]),s=3*ri(1,4),x=2*k*s/3;
 return {q:'Löse: '+frac('x',k)+' + '+frac('x',2*k)+' = '+s,
  fields:[{l:'x =',a:x}],
  steps:['Hauptnenner: '+(2*k)+' → beide Seiten · '+(2*k),'2x + x = '+(2*k*s),'3x = '+(2*k*s)+' → <b>x = '+fmt(x)+'</b>']};
}},

/* ---------- B7 Quadratische Gleichungen ---------- */
{id:'qua',ic:'🎯',t:'Quadratische Gleichungen',blk:1,
ex:'<p>Quadratische Gleichungen (mit x²) haben meist <b>zwei Lösungen</b>. Die schnellsten Wege:</p>'+
'<div class="merk"><b>Werkzeugkasten:</b><br>1. <b>Ausklammern</b> (wenn kein konstantes Glied): x² − 5x = 0 → x(x − 5) = 0 → x = 0 oder x = 5<br>2. <b>Faktorisieren</b>: x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0<br>3. <b>Wurzel ziehen</b>: x² = 9 → x = ±3<br><br><b>Nullprodukt-Regel:</b> Ein Produkt ist 0, wenn (mindestens) ein Faktor 0 ist.</div>',
exm:[
 {q:'x² − 5x = 0',steps:['x ausklammern: x(x − 5) = 0','Nullprodukt: x = 0 oder x − 5 = 0','<b>x₁ = 0, x₂ = 5</b>']},
 {q:'x² + 6x + 8 = 0',steps:['Zwei Zahlen mit Produkt 8, Summe 6: → 2 und 4','(x + 2)(x + 4) = 0','<b>x₁ = −2, x₂ = −4</b>']}],
gen:function(lvl){
 if(lvl===1){
  const a=ri(2,9),neg=pick([true,false]);
  const p2=neg?-a:a;
  return {q:'Löse: x² '+(neg?'−':'+')+' '+co(a,'x')+' = 0',
   fields:[{l:'x₁ =',a:0},{l:'x₂ =',a:-p2}],setAns:true,
   steps:['x ausklammern: x(x '+(neg?'−':'+')+' '+a+') = 0','Nullprodukt-Regel: x = 0 oder x '+(neg?'−':'+')+' '+a+' = 0','<b>x₁ = 0, x₂ = '+(-p2)+'</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const c=ri(2,9);
   return {q:'Löse: x² − '+(c*c)+' = 0',
    fields:[{l:'x₁ =',a:c},{l:'x₂ =',a:-c}],setAns:true,
    steps:['+ '+(c*c)+':  x² = '+(c*c),'Wurzel ziehen (zwei Lösungen!): <b>x = ±'+c+'</b>','Oder: 3. binomische Formel (x−'+c+')(x+'+c+') = 0']};}
  let r1=ri(-6,6),r2=ri(-6,6),g=0;
  while((r1===0||r2===0||r1===r2)&&g<30){r1=ri(-6,6);r2=ri(-6,6);g++;}
  if(r1===0||r2===0||r1===r2){r1=2;r2=-3;}
  const p2=-(r1+r2),q2=r1*r2;
  return {q:'Löse: '+polyStr(1,p2,q2)+' = 0',
   fields:[{l:'x₁ =',a:r1},{l:'x₂ =',a:r2}],setAns:true,
   steps:['Suche zwei Zahlen mit Produkt '+q2+' und Summe '+p2+': → '+(-r1)+' und '+(-r2),'Faktorisieren: '+facR(-r1)+facR(-r2)+' = 0','Nullprodukt: <b>x₁ = '+r1+', x₂ = '+r2+'</b>','Alternative: pq-Formel mit p = '+p2+', q = '+q2]};
 }
 if(pick([0,1])===0){
  const k=pick([2,3]),a=ri(2,7);
  return {q:'Löse: '+co(k,'x²')+' − '+co(k*a,'x')+' = 0',
   fields:[{l:'x₁ =',a:0},{l:'x₂ =',a:a}],setAns:true,
   steps:['Durch '+k+' teilen: x² − '+co(a,'x')+' = 0','x ausklammern: x(x − '+a+') = 0','<b>x₁ = 0, x₂ = '+a+'</b>']};}
 let r1=ri(-6,6),r2=ri(-6,6),g=0;
 while((r1===0||r2===0||r1===r2||r1+r2===0)&&g<30){r1=ri(-6,6);r2=ri(-6,6);g++;}
 if(r1===0||r2===0||r1===r2||r1+r2===0){r1=2;r2=-7;}
 const B=-(r1+r2),C=-r1*r2;
 return {q:'<b>Anders als gewohnt:</b> Löse x² '+(B<0?'− '+(-B):'+ '+B)+'x = '+C,
  fields:[{l:'x₁ =',a:r1},{l:'x₂ =',a:r2}],setAns:true,
  steps:['Erst alles auf eine Seite: '+polyStr(1,B,-C)+' = 0','Zwei Zahlen mit Produkt '+(-C)+' und Summe '+B+': → '+(-r1)+' und '+(-r2),facR(-r1)+facR(-r2)+' = 0','<b>x₁ = '+r1+', x₂ = '+r2+'</b>'],
  hint:'Bringe die Gleichung zuerst in die Form ... = 0'};
}},

/* ---------- B8 Textaufgaben ---------- */
{id:'txt',ic:'📖',t:'Textaufgaben übersetzen',blk:1,
ex:'<p>Textaufgaben sind Übersetzungsarbeit: Deutsch → Mathematik. Genau diese Fähigkeit brauchst du bei <b>unbekannten Aufgaben</b> in Klausuren.</p>'+
'<div class="merk"><b>Strategie in 4 Schritten:</b><br>1. <b>Was ist gesucht?</b> Nenne es x.<br>2. <b>Übersetze</b> den Text Stück für Stück in eine Gleichung.<br>3. <b>Löse</b> die Gleichung.<br>4. <b>Antworte im Satz</b> und prüfe, ob das Ergebnis sinnvoll ist.</div>'+
'<p>Übersetzungshilfen: „das Dreifache" → 3x · „um 5 mehr" → +5 · „die Summe" → + · „ergibt" → =</p>',
exm:[
 {q:'Das Dreifache einer Zahl minus 4 ist 11. Welche Zahl?',steps:['Gesucht: die Zahl x','Übersetzen: 3x − 4 = 11','+4: 3x = 15 → :3: <b>x = 5</b>','Probe: 3·5 − 4 = 11 ✓']},
 {q:'Die Summe zweier aufeinanderfolgender Zahlen ist 31.',steps:['Kleinere Zahl: x, größere: x + 1','x + (x + 1) = 31','2x + 1 = 31 → 2x = 30 → <b>x = 15</b>','Die Zahlen sind 15 und 16.']}],
gen:function(lvl){
 if(lvl===1){

   fields:[{l:'Die Zahl:',a:x}],
   steps:['Gleichung: x '+(plus?'+':'−')+' '+a+' = '+b,(plus?'− ':'+ ')+a+' auf beiden Seiten','<b>x = '+x+'</b>']};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const k=pick([2,3,4,5]),x=ri(2,12),a=ri(1,10),b=k*x-a;
   return {q:'Das '+['','','Doppelte','Dreifache','Vierfache','Fünffache'][k]+' einer Zahl minus '+a+' ist '+b+'. Welche Zahl?',
    fields:[{l:'Die Zahl:',a:x}],
    steps:['Gleichung: '+k+'x − '+a+' = '+b,'+ '+a+':  '+k+'x = '+(b+a),': '+k+':  <b>x = '+x+'</b>']};}
  if(v===1){const n=ri(5,40),S=2*n+1;
   return {q:'Die Summe zweier aufeinanderfolgender natürlicher Zahlen ist '+S+'. Wie heißt die <b>kleinere</b> Zahl?',
    fields:[{l:'Kleinere Zahl:',a:n}],
    steps:['Kleinere Zahl x, größere x + 1','x + (x + 1) = '+S,'2x + 1 = '+S+' → 2x = '+(S-1)+' → <b>x = '+n+'</b>']};}
  const net=ri(2,10)*100;
  return {q:'Ein Laptop kostet mit 19 % Mehrwertsteuer '+fmt(net*1.19)+' €. Wie hoch ist der <b>Nettopreis</b> (ohne MwSt.)?',
   fields:[{l:'Nettopreis (€):',a:net}],
   steps:['Brutto = Netto · 1,19','Netto = '+fmt(net*1.19)+' : 1,19','<b>= '+net+' €</b>'],
   hint:'Nicht einfach 19 % abziehen – die MwSt. wurde auf den Nettopreis gerechnet!'};
 }
 if(pick([0,1])===0){
  const x=ri(3,15),a=ri(2,8),U=2*(2*x+a);
  return {q:'Ein Rechteck ist '+a+' cm länger als breit. Sein Umfang beträgt '+U+' cm. Wie breit ist es?',
   fields:[{l:'Breite (cm):',a:x}],
   steps:['Breite x, Länge x + '+a,'Umfang: 2 · (x + x + '+a+') = '+U,'2 · (2x + '+a+') = '+U+'  →  4x + '+(2*a)+' = '+U,'4x = '+(U-2*a)+'  →  <b>x = '+x+' cm</b>']};}
 const k=pick([2,3,4]),s=ri(8,16),S=(k+1)*s;
 return {q:'Ein Vater ist '+k+'-mal so alt wie sein Sohn. Zusammen sind sie '+S+' Jahre alt. Wie alt ist der Sohn?',
  fields:[{l:'Alter des Sohnes:',a:s}],
  steps:['Sohn: x Jahre, Vater: '+k+'x Jahre','x + '+k+'x = '+S,co(k+1,'x')+' = '+S+'  →  <b>x = '+s+'</b>','Der Vater ist '+(k*s)+' Jahre alt. Probe: '+s+' + '+(k*s)+' = '+S+' ✓']};
}},
