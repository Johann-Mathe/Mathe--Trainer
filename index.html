<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mathe-Basis-Trainer</title>
<meta name="theme-color" content="#0c0e1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mathe-Trainer">
<style>
/* ==========================================================================
   DESIGN-SYSTEM
   Marke: Indigo → Violett mit Amber-Akzent (abgeleitet aus dem App-Icon).
   Grün ist ausschließlich „richtig", Rosé ausschließlich „falsch".
   ========================================================================== */
:root{
 /* -- Marke & Semantik -- */
 --brand:#6b6cf6;   --brand-2:#9061f9; --brand-d:#4c4ddb; --brand-ink:#fff;
 --brand-soft:rgba(107,108,246,.15); --brand-line:rgba(122,124,255,.45);
 --accent:#ffc233;  --accent-d:#d2960f; --accent-ink:#3a2900; --accent-soft:rgba(255,194,51,.13);
 --ok:#35d39a;      --ok-d:#1da97a;     --ok-ink:#04291d;    --ok-soft:rgba(53,211,154,.13);
 --bad:#ff5c7a;     --bad-d:#dd4162;    --bad-ink:#3a0512;   --bad-soft:rgba(255,92,122,.13);
 --warn:#ffa53d;    --warn-d:#d97d16;   --warn-ink:#3a2200;  --warn-soft:rgba(255,165,61,.13);

 /* -- Flächen & Text -- */
 --bg:#0c0e1b; --surface:#151932; --surface-2:#1d2242; --surface-3:#272d55;
 --line:#2b3159; --line-2:#3a4172;
 --ink:#eceefb; --ink-2:#b6bce0; --ink-3:#8b93bd;

 /* -- Radien -- */
 --r1:10px; --r2:14px; --r3:18px; --r4:26px; --rp:999px;
 /* -- Abstände (4er-Raster) -- */
 --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px;
 /* -- Schriftgrößen -- */
 --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.125rem; --t-xl:1.35rem; --t-2xl:1.7rem;
 /* -- Tiefe & Zeit -- */
 --sh1:0 1px 2px rgba(0,0,0,.3);
 --sh2:0 6px 18px rgba(0,0,0,.32);
 --sh3:0 14px 40px rgba(0,0,0,.45);
 /* -- Motion-Tokens: eine Sprache für alle Bewegungen --
    e-out  Standard, weich auslaufend, nie linear
    e-soft beidseitig weich, für Zustandswechsel
    e-pop  leichter Overshoot, für Belohnungen und Dialoge  */
 --e-out:cubic-bezier(.22,.8,.3,1);
 --e-soft:cubic-bezier(.4,0,.2,1);
 --e-pop:cubic-bezier(.2,1.35,.4,1);
 --t-fast:.16s; --t-base:.26s; --t-slow:.42s;
 --dur:var(--t-fast); --ease:var(--e-out);

 /* -- Layout-Messwerte (per JS gesetzt) -- */
 --hdrh:58px; --dockh:0px; --tabh:64px;

 /* -- Kompatibilität: alte Variablennamen zeigen auf die neuen Tokens -- */
 --card:var(--surface); --card2:var(--surface-2); --mut:var(--ink-3); --rad:var(--r3);
 --grn:var(--ok); --grnD:var(--ok-d); --blu:var(--brand); --bluD:var(--brand-d);
 --red:var(--bad); --redD:var(--bad-d); --gold:var(--accent); --goldD:var(--accent-d);
 --org:var(--warn); --orgD:var(--warn-d); --pur:var(--brand-2); --pri:var(--brand);
 --badbg:var(--bad-soft); --okbg:var(--ok-soft);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 background:var(--bg);color:var(--ink);font-size:16.5px;line-height:1.55;font-weight:500;
 -webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:var(--t-md);cursor:pointer;border:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:1.05rem;border:2px solid var(--line);
 border-radius:var(--r1);padding:10px 13px;background:var(--surface-2);color:var(--ink);transition:border-color var(--dur)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
input.is-ok{border-color:var(--ok)}
input.is-bad{border-color:var(--bad)}
::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--brand-line);outline-offset:2px}

/* ---------- Icons (ein durchgehender Strich-Stil) ---------- */
.ico{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.22em;
 fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:1em;height:1em}
.ico.lg{width:1.6em;height:1.6em}
#sprite{display:none}

/* ==========================================================================
   KOPFZEILE  –  eine Zeile, bricht nie um
   ========================================================================== */
header{position:sticky;top:0;z-index:50;background:rgba(12,14,27,.88);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:var(--s2);max-width:640px;margin:0 auto;padding:9px var(--s4) 8px}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.98rem;
 letter-spacing:-.01em;white-space:nowrap;color:var(--ink);padding:2px 0}
.brand .ico{color:var(--brand);width:1.4em;height:1.4em}
.hstat{display:flex;align-items:center;gap:6px;margin-left:auto}
.stat{display:flex;align-items:center;gap:4px;border-radius:var(--rp);padding:4px 10px 4px 8px;
 font-size:.86rem;font-weight:800;white-space:nowrap;background:var(--surface-2);
 border:1px solid var(--line);line-height:1.2}
.stat .ico{width:1.05em;height:1.05em}
#hStreak{color:var(--warn)}
#hJoker{color:var(--brand)}
#hLvl{color:var(--accent)}
/* dünner XP-Faden unter der Kopfzeile – ersetzt den alten Balken-Chip */
.xpline{height:3px;background:var(--surface-2)}
.xpline>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));
 width:0;transition:width .45s var(--ease)}
/* Alt-Klassen aus dem JS bleiben nutzbar */
.chip{border-radius:var(--rp);font-weight:800}
.xpwrap{display:flex;align-items:center;gap:var(--s2)}
.xpbar{flex:1;height:8px;background:var(--surface-2);border-radius:var(--rp);overflow:hidden}
.xpbar>div{height:100%;background:var(--accent);border-radius:var(--rp);transition:width .45s var(--ease)}

main{max-width:640px;margin:0 auto;padding:var(--s5) var(--s4) calc(var(--tabh) + var(--s6))}
body.intask main{padding-bottom:calc(var(--dockh) + var(--s5))}
/* Screenwechsel: erste drei Blöcke kommen leicht versetzt herein.
   Nur opacity und transform – kein Reflow. */
@keyframes viewin{from{opacity:0;transform:translateY(10px) scale(.994)}to{opacity:1;transform:none}}
main>*{animation:viewin var(--t-base) var(--e-out) both}
main>*:nth-child(2){animation-delay:.045s}
main>*:nth-child(3){animation-delay:.09s}
main>*:nth-child(n+4){animation-delay:.12s}

/* ==========================================================================
   KARTEN & TYPOGRAFIE
   ========================================================================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
 padding:var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh1);
 transition:box-shadow var(--t-base) var(--e-out),border-color var(--t-base) var(--e-out)}
/* Karten mit eigener Hauptaktion heben sich beim Antippen leicht */
.card:has(.btn:active){box-shadow:var(--sh2);border-color:var(--line-2)}
h1{font-size:var(--t-xl);line-height:1.25;margin-bottom:var(--s1);font-weight:800;letter-spacing:-.015em}
h2{font-size:var(--t-lg);line-height:1.3;margin-bottom:var(--s3);font-weight:800;letter-spacing:-.01em;
 display:flex;align-items:center;gap:var(--s2)}
h2 .ico{color:var(--brand)}
h3{font-size:var(--t-md);margin:var(--s4) 0 var(--s2);font-weight:800}
p+p{margin-top:var(--s2)}
.mut{color:var(--ink-2);font-size:var(--t-sm)}
.hint{font-size:var(--t-sm);color:var(--ink-3);margin-top:var(--s1)}
b,strong{font-weight:800}

/* ==========================================================================
   BUTTONS  –  ein System, fünf Varianten. Keine Großbuchstaben.
   ========================================================================== */
.btn{--btn-bg:var(--brand);--btn-ink:var(--brand-ink);--btn-edge:var(--brand-d);
 display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
 background:var(--btn-bg);color:var(--btn-ink);border-radius:var(--r2);
 padding:12px 20px;font-weight:750;font-size:var(--t-md);letter-spacing:-.005em;
 box-shadow:0 2px 0 var(--btn-edge),var(--sh1);
 transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),filter var(--dur)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--btn-edge)}
.btn.big{font-size:1.05rem;padding:14px 24px;width:100%}
.btn.sec{--btn-bg:var(--surface-2);--btn-ink:var(--ink);--btn-edge:var(--line-2)}
.btn.ghost{--btn-bg:transparent;--btn-ink:var(--ink-2);--btn-edge:transparent;
 box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:active{transform:translateY(1px)}
.btn.warn{--btn-bg:var(--warn);--btn-ink:var(--warn-ink);--btn-edge:var(--warn-d)}
.btn.blue{--btn-bg:var(--brand);--btn-ink:var(--brand-ink);--btn-edge:var(--brand-d)}
.btn.okbtn{--btn-bg:var(--ok);--btn-ink:var(--ok-ink);--btn-edge:var(--ok-d)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btnrow{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;
 font-size:var(--t-sm);padding:var(--s2) 0;margin-bottom:var(--s2)}
.crumb:hover{color:var(--ink)}

/* ==========================================================================
   AUFGABEN
   ========================================================================== */
.lvlb{display:inline-flex;align-items:center;border-radius:var(--rp);padding:3px 11px;
 font-size:var(--t-xs);font-weight:800;letter-spacing:.01em}
.lvl1{background:var(--ok-soft);color:var(--ok)}
.lvl2{background:var(--accent-soft);color:var(--accent)}
.lvl3{background:var(--brand-soft);color:var(--brand-2)}
.q{font-size:1.2rem;margin:var(--s3) 0 var(--s4);line-height:1.9;font-weight:600;letter-spacing:-.005em}
.fieldrow{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0;flex-wrap:wrap}
.fieldrow label{font-weight:700;font-size:var(--t-sm);color:var(--ink-2);min-width:0}
.fieldrow input{width:170px}

/* Antwort-Optionen */
.mcopt{display:flex;align-items:center;width:100%;min-height:58px;text-align:left;background:var(--surface-2);
 border-radius:var(--r2);padding:13px 16px;margin:10px 0;font-size:1.03rem;font-weight:600;
 box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);
 transition:box-shadow var(--dur),transform var(--dur) var(--ease),background var(--dur)}
.mcopt:hover{box-shadow:inset 0 0 0 1.5px var(--line-2),0 2px 0 var(--line)}
.mcopt:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mcopt.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.mcopt.bad{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.mcopt:disabled{opacity:1}

/* Rückmeldung + Aktionsleiste liegen zusammen im Dock (siehe unten) */
.fb{border-radius:var(--r2);padding:13px 16px;margin:var(--s3) 0;font-weight:700;display:none;
 font-size:.97rem;line-height:1.45}
.fb.ok{background:var(--ok-soft);color:var(--ok);display:block}
.fb.bad{background:var(--bad-soft);color:#ffa9b9;display:block}
.fb .ico{color:currentColor}

.steps{background:var(--surface-2);border-radius:var(--r2);padding:var(--s4) var(--s5);
 margin:var(--s3) 0;display:none;border:1px solid var(--line)}
.steps.show{display:block;animation:viewin .22s var(--ease)}
.steps>b{display:block;margin-bottom:var(--s2);color:var(--ink-2);font-size:var(--t-sm)}
.steps .st{padding:5px 0;line-height:1.9}
.steps .st::before{content:"→ ";color:var(--brand);font-weight:800}

/* Brüche, Wurzeln, Hochzahlen */
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 5px}
.fr>span:last-child{padding:0 5px}
.ol{text-decoration:overline}
sup{font-size:.72em}

/* ==========================================================================
   DOCK  –  fixe Leiste unten: Rückmeldung + genau eine Hauptaktion
   ========================================================================== */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none}
#dock:empty{display:none}
#dock>*{pointer-events:auto}
/* Im Dock deckend: die Einfärbung liegt als Inset über einer festen Fläche,
   sonst scheint der Aufgabentext durch. */
#dock .fb{margin:0;border-radius:0;padding:14px var(--s4);animation:sheetup .2s var(--ease);
 background:var(--surface);border-top:1px solid var(--line)}
#dock .fb.ok{box-shadow:inset 0 0 0 999px var(--ok-soft)}
#dock .fb.bad{box-shadow:inset 0 0 0 999px var(--bad-soft)}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#dock .btnrow.taskbar{margin:0;background:var(--surface);border-top:1px solid var(--line);
 padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
 display:flex;gap:var(--s2);align-items:center;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
#dock .btnrow.taskbar .btn{flex:1 1 0;min-width:0;font-size:1.02rem}
/* Nebenaktion (Lösungsweg) tritt zurück – nur eine dominante Aktion pro Screen */
#dock .btnrow.taskbar .btn.ghost{flex:0 0 auto;padding:12px 13px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3)}
#dock .btnrow.taskbar .btn.ghost:hover{color:var(--ink-2)}
#dock .btnrow.taskbar .btn.ghost .ico{width:1.35em;height:1.35em}
.dockhint{flex:1 1 0;min-width:0;color:var(--ink-3);font-size:var(--t-sm);font-weight:600;text-align:center}
body.intask .tabbar{display:none}

/* ==========================================================================
   SESSION-KOPF (Fortschritt, Schilde, Timer)
   ========================================================================== */
.lessonhead{position:sticky;top:var(--hdrh);z-index:45;display:flex;align-items:center;gap:var(--s3);
 padding:var(--s3) 0;background:var(--bg);margin-bottom:var(--s1)}
.lx{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;
 border-radius:var(--rp);color:var(--ink-3);background:var(--surface-2);
 transition:color var(--dur),background var(--dur)}
.lx:hover{color:var(--ink);background:var(--surface-3)}
.lx:active{transform:scale(.94)}
.lprog{flex:1;height:12px;background:var(--surface-2);border-radius:var(--rp);overflow:hidden}
.lprog>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));
 border-radius:var(--rp);transition:width .45s var(--ease);
 box-shadow:0 0 12px rgba(122,124,255,.45)}
.lshield{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--ink-2);
 white-space:nowrap;font-size:.95rem;font-variant-numeric:tabular-nums}
.lshield.shields{color:var(--bad)}   /* nur die Schilde signalisieren Gefahr, nicht die Uhr */
.lmeta{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
 margin-bottom:var(--s3);flex-wrap:wrap}
.phase{background:var(--brand-soft);color:var(--brand-2);border-radius:var(--rp);padding:4px 13px;
 font-weight:800;font-size:var(--t-xs);display:inline-flex;align-items:center;gap:6px}
.phase.hot{background:var(--warn-soft);color:var(--warn)}
.phase.grow{background:var(--ok-soft);color:var(--ok)}
.sessmeta{display:flex;justify-content:flex-end;align-items:center;gap:var(--s2);margin:0 0 var(--s2)}
.comboflame{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--warn),var(--bad));
 color:#fff;border-radius:var(--rp);padding:3px 10px;font-weight:800;font-size:var(--t-sm);
 white-space:nowrap;animation:pop .25s var(--ease)}
.sessbar{height:10px;background:var(--surface-2);border-radius:var(--rp);overflow:hidden;margin:var(--s3) 0 var(--s4)}
.sessbar>div{height:100%;background:var(--ok);transition:width .3s var(--ease)}
.shieldrow{font-size:1.1rem;letter-spacing:2px}
.blitztime{display:flex;align-items:center;gap:5px;font-size:1.15rem;font-weight:800;color:var(--warn);
 font-variant-numeric:tabular-nums}

/* ---------- Tagesfortschritt (Startseite) ---------- */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
 padding:var(--s4);margin-bottom:var(--s4);box-shadow:var(--sh1)}
.todayrow{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2)}
.todaynum{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.todaynum span{font-size:var(--t-sm);font-weight:700;color:var(--ink-3);letter-spacing:0}
.todaystreak{display:flex;align-items:center;gap:5px;color:var(--warn);font-weight:800;font-size:1.05rem}
.today .hint{margin-top:6px}

/* ==========================================================================
   LERNPFAD
   ========================================================================== */
.path{position:relative;max-width:420px;margin:0 auto;padding:var(--s2) 0 var(--s5);overflow:hidden}
.pblock{text-align:center;margin:var(--s6) 0 var(--s5);display:flex;align-items:center;gap:var(--s3)}
.pblock::before,.pblock::after{content:'';flex:1 0 16px;height:1px;background:var(--line)}
.pblock span{display:block;color:var(--ink-2);font-weight:800;font-size:var(--t-sm);
 letter-spacing:-.01em;line-height:1.3}
.pblock small{display:block;color:var(--ink-3);font-weight:600;font-size:var(--t-xs);margin-top:1px}
.prow{position:relative;display:flex;justify-content:center;margin:6px 0}
.prow.bub{margin-top:56px}   /* Platz für die START-Sprechblase */
/* Versatz in Prozent der Pfadbreite – die Verbindungskurven rechnen mit
   denselben Werten und passen dadurch auf jeder Bildschirmbreite. */
.prow.o0{transform:translateX(-17%)}
.prow.o1{transform:translateX(-8.5%)}
.prow.o2{transform:none}
.prow.o3{transform:translateX(8.5%)}
.prow.o4{transform:translateX(17%)}

/* ---------- Verbindungen zwischen den Stationen ---------- */
.pconn{height:52px;margin:-2px 0;pointer-events:none}
.pconn svg{display:block;width:100%;height:52px}
.pc-line{fill:none;stroke:var(--surface-3);stroke-width:5;stroke-linecap:round}
.pconn.done .pc-line{stroke:var(--ok);opacity:.55}
.pconn.open .pc-line{stroke:var(--line-2)}
.pconn.lock .pc-line{stroke:var(--surface-3);stroke-dasharray:2 9}
/* die Verbindung zur aktuellen Station: fließende Energie */
.pconn.now .pc-line{stroke:var(--brand);stroke-dasharray:9 11;animation:pc-flow 1.4s linear infinite}
@keyframes pc-flow{to{stroke-dashoffset:-20}}
.nwrap{position:relative;text-align:center;width:112px}
.node{width:72px;height:72px;border-radius:50%;margin:0 auto;display:flex;align-items:center;
 justify-content:center;cursor:pointer;position:relative;
 box-shadow:0 5px 0 var(--nedge,rgba(0,0,0,.35)),var(--sh2);
 transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.node:active{transform:translateY(4px);box-shadow:0 1px 0 var(--nedge,rgba(0,0,0,.35))}
.node.avail{background:var(--surface-2);--nedge:var(--line);color:var(--ink-2);
 box-shadow:0 5px 0 var(--line),inset 0 0 0 1.5px var(--line-2)}
.node.cur{background:linear-gradient(150deg,var(--brand),var(--brand-2));--nedge:var(--brand-d);color:#fff}
.node.done{background:var(--ok);--nedge:var(--ok-d);color:var(--ok-ink)}
.node.lock{background:var(--surface);--nedge:#1a1f3c;color:var(--ink-3);opacity:.55}
/* Themen-Icon im Knoten */
.micon{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
 width:1.3em;height:1.3em;vertical-align:-.24em;flex:none}
.micon.node{width:36px;height:36px;stroke-width:1.75}
.micon.big{width:1.15em;height:1.15em;vertical-align:-.14em;color:var(--brand-2)}
/* Zustands-Icons (Haken, Schloss, Zielstern) im Knoten */
.node>.ico,.node .ck .ico{width:32px;height:32px;stroke-width:2.1}
/* Schweben nur an der aktuellen Station. Alle offenen Knoten wippen zu lassen
   ergab bei 21 freigeschalteten Modulen 20 Dauer-Animationen gleichzeitig –
   sichtbar unruhig und unnötig teuer. */
@keyframes nodebob{50%{transform:translateY(-4px)}}
.node.cur{animation:nodebob 4.2s ease-in-out infinite}
.node .ck{position:absolute;display:flex;color:var(--ok-ink)}
.node .ck .ico{width:34px;height:34px;stroke-width:2.6}
.nring{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:88px;height:88px;
 border-radius:50%;z-index:0}
.node.z{position:relative;z-index:1}
.nlab{margin-top:var(--s2);font-size:var(--t-xs);font-weight:700;color:var(--ink-2);line-height:1.3;cursor:pointer}
.nflag{position:absolute;top:-4px;right:2px;display:flex;align-items:center;gap:2px;
 background:var(--surface);border-radius:var(--rp);padding:3px 6px;border:1px solid var(--line);z-index:2}
.nflag .ico{width:13px;height:13px}
.nflag .f-due{color:var(--accent)}
.nflag .f-boss{color:var(--bad)}
.startbub{position:absolute;left:50%;top:-42px;transform:translateX(-50%);background:var(--ink);
 color:var(--bg);font-weight:800;letter-spacing:.04em;font-size:var(--t-xs);border-radius:var(--r1);
 padding:6px 14px;z-index:3;box-shadow:var(--sh2);white-space:nowrap}
.startbub::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
 border:7px solid transparent;border-top-color:var(--ink);border-bottom:none}
.sidefig{position:absolute;top:6px;font-size:2.3rem;opacity:.85;
 filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.sidefig.l{left:-2px}
.sidefig.r{right:-2px}
.chestnode{width:78px;height:64px;margin:0 auto;font-size:2.7rem;display:flex;align-items:center;
 justify-content:center;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}

/* ==========================================================================
   TAB-LEISTE  –  einheitliche Strich-Icons statt Emoji
   ========================================================================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(12,14,27,.94);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
 display:flex;justify-content:space-around;padding:6px var(--s1) calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:110px;min-height:50px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;
 padding:6px var(--s1) 5px;border-radius:var(--r2);color:var(--ink-3);
 transition:color var(--dur),background var(--dur)}
.tabbar button .ico{width:23px;height:23px;stroke-width:1.8}
.tabbar button small{font-size:.66rem;font-weight:700;letter-spacing:.01em}
.tabbar button.on{color:var(--brand);background:var(--brand-soft)}

/* ==========================================================================
   INHALTS-BOXEN  –  eine Grundform, vier Akzente
   ========================================================================== */
.merk,.exbox,.bossbox,.duebar,.boostbar,.quest,.jentry{
 border-radius:var(--r2);padding:var(--s3) var(--s4);margin:var(--s3) 0;
 background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent-line,var(--line))}
.merk{--accent-line:var(--brand);background:var(--brand-soft);border-color:transparent;border-left-color:var(--brand)}
.merk b{color:var(--brand-2)}
.exbox{--accent-line:var(--accent);background:var(--accent-soft);border-color:transparent;border-left-color:var(--accent)}
.exbox .stp{padding:6px 0;border-bottom:1px dashed rgba(255,194,51,.25)}
.exbox .stp:last-child{border-bottom:none}
.duebar{--accent-line:var(--accent);background:var(--accent-soft);border-color:transparent;border-left-color:var(--accent)}
.boostbar{--accent-line:var(--accent);background:var(--accent-soft);border-color:transparent;
 border-left-color:var(--accent);font-weight:700;margin-bottom:var(--s4)}
.quest{--accent-line:var(--brand)}
.quest.done{--accent-line:var(--ok);background:var(--ok-soft);border-color:transparent;border-left-color:var(--ok)}
.jentry{--accent-line:var(--brand)}
.bossbox{background:linear-gradient(140deg,rgba(144,97,249,.16),rgba(255,92,122,.13));
 border-color:var(--line);border-left-color:var(--bad);padding:var(--s4)}
.formel{background:var(--surface-3);border-radius:var(--r1);padding:7px 13px;margin:5px 0;
 font-size:1.04rem;display:inline-block}
.qtop{display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--t-sm);
 margin-bottom:6px;font-weight:700}

.tabs{display:flex;gap:var(--s2);margin-bottom:var(--s4);background:var(--surface-2);
 padding:4px;border-radius:var(--r2)}
.tab{flex:1;padding:10px;text-align:center;border-radius:var(--r1);font-weight:750;cursor:pointer;
 color:var(--ink-3);font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px;
 transition:color var(--dur),background var(--dur)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}

.pbar{height:8px;background:var(--surface-3);border-radius:var(--rp);overflow:hidden;margin-top:var(--s2)}
.pbar>div{height:100%;background:var(--brand);border-radius:var(--rp);transition:width .4s var(--ease)}
.stars{display:inline-flex;gap:2px;color:var(--accent);vertical-align:-.15em}
.stars .ico{width:14px;height:14px;stroke-width:1.6}
.stars .off{color:var(--line-2)}
.bigemoji{font-size:3rem;text-align:center;margin:var(--s3) 0}

.statrow{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s4) 0}
.statbox{flex:1 1 100px;min-width:100px;background:var(--surface-2);border-radius:var(--r2);
 padding:var(--s3);text-align:center;border:1px solid var(--line)}
.statbox .v{font-size:1.4rem;font-weight:800;color:var(--ink);line-height:1.2;
 display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.statbox .v .ico{color:var(--accent);width:1.05em;height:1.05em}
.statbox .l{font-size:var(--t-xs);color:var(--ink-3);font-weight:700;margin-top:2px}

.badgewrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s2)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
 border:1px solid var(--line);border-radius:var(--rp);padding:5px 12px;font-size:var(--t-sm);font-weight:700}
.badge.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge.off{opacity:.4}

/* ==========================================================================
   CHARAKTERE
   Bewegt wird ausschließlich transform – keine Layout-Reflows.
   Die Drehpunkte (transform-origin) stecken in SVG-Einheiten in den Dateien.
   ========================================================================== */
.char{display:inline-block;line-height:0;flex:none}
.char svg{display:block;width:100%;height:auto;overflow:visible}
.char--sm{width:46px}
.char--md{width:88px}
.char--lg{width:136px}
.char [data-part]{transform-box:view-box;
 transition:transform var(--t-slow) var(--e-out),translate var(--t-slow) var(--e-out),
            rotate var(--t-slow) var(--e-out),scale var(--t-slow) var(--e-out)}
.char [data-part="root"]{transform-origin:100px 240px}

/* --- idle ---------------------------------------------------------------
   Zwei entkoppelte Zyklen auf getrennten Eigenschaften: Atmen (3,1 s) und
   Gewichtsverlagerung (4,9 s). Die Kombination wiederholt sich erst nach
   ~15 s, dadurch wirkt es nicht wie ein Loop. Blinzeln und Umsehen kommen
   in zufälligen Abständen aus charLife() dazu. */
@keyframes ch-breathe{0%,100%{translate:0 0;scale:1 1}50%{translate:0 -2.5px;scale:1.004 1.016}}
@keyframes ch-sway{0%,100%{rotate:-.9deg}50%{rotate:.9deg}}
.char.is-idle [data-part="root"]{animation:ch-breathe 3.1s ease-in-out infinite,
                                           ch-sway 4.9s ease-in-out infinite}
/* die Arme schwingen minimal mit, versetzt zum Atmen */
@keyframes ch-armidle{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.char.is-idle [data-part="arm-left"]{animation:ch-armidle 5.3s ease-in-out infinite}
.char.is-idle [data-part="arm-right"]{animation:ch-armidle 5.3s ease-in-out infinite -2.6s}

/* --- Blinzeln und Umsehen (einmalige Klassen, per JS ausgelöst) --------- */
@keyframes ch-blink{0%,100%{transform:scaleY(1)}42%,58%{transform:scaleY(.1)}}
.char.blink [data-part="eye-left"],
.char.blink [data-part="eye-right"]{animation:ch-blink .26s var(--e-soft)}
@keyframes ch-glance{0%,100%{transform:translate(0,0)}22%,62%{transform:translate(3.5px,-1.5px)}}
.char.glance [data-part="pupil-left"],
.char.glance [data-part="pupil-right"]{animation:ch-glance 1.5s var(--e-soft)}

/* --- happy: Squash beim Absprung, Stretch in der Luft, Squash bei Landung */
@keyframes ch-hop{
 0%  {translate:0 0;    scale:1 1}
 14% {translate:0 1px;  scale:1.07 .93}
 44% {translate:0 -15px;scale:.95 1.06}
 72% {translate:0 0;    scale:1.08 .92}
 88% {translate:0 -2px; scale:.99 1.01}
 100%{translate:0 0;    scale:1 1}}
@keyframes ch-armswing{0%,100%{transform:rotate(0)}45%{transform:rotate(var(--sw,24deg))}}
.char.is-happy [data-part="root"]{animation:ch-hop .62s var(--e-pop) 2}
.char.is-happy [data-part="arm-left"]{--sw:26deg;animation:ch-armswing .62s var(--e-pop) 2}
.char.is-happy [data-part="arm-right"]{--sw:-26deg;animation:ch-armswing .62s var(--e-pop) 2}
.char.is-happy [data-part="eye-left"],
.char.is-happy [data-part="eye-right"]{transform:scale(1.1)}
.char.is-happy [data-part="mouth"]{transform:scale(1.1)}

/* --- celebrate: größer, mit kurzer Drehung ------------------------------ */
@keyframes ch-cheer{
 0%  {translate:0 0;    scale:1 1;      rotate:0deg}
 12% {translate:0 2px;  scale:1.09 .91; rotate:0deg}
 42% {translate:0 -24px;scale:.93 1.09; rotate:-6deg}
 60% {rotate:5deg}
 78% {translate:0 0;    scale:1.11 .89; rotate:0deg}
 90% {translate:0 -3px; scale:.98 1.02}
 100%{translate:0 0;    scale:1 1;      rotate:0deg}}
.char.is-celebrate [data-part="root"]{animation:ch-cheer .78s var(--e-pop) 3}
.char.is-celebrate [data-part="arm-left"]{--sw:38deg;animation:ch-armswing .78s var(--e-pop) 3}
.char.is-celebrate [data-part="arm-right"]{--sw:-38deg;animation:ch-armswing .78s var(--e-pop) 3}
.char.is-celebrate [data-part="mouth"]{transform:scale(1.18)}
.char.is-celebrate [data-part="brows"]{transform:translateY(-4px)}
.char.is-celebrate [data-part="eye-left"],
.char.is-celebrate [data-part="eye-right"]{transform:scale(1.12)}

/* --- sad: sinkt ein, atmet langsamer, Blick nach unten ------------------ */
@keyframes ch-sadbreathe{0%,100%{translate:0 4px;scale:1 .978}50%{translate:0 2.5px;scale:1 .992}}
.char.is-sad [data-part="root"]{rotate:1.6deg;animation:ch-sadbreathe 4.8s ease-in-out infinite}
.char.is-sad [data-part="face"]{transform:translateY(4px)}
.char.is-sad [data-part="brows"]{transform:translateY(6px)}
.char.is-sad [data-part="pupil-left"],
.char.is-sad [data-part="pupil-right"]{transform:translateY(3.5px)}
.char.is-sad [data-part="arm-left"]{transform:rotate(-16deg)}
.char.is-sad [data-part="arm-right"]{transform:rotate(14deg)}
.char.is-sad [data-part="mouth"]{transform:translateY(4px) scaleY(-.75)}

/* --- thinking: Kopfneigung, Blick nach oben, eine Hand hebt sich -------- */
.char.is-thinking [data-part="root"]{rotate:-5deg;animation:ch-breathe 3.7s ease-in-out infinite}
.char.is-thinking [data-part="brows"]{transform:translateY(-4px)}
.char.is-thinking [data-part="mouth"]{transform:scaleX(.7)}
.char.is-thinking [data-part="pupil-left"],
.char.is-thinking [data-part="pupil-right"]{transform:translate(3.5px,-4px)}
.char.is-thinking [data-part="arm-right"]{transform:rotate(-16deg)}

/* --- wave: Arm hebt sich, winkt mehrfach, Körper lehnt mit -------------- */
@keyframes ch-wavearm{
 0%  {transform:rotate(0)}
 18% {transform:rotate(-27deg)}
 36% {transform:rotate(-9deg)}
 54% {transform:rotate(-27deg)}
 72% {transform:rotate(-11deg)}
 88% {transform:rotate(-22deg)}
 100%{transform:rotate(0)}}
@keyframes ch-lean{0%,100%{rotate:0deg}30%,70%{rotate:2.6deg}}
.char.is-wave [data-part="arm-right"]{animation:ch-wavearm 1.7s var(--e-soft)}
.char.is-wave [data-part="root"]{animation:ch-lean 1.7s var(--e-soft),
                                           ch-breathe 3.1s ease-in-out infinite}

/* --- talking: Kopf bewegt sich, Hand gestikuliert, Mund betont ---------- */
@keyframes ch-talkbob{0%,100%{translate:0 0;rotate:0deg}
 26%{translate:0 -2.5px;rotate:-1.2deg}62%{translate:0 -1px;rotate:1.4deg}}
@keyframes ch-talkmouth{0%,100%{transform:scaleY(.72)}50%{transform:scaleY(1.14)}}
@keyframes ch-gesture{0%,100%{transform:rotate(0)}32%{transform:rotate(-8deg)}66%{transform:rotate(5deg)}}
.char.is-talking [data-part="root"]{animation:ch-talkbob 2.3s ease-in-out infinite}
.char.is-talking [data-part="mouth"]{animation:ch-talkmouth .42s ease-in-out infinite}
.char.is-talking [data-part="arm-right"]{animation:ch-gesture 1.9s ease-in-out infinite}

/* Einsatzorte */
.greet{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.greet .greettxt{flex:1;min-width:0}
.greet h1{font-size:1.22rem;margin-bottom:2px}
.sesshead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.sesshead h2{flex:1;min-width:0;margin-bottom:0}
.charrow{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}
.charrow .charrowtxt{flex:1;min-width:0}
.stepshead{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.stepshead b{color:var(--ink-2);font-size:var(--t-sm)}

/* ==========================================================================
   LEKTIONS-PFAD
   Fünf Stationen auf einer Kurve. Farbe = Rolle: Plus grün, Null blau,
   Minus amber. Animiert wird nur transform, opacity und stroke-dashoffset.
   ========================================================================== */
.lp{margin:var(--s3) 0 var(--s4)}
.lp-svg{display:block;width:100%;height:auto;overflow:visible}
.lp-track{fill:none;stroke:var(--surface-3);stroke-width:7;stroke-linecap:round}
.lp-fill{fill:none;stroke:url(#lpgrad);stroke:var(--brand);stroke-width:7;stroke-linecap:round;
 stroke-dasharray:100;transition:stroke-dashoffset .7s var(--ease)}

.lp-node .lp-disc{fill:var(--surface-2);stroke:var(--line);stroke-width:3}
.lp-node .lp-glyph path,.lp-node .lp-glyph circle{fill:none;stroke:var(--ink-3);
 stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.lp-node .lp-pulse{fill:none;stroke:none}
.lp-node.is-locked{opacity:.55}
.lp-lockbody{fill:var(--ink-3);stroke:none}

/* erledigt */
.lp-node.is-done .lp-disc{fill:var(--nc,var(--brand));stroke:var(--nc,var(--brand))}
.lp-node.is-done .lp-glyph path,.lp-node.is-done .lp-glyph circle{stroke:var(--bg)}
/* aktiv – gefüllt plus pulsierender Ring */
.lp-node.is-active .lp-disc{fill:var(--nc,var(--brand));stroke:var(--nc,var(--brand))}
.lp-node.is-active .lp-glyph path,.lp-node.is-active .lp-glyph circle{stroke:var(--bg)}
.lp-node.is-active .lp-pulse{stroke:var(--nc,var(--brand));stroke-width:3}
/* Rollenfarben */
.lp-start{--nc:#2EBE86}
.lp-practice{--nc:#2FA8DF}
.lp-boss{--nc:#F2A03C}

/* Puls je Station unterschiedlich stark */
@keyframes lp-pulse{0%{transform:scale(.86);opacity:.85}100%{transform:scale(1.28);opacity:0}}
.lp-node.is-active .lp-pulse{transform-box:fill-box;transform-origin:center;
 animation:lp-pulse 2.4s ease-out infinite}
.lp-practice.is-active .lp-pulse{animation-duration:2s}
.lp-boss.is-active .lp-pulse{animation-duration:1.5s;stroke-width:4}
/* Freischaltung der Prüfung: einmaliger Funke */
@keyframes lp-spark{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.9);opacity:0}}
.lp-boss.is-active .lp-disc{animation:lp-spark .9s ease-out}

/* Fortschritts-Orb */
.lp-orb{transition:transform .8s var(--e-soft)}
.lp-orb-glow{fill:var(--accent);opacity:.28}
.lp-orb-core{fill:var(--accent)}
@keyframes lp-orbpulse{50%{transform:scale(1.3)}}
.lp-orb-glow{transform-box:fill-box;transform-origin:center;animation:lp-orbpulse 1.8s ease-in-out infinite}

.lp-legend{margin-top:var(--s2);font-size:var(--t-sm);color:var(--ink-2);text-align:center;line-height:1.5}
.lp-legend b{color:var(--ink)}

/* Sterne */
.lp-stars{display:inline-flex;gap:5px}
.lp-stars .lp-star{color:var(--line-2);display:inline-flex}
.lp-stars .lp-star .ico{width:22px;height:22px}
.lp-stars .lp-star.on{color:var(--accent);filter:drop-shadow(0 0 6px rgba(255,194,51,.5))}
@keyframes lp-starpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.lp-stars .lp-star.on{animation:lp-starpop .45s var(--e-pop) both}
.lp-stars .lp-star.on:nth-child(2){animation-delay:.08s}
.lp-stars .lp-star.on:nth-child(3){animation-delay:.16s}

/* Schwierigkeits-Anzeige */
.lp-diff{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);
 padding:var(--s3);margin-top:var(--s3)}
.lp-difftop{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
 flex-wrap:wrap;font-size:var(--t-sm);margin-bottom:var(--s2)}
.lp-difftop span{color:var(--ink-3);font-size:var(--t-xs);font-weight:700}
.lp-bars{display:flex;gap:3px;height:24px}
.lp-bar{display:flex;align-items:center;justify-content:center;border-radius:6px;
 font-size:.66rem;font-weight:800;white-space:nowrap;overflow:hidden;color:var(--bg)}
.lp-bar.lvl1{background:var(--ok)}
.lp-bar.lvl2{background:var(--accent)}
.lp-bar.lvl3{background:var(--brand-2)}

/* Nächste Lektion */
.lp-next{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);
 padding:var(--s3);border-radius:var(--r2);background:var(--surface-2);
 border:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-2)}
.lp-next .ico{color:var(--ink-3);flex:none}
.lp-next.open{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.lp-next.open .ico{color:var(--ok)}

/* ==========================================================================
   MELDUNGEN
   ========================================================================== */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--s4));z-index:120;
 display:flex;flex-direction:column;align-items:center;gap:var(--s2);pointer-events:none;padding:0 var(--s4)}
body.intask #toasts{bottom:calc(var(--dockh) + var(--s3))}
.toast{background:var(--surface-3);color:var(--ink);padding:11px 18px;border-radius:var(--r2);
 font-weight:700;font-size:.94rem;box-shadow:var(--sh3);max-width:100%;text-align:center;
 border:1px solid var(--line-2);opacity:0;transform:translateY(14px);
 transition:opacity .25s var(--ease),transform .25s var(--ease)}
.toast.on{opacity:1;transform:none}
.savechip{position:fixed;top:calc(var(--hdrh) + 8px);right:var(--s4);z-index:118;
 display:flex;align-items:center;gap:5px;background:var(--surface-3);border:1px solid var(--ok);
 color:var(--ok);border-radius:var(--rp);padding:5px 13px;font-size:var(--t-xs);font-weight:800;
 opacity:0;transform:translateY(-8px);pointer-events:none;
 /* nicht "all" – sonst wird auch top animiert, sobald sich --hdrh ändert */
 transition:opacity var(--t-base) var(--e-out),transform var(--t-base) var(--e-out)}
.savechip.on{opacity:1;transform:none}
.savebox{display:flex;align-items:center;gap:var(--s3);background:var(--ok-soft);
 border:1px solid var(--ok);border-radius:var(--r2);padding:var(--s3) var(--s4);margin:var(--s2) 0}
.savedot{width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--ok);color:var(--ok-ink);
 display:flex;align-items:center;justify-content:center}
.filebtn input{display:none}

/* ==========================================================================
   MENTOR & BOSS
   ========================================================================== */
.mentorarena{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r3);
 padding:var(--s4);margin:var(--s3) 0 var(--s4);display:flex;gap:var(--s3);align-items:flex-start}
.mentorfig{font-size:2.7rem;display:inline-block;line-height:1.1}
.mentorfig.happy{animation:mhappy .7s var(--ease)}
.mentorfig.think{animation:mthink .7s var(--ease)}
@keyframes mhappy{0%,100%{transform:scale(1)}40%{transform:translateY(-12px) scale(1.16) rotate(7deg)}70%{transform:none}}
@keyframes mthink{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}60%{transform:rotate(9deg)}}
.mname{font-weight:800;font-size:var(--t-xs);margin-top:var(--s1);color:var(--ink-3)}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);color:var(--ink);
 border-radius:var(--r2);padding:11px 14px;font-weight:600;font-size:.97rem;line-height:1.5}
.bubble::before{content:'';position:absolute;left:-8px;top:16px;border:7px solid transparent;
 border-right-color:var(--line)}
.tafel{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2);
 border-radius:var(--r3);padding:var(--s4) var(--s5);margin:var(--s3) 0;font-size:1.08rem;line-height:2.05}

@keyframes tlin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bossarena{background:linear-gradient(140deg,rgba(144,97,249,.18),rgba(255,92,122,.14));
 border:1px solid var(--line);border-radius:var(--r3);padding:var(--s4);margin:var(--s3) 0 var(--s4);
 display:flex;gap:var(--s3);align-items:center}

@keyframes bosshit{0%{transform:none}20%{transform:translateX(-9px) rotate(-8deg);filter:brightness(1.7)}
 40%{transform:translateX(8px) rotate(6deg)}70%{transform:translateX(-4px)}100%{transform:none}}
@keyframes bossmock{0%,100%{transform:scale(1)}30%{transform:scale(1.24) rotate(-6deg)}60%{transform:scale(1.12) rotate(6deg)}}
@keyframes bossdead{0%{transform:none;opacity:1}100%{transform:rotate(180deg) translateY(40px);opacity:.12}}
.bossname{font-weight:800;font-size:var(--t-xs);margin-top:var(--s1);color:var(--ink-2)}
.bossmeta{font-size:var(--t-xs);color:var(--ink-2)}
.bosshp{height:10px;background:rgba(255,255,255,.14);border-radius:var(--rp);overflow:hidden;margin-top:var(--s1)}
.bosshp>div{height:100%;background:linear-gradient(90deg,var(--bad),var(--warn));
 border-radius:var(--rp);transition:width .45s var(--ease)}

/* ==========================================================================
   MINISPIELE
   ========================================================================== */
.gslots{min-height:52px;background:var(--brand-soft);border:1.5px dashed var(--brand-line);
 border-radius:var(--r2);padding:10px 12px;margin:var(--s3) 0;display:flex;flex-wrap:wrap;
 gap:var(--s2);align-items:center}
.ghint{color:var(--ink-3);font-size:var(--t-sm)}
.slotchip{background:var(--brand);color:var(--brand-ink);border-radius:var(--r1);padding:5px 12px;
 font-weight:800;animation:pop .22s var(--ease)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.steprow{display:block;width:100%;text-align:left;background:var(--surface-2);border-radius:var(--r2);
 padding:13px 16px;margin:var(--s2) 0;font-size:1.01rem;position:relative;font-weight:600;
 box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);transition:box-shadow var(--dur),transform var(--dur)}
.steprow:active{transform:translateY(2px)}

.steprow.sel::before{content:attr(data-pos);position:absolute;left:12px;top:50%;transform:translateY(-50%);
 background:var(--brand);color:var(--brand-ink);width:24px;height:24px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--t-xs)}
.chip-tap{background:var(--surface-2);border-radius:var(--r1);padding:10px 16px;margin:5px;
 font-size:1.08rem;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);
 transition:transform var(--dur),box-shadow var(--dur)}
.chip-tap:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip-tap.sel{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 0 var(--brand-d)}
.chip-tap.used{transform:scale(.9)}
.errline{display:block;width:100%;text-align:left;background:var(--surface-2);border-radius:var(--r2);
 padding:13px 16px;margin:var(--s2) 0;font-size:1.03rem;font-weight:600;
 box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.errline .lnum{display:inline-block;min-width:64px;color:var(--ink-3);font-size:var(--t-xs);font-weight:800}
.errline.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.errline.miss{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.waage{display:flex;align-items:center;justify-content:center;gap:var(--s3);background:var(--surface-2);
 border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5) var(--s3);margin:var(--s3) 0}
.waage.tilt{animation:tilt .45s var(--ease)}
@keyframes tilt{0%,100%{transform:none}30%{transform:rotate(-2deg)}65%{transform:rotate(1.4deg)}}
.wside{background:var(--surface);border:1.5px solid var(--brand);border-radius:var(--r2);

.weq{font-size:1.5rem;font-weight:800;color:var(--ink-3)}
.wmoves{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center;margin-top:var(--s2)}
.gbtn{background:var(--surface-2);color:var(--ink);border-radius:var(--r1);padding:11px 18px;
 font-weight:800;font-size:1.02rem;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);
 transition:transform var(--dur),box-shadow var(--dur)}
.gbtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line)}
.gbtn.big{font-size:1.08rem;padding:14px 26px}
.gbtn.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok),0 2px 0 var(--ok-d)}
.gbtn.no{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad),0 2px 0 var(--bad-d)}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:var(--s3) 0}
.memc{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:transparent;
 border-radius:var(--r2);padding:18px 6px;font-size:1rem;font-weight:800;min-height:64px;position:relative;
 box-shadow:0 3px 0 var(--brand-d);transition:transform var(--dur)}
.memc::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:1.5rem;color:#fff}
.memc.open,.memc.found{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--brand)}
.memc.open::after,.memc.found::after{content:''}
.memc.found{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.memc.wrong{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.wfbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r3);
 padding:var(--s5) var(--s4);margin:var(--s3) 0;font-size:1.3rem;text-align:center;font-weight:800}
input[type=range]{width:190px;padding:0;border:none;accent-color:var(--brand);background:transparent}

/* ==========================================================================
   BELOHNUNGEN & FEIER
   ========================================================================== */
.cheer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cheer span{position:absolute;top:-40px;font-size:1.7rem;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(340deg);opacity:.2}}
.floatxp{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-size:1.7rem;font-weight:800;
 color:var(--accent);z-index:115;pointer-events:none;animation:fxp 1.2s var(--ease) forwards;
 text-shadow:0 2px 14px rgba(0,0,0,.7)}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,8px) scale(.75)}
 20%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}
 100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
.combochip{display:inline-flex;align-items:center;gap:4px;background:var(--warn);color:var(--warn-ink);
 border-radius:var(--rp);padding:2px 10px;font-size:var(--t-xs);margin-left:6px;font-weight:800;
 animation:pop .28s var(--ease)}
@keyframes overfade{from{opacity:0}to{opacity:1}}
.lvlover{position:fixed;inset:0;background:rgba(8,10,20,.88);z-index:130;display:flex;
 align-items:center;justify-content:center;animation:overfade var(--t-base) var(--e-out);padding:var(--s4)}
.lvlcard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r4);
 padding:var(--s6) var(--s6);text-align:center;animation:lvlpop .5s var(--e-pop);
 box-shadow:var(--sh3)}
/* Dialoge federn herein statt zu erscheinen */
@keyframes lvlpop{0%{transform:scale(.82) translateY(16px);opacity:0}
 60%{transform:scale(1.02) translateY(0);opacity:1}100%{transform:none;opacity:1}}
.lvlnum{width:84px;height:84px;margin:0 auto var(--s3);border-radius:50%;
 background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#fff;font-size:2.2rem;
 font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--brand-d)}
.chestbtn{--btn-bg:linear-gradient(120deg,var(--accent),var(--warn));--btn-ink:var(--accent-ink);
 --btn-edge:var(--accent-d)}
.chestwrap{padding:var(--s5) 0;cursor:pointer}

/* ==========================================================================
   TRUHEN
   Eine Form, vier Stufen. Die Stufe setzt nur Farben (Klasse) und vier
   Bewegungswerte (--glow/--idle/--hover/--bounce, aus der JS-Konfiguration).
   Animiert wird ausschließlich transform und opacity.
   ========================================================================== */
.chest{display:inline-block;position:relative;line-height:0;
 --c-light:#E8A166;--c-dark:#A15C33;--c-gem:#FFE0B2;
 --glow:.2;--idle:.3;--hover:1.02;--bounce:1}
.chest--silver{--c-light:#DFE5F0;--c-dark:#8792AB;--c-gem:#FFFFFF}
.chest--gold  {--c-light:#FFD44A;--c-dark:#D89310;--c-gem:#FFF4B8}
.chest--purple{--c-light:#C4A2FF;--c-dark:#7444D4;--c-gem:#EEDCFF}
.chest--sm{width:56px}
.chest--md{width:104px}
.chest--lg{width:170px}
.chestsvg{display:block;width:100%;height:auto;overflow:visible}
.ch-fill-l{fill:var(--c-light)}
.ch-fill-d{fill:var(--c-dark)}
.ch-gem-o{fill:var(--c-light)}
.ch-gem-i{fill:var(--c-gem)}
.ch-shadow{fill:#000;opacity:.3}
.ch-glow{fill:var(--c-light);opacity:0;filter:blur(16px);transition:opacity .3s var(--ease)}
.ch-ring{fill:none;stroke:var(--c-gem);stroke-width:3;opacity:0}
.chest [class^="ch-"]{transform-box:view-box}
.ch-rig{transition:transform .25s var(--ease)}
.ch-lid{transform-origin:28px 66px;transition:transform .45s var(--e-pop)}
.ch-gem-o,.ch-gem-i{transform-origin:80px 62px}

/* -- idle: leichtes Schweben, Stärke aus --idle -- */
@keyframes ch-float{50%{transform:translateY(calc(var(--idle) * -5px))}}
.chest.is-idle .ch-rig{animation:ch-float calc(3.8s - var(--idle) * 1.2s) ease-in-out infinite}
.chest.is-idle .ch-glow{opacity:calc(var(--glow) * .5)}

/* -- hover: minimale Skalierung + Glow -- */
.chest.is-hover .ch-rig{transform:scale(var(--hover))}
.chest.is-hover .ch-glow{opacity:var(--glow)}

/* -- opening / open: Deckel klappt auf, Korpus bleibt stehen -- */
@keyframes ch-pop{40%{transform:scale(var(--bounce)) translateY(-4px)}}
.chest.is-opening .ch-lid,
.chest.is-open .ch-lid,
.chest.is-reward .ch-lid{transform:rotate(-27deg) translateY(-3px)}
.chest.is-opening .ch-rig{animation:ch-pop .5s var(--e-pop)}
.chest.is-opening .ch-glow,.chest.is-open .ch-glow{opacity:var(--glow)}

/* -- reward: Glow hoch, Emblem blitzt -- */
@keyframes ch-gemflash{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
.chest.is-reward .ch-glow{opacity:calc(var(--glow) * 1.25)}
.chest.is-reward .ch-gem-o,
.chest.is-reward .ch-gem-i{animation:ch-gemflash .6s var(--ease)}
/* nur die höchste Stufe bekommt den Ring – sichtbar exklusiv */
@keyframes ch-ringpulse{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.25)}}
.chest--purple.is-reward .ch-ring{transform-origin:80px 88px;animation:ch-ringpulse .85s ease-out}

/* -- Partikel: Anzahl kommt aus der Konfiguration, Richtung per --dx/--dy -- */
.ch-parts{position:absolute;inset:0;pointer-events:none}
.ch-parts i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;
 background:var(--c-gem);opacity:0;animation:ch-part .95s ease-out forwards}
@keyframes ch-part{
 0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}

.upbadge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
 color:var(--accent);border:1px solid var(--accent);border-radius:var(--rp);
 padding:4px 13px;font-size:var(--t-xs);font-weight:800;margin-bottom:var(--s2)}
.rewcard{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r3);
 padding:var(--s4);margin:var(--s4) 0;font-size:1.1rem;font-weight:800;
 animation:lvlpop .45s var(--e-pop)}
.setrow{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s3)}
.sw{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);font-weight:700;
 color:var(--ink-2);cursor:pointer}
.sw input{width:19px;height:19px;accent-color:var(--brand)}
.stickwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:var(--s2);margin-top:var(--s3)}
.stick{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r2);
 padding:var(--s3) 6px;text-align:center}
.stick span{font-size:1.8rem;display:block;line-height:1.2}
.stick small{font-size:var(--t-xs);color:var(--ink-2);display:block;margin-top:3px;line-height:1.25;font-weight:700}
.stick.locked{background:var(--surface-2);border-color:var(--line);opacity:.5}
.ringwrap{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}

/* ==========================================================================
   SERIEN-SEITE
   ========================================================================== */
.flamezone{position:relative;text-align:center;padding:var(--s6) 0 var(--s2)}
.flameglow{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:150px;height:150px;
 border-radius:50%;background:radial-gradient(circle,rgba(255,165,61,.42),transparent 68%);pointer-events:none}
.flamebig{position:relative;font-size:4.8rem;display:inline-block;
 filter:drop-shadow(0 8px 20px rgba(255,120,0,.5))}
.strknum{font-size:3.3rem;font-weight:800;color:var(--warn);line-height:1.05;
 animation:drop .55s var(--e-pop);font-variant-numeric:tabular-nums}
@keyframes drop{from{transform:translateY(-40px) scale(.5);opacity:0}}
.strksub{color:var(--warn);font-weight:800;font-size:1.15rem}
.cal{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s4)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3)}
.calnav b{font-size:1.08rem}
.calnav button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
 border-radius:var(--rp);color:var(--ink-2);background:var(--surface-2)}
.calnav button:disabled{opacity:.3}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.calgrid .hd{text-align:center;font-size:.7rem;color:var(--ink-3);font-weight:800;padding-bottom:var(--s1)}
.cd{height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;
 color:var(--ink-3);font-size:.9rem}
.cd.p{background:linear-gradient(180deg,var(--warn),var(--bad));color:#fff}
.cd.rs{border-radius:var(--rp) 0 0 var(--rp)}
.cd.re{border-radius:0 var(--rp) var(--rp) 0}
.cd.rs.re{border-radius:var(--rp)}
.cd.td{box-shadow:inset 0 0 0 2px var(--accent);border-radius:var(--rp)}
.perfbadge{background:var(--accent);color:var(--accent-ink);border-radius:var(--r1);padding:3px 12px;
 font-weight:800;font-size:var(--t-xs);display:inline-block}
.strkstat{display:flex;gap:var(--s2);margin:var(--s3) 0}
.strkstat>div{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);
 padding:var(--s3);text-align:center}
.strkstat b{font-size:1.25rem;color:var(--warn);display:flex;align-items:center;justify-content:center;gap:5px}
.strkstat small{display:block;color:var(--ink-3);font-weight:700;font-size:var(--t-xs)}

table.wt{border-collapse:collapse;margin:var(--s2) 0}
table.wt td,table.wt th{border:1px solid var(--line);padding:5px 12px;text-align:center}

/* ==========================================================================
   ANIMATIONS-AKZENTE  –  sparsam, nur wo sie Rückmeldung geben
   ========================================================================== */
.tin{animation:tslide .26s var(--ease)}
@keyframes tslide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
/* Puls der aktuellen Station als eigener Ring – box-shadow zu animieren
   kostet bei jedem Frame einen Repaint, transform/opacity nicht. */
.node.cur::after{content:'';position:absolute;inset:-5px;border-radius:50%;
 border:3px solid var(--brand);pointer-events:none;
 animation:node-ring 2.4s var(--e-out) infinite}
@keyframes node-ring{0%{transform:scale(.92);opacity:.65}100%{transform:scale(1.34);opacity:0}}
.mcopt.ok,.chip-tap.sel,.errline.ok,.memc.found{animation:okpop .32s var(--ease)}
@keyframes okpop{40%{transform:scale(1.035)}}
.mcopt.bad,.errline.miss{animation:badshake .42s var(--ease)}
@keyframes badshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.bigemoji{animation:drop .55s var(--e-pop)}
.statrow .statbox{animation:viewin .35s var(--ease) both}
.statrow .statbox:nth-child(2){animation-delay:.05s}
.statrow .statbox:nth-child(3){animation-delay:.1s}
.statrow .statbox:nth-child(4){animation-delay:.15s}
.statrow .statbox:nth-child(5){animation-delay:.2s}
.statrow .statbox:nth-child(6){animation-delay:.25s}
.quest{animation:viewin .3s var(--ease) both}

@media(max-width:560px){
 :root{--s5:18px;--s6:24px}
 .fieldrow input{width:140px}
 .q{font-size:1.1rem}
 .memgrid{grid-template-columns:repeat(2,1fr)}
 input[type=range]{width:150px}
 .card{padding:var(--s4)}
 .node{width:64px;height:64px}
 .micon.node{width:32px;height:32px}
 .brand span{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<script>
/* ============ Hilfsfunktionen ============ */
const $=s=>document.querySelector(s);
/* Ein einziger Icon-Stil für die ganze Oberfläche (Strich-Icons aus dem Sprite). */
function ico(n,cls){return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,Math.abs(a%b)):Math.abs(a);
function fmt(x){let r=Math.round(x*1000)/1000;return (''+r).replace('.',',');}
function frac(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}
function wz(x){return '√<span class="ol">'+x+'</span>';}
function sgn(n){return n<0?'− '+Math.abs(n):'+ '+n;}
function co(c,v){if(c===0)return'';return (c===1?'':(c===-1?'-':c))+v;}
function linStr(a,b,v){v=v||'x';let p=[];
 if(a!==0)p.push(co(a,v));
 if(b!==0)p.push((b>0&&p.length?'+':'')+b);
 return p.length?p.join(''):'0';}
function linAcc(a,b,v){v=v||'x';const s1=linStr(a,b,v);let p=[];
 if(b!==0)p.push(''+b);
 if(a!==0)p.push((a>0&&p.length?'+':'')+co(a,v));
 const s2=p.length?p.join(''):'0';
 return s1===s2?[s1]:[s1,s2];}
function normTxt(s){return (''+s).toLowerCase()
 .replace(/\s+/g,'').replace(/\*/g,'').replace(/·/g,'').replace(/−/g,'-')
 .replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
 .replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/^f\(x\)=/,'y=').replace(/\(\+/g,'(')
 .replace(/wurzel/g,'√');}
function parseNum(s){s=(''+s).trim().toLowerCase().replace(/\s+/g,'').replace(',', '.').replace('−','-').replace(/^=+/,'').replace(/(grad|cm|mm|km|kg|std|min|jahre|jahr|tage|h|g|m|%|€|°|\u20ac)+$/,'');
 const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
 if(m)return parseFloat(m[1])/parseFloat(m[2]);
 if(!/^-?\d+(\.\d+)?$/.test(s))return null;
 return parseFloat(s);}
function redFrac(n,d){const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d;}return [n,d];}
function fracTxt(n,d){const r=redFrac(n,d);return r[1]===1?(''+r[0]):r[0]+'/'+r[1];}
function ineqAcc(v,sign){const flip={'<':'>','>':'<','<=':'>=','>=':'<='};
 return ['x'+sign+v, v+flip[sign]+'x'];}
const disp={'<':'&lt;','>':'&gt;','<=':'≤','>=':'≥'};

/* ============ Koordinatensystem (SVG) ============ */
function graphSVG(items,opts){
 opts=opts||{};const R=5,W=240,u=W/(2*R);
 const X=x=>W/2+x*u, Y=y=>W/2-y*u;
 let g='';
 for(let i=-R;i<=R;i++){
  g+='<line x1="'+X(i)+'" y1="0" x2="'+X(i)+'" y2="'+W+'" stroke="#242a4d" stroke-width="1"/>';
  g+='<line x1="0" y1="'+Y(i)+'" x2="'+W+'" y2="'+Y(i)+'" stroke="#242a4d" stroke-width="1"/>';
 }
 g+='<line x1="0" y1="'+Y(0)+'" x2="'+W+'" y2="'+Y(0)+'" stroke="#5a628f" stroke-width="1.6"/>';
 g+='<line x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+W+'" stroke="#5a628f" stroke-width="1.6"/>';
 g+='<polygon points="'+W+','+Y(0)+' '+(W-8)+','+(Y(0)-4)+' '+(W-8)+','+(Y(0)+4)+'" fill="#5a628f"/>';
 g+='<polygon points="'+X(0)+',0 '+(X(0)-4)+',8 '+(X(0)+4)+',8" fill="#5a628f"/>';
 g+='<text x="'+(W-10)+'" y="'+(Y(0)+14)+'" font-size="10" fill="#8b93bd">x</text>';
 g+='<text x="'+(X(0)+6)+'" y="10" font-size="10" fill="#8b93bd">y</text>';
 [-4,-2,2,4].forEach(i=>{
  g+='<text x="'+(X(i)-3)+'" y="'+(Y(0)+13)+'" font-size="9" fill="#8b93bd">'+i+'</text>';
  g+='<text x="'+(X(0)+4)+'" y="'+(Y(i)+3)+'" font-size="9" fill="#8b93bd">'+i+'</text>';
 });
 (items||[]).forEach(it=>{
  const col=it.col||'#6b6cf6';
  if(it.f){
   let seg=[];const segs=[];
   for(let x=-R;x<=R+0.001;x+=0.05){
    const y=it.f(x);
    if(isFinite(y)&&y>=-R-0.6&&y<=R+0.6)seg.push(X(x).toFixed(1)+','+Y(y).toFixed(1));
    else{if(seg.length>1)segs.push(seg);seg=[];}
   }
   if(seg.length>1)segs.push(seg);
   segs.forEach(s=>{g+='<polyline points="'+s.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.6"/>';});
  }
  if(it.dot){g+='<circle cx="'+X(it.dot[0])+'" cy="'+Y(it.dot[1])+'" r="4.5" fill="'+(it.col||'#ffc233')+'" stroke="#11142a" stroke-width="1.8"/>';}
 });
 return '<div style="text-align:center;margin:12px 0"><svg width="'+W+'" height="'+W+'" viewBox="0 0 '+W+' '+W+'" style="max-width:100%;background:#11142a;border:1px solid var(--line);border-radius:14px">'+g+'</svg></div>';
}

/* ============ Zustand ============ */
const GOAL=100;
const IVL=[1,3,7,14,30];
let state={xp:0,streak:0,lastDay:null,journal:[],mods:{},sessions:0,errors:[],
 dayXP:{d:'',xp:0},jokers:2,jokerWeek:'',goalDone:'',badges:[],blitzBest:0,blitzRuns:0,
 snd:true,vib:true,chests:[],stickers:[],boost:0,quests:null,miles:[],bestCombo:0,chestPity:0};
/* Speichern wird gebündelt: pro Antwort rufen mehrere Stellen save() auf –
   geschrieben wird aber nur einmal, kurz danach. saveNow() erzwingt sofortiges Schreiben. */
function save(){
 state.savedAt=Date.now();
 _dirty=true;
 if(_saveT)clearTimeout(_saveT);
 _saveT=setTimeout(()=>{
  _saveT=null;
  try{localStorage.setItem('mbtState',JSON.stringify(state));}catch(e){}
  if(typeof idbPut==='function')idbPut(state);
  _dirty=false;
 },400);
}
function load(){try{const s=localStorage.getItem('mbtState');if(s){const p=JSON.parse(s);
 state=Object.assign(state,p);
 if(!state.dayXP)state.dayXP={d:'',xp:0};
 if(state.jokers==null)state.jokers=2;
 if(!state.badges)state.badges=[];
 if(!state.blitzBest)state.blitzBest=0;if(!state.blitzRuns)state.blitzRuns=0;
 if(state.snd==null)state.snd=true;if(state.vib==null)state.vib=true;
 if(!state.chests)state.chests=[];if(!state.stickers)state.stickers=[];
 if(!state.boost)state.boost=0;if(!state.miles)state.miles=[];
 if(!state.bestCombo)state.bestCombo=0;
 if(!state.days)state.days=[];
 if(state.lastDay&&state.days.indexOf(state.lastDay)<0)state.days.push(state.lastDay);
}}catch(e){}}
function st(id){if(!state.mods[id])state.mods[id]={c:0,t:0,a:0,seen:false,boss:0,stage:-1,due:'',hist:[],lvl:1};
 const s=state.mods[id];
 if(s.boss==null)s.boss=0;if(s.stage==null)s.stage=-1;if(s.due==null)s.due='';
 if(!s.hist)s.hist=[];if(!s.lvl)s.lvl=1;
 return s;}
/* Verlauf: 1 = richtig, 0 = falsch (nur die letzten 12 zählen) */
function noteResult(id,lvl,ok){
 const s=st(id);
 s.hist.push(ok?1:0);if(s.hist.length>12)s.hist.shift();
 if(s.hist.length>=5){
  const q=s.hist.reduce((a,b)=>a+b,0)/s.hist.length;
  if(q>=0.85&&s.lvl<3){s.lvl++;s.hist=[];}
  else if(q<0.6&&s.lvl>1){s.lvl--;s.hist=[];}
 }
 save();}
function stars(s){return s.boss||0;}
function starStr(n){let s='';for(let i=0;i<3;i++)s+=ico('star',i<n?'':'off');return s;}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function addDays(n){return dstr(new Date(Date.now()+n*864e5));}
function weekKey(){const d=new Date();const off=(d.getDay()+6)%7;return dstr(new Date(Date.now()-off*864e5));}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

function touchDay(){
 const wk=weekKey();
 if(state.jokerWeek!==wk){state.jokerWeek=wk;state.jokers=2;}
 const today=dstr();
 if(!state.days)state.days=[];
 if(state.days.indexOf(today)<0){state.days.push(today);if(state.days.length>750)state.days.shift();save();}
 if(state.lastDay===today)return;
 if(state.lastDay==null){state.streak=1;}
 else{const diff=dayDiff(state.lastDay,today);
  if(diff===1)state.streak++;
  else if(diff===2&&state.jokers>0){state.jokers--;state.streak++;toast(ico('shield','sm')+' Joker eingesetzt – deine Serie lebt weiter ('+state.jokers+' übrig).');}
  else state.streak=1;}
 state.lastDay=today;}

function lvlOf(xp){return Math.floor(xp/150)+1;}
const TITLES=['Zahlen-Neuling','Rechen-Lehrling','Klammer-Knacker','Term-Bändiger','Gleichungs-Profi','Wurzel-Wächter','Funktionen-Kenner','Kurven-Künstler','Grenzwert-Jäger','Analysis-Pionier','Vektor-Kapitän','Mathe-Meister','Mathe-Legende'];
function titleOf(l){return TITLES[Math.min(l-1,TITLES.length-1)];}

function bumpDay(){const t=dstr();if(state.dayXP.d!==t)state.dayXP={d:t,xp:0};}
function addXP(n,noBoost){
 const before=lvlOf(state.xp);
 if(!noBoost&&state.boost>0){n*=2;state.boost--;}
 state.xp+=n;bumpDay();state.dayXP.xp+=n;touchDay();
 if(state.dayXP.xp>=GOAL&&state.goalDone!==dstr()){
  state.goalDone=dstr();cheer();
  if(typeof sfx!=='undefined')sfx.finish();
  toast(ico('target','sm')+' Tagesziel erreicht. Alles ab jetzt ist Bonus.');
  if(typeof addChest==='function')addChest('gold','Tagesziel erreicht');
  if(typeof questProg==='function')questProg('goal',1);
 }
 if(typeof checkMiles==='function')checkMiles();
 checkBadges();save();updHeader();
 const after=lvlOf(state.xp);
 if(after>before&&typeof levelUp==='function')levelUp(after);
}
/* Kopfzeile: nur die Zahl im Chip – der volle Titel steht im Profil.
   So bleibt die Zeile auf jedem Handy einzeilig. */
function setStat(id,txt){const el=$(id);if(!el)return;const s=el.querySelector('span');
 if(s)s.textContent=txt;else el.textContent=txt;}
function updHeader(){
 setStat('#hStreak',state.streak);
 setStat('#hJoker',state.jokers);
 const l=lvlOf(state.xp);
 setStat('#hLvl','Lv. '+l);
 $('#hLvl').title=titleOf(l)+' · '+state.xp+' XP';
 $('#hXp').style.width=Math.round((state.xp%150)/150*100)+'%';}
/* Höhe von Kopfzeile und Aktionsleiste messen, damit nichts überlappt
   (früher waren 52 px / 88 px / 210 px fest verdrahtet). */
function syncChrome(){
 const h=document.getElementById('hdr'),d=document.getElementById('dock');
 const rs=document.documentElement.style;
 if(h)rs.setProperty('--hdrh',Math.round(h.offsetHeight)+'px');
 if(d)rs.setProperty('--dockh',Math.round(d.offsetHeight)+'px');
}
function cheer(){const c=document.createElement('div');c.className='cheer';
 const em=['🎉','⭐','🎊','✨','🏆','💪'];let h='';
 for(let i=0;i<22;i++)h+='<span style="left:'+ri(2,96)+'%;animation-delay:'+(Math.random()*0.5)+'s">'+pick(em)+'</span>';
 c.innerHTML=h;document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}
/* Meldungen stapeln sich, statt sich gegenseitig zu überdecken. */
function toast(msg){
 const wrap=document.getElementById('toasts');if(!wrap)return;
 while(wrap.children.length>2)wrap.firstChild.remove();
 const t=document.createElement('div');t.className='toast';t.innerHTML=msg;
 wrap.appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));
 setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),320);},3400);}

/* ============ Wiederholungs-Termine (Spaced Repetition) ============ */
function scheduleStart(id){const s=st(id);if(s.stage<0){s.stage=0;s.due=addDays(1);save();}}
function scheduleAdvance(id){const s=st(id);if(s.stage<0)return;
 s.stage=Math.min(s.stage+1,IVL.length-1);s.due=addDays(IVL[s.stage]);save();}
function dueMods(){const t=dstr();return MODS.filter(m=>{const s=st(m.id);return s.due&&s.due<=t;});}

function fieldOK(f,val){
 if(f.type==='txt'){const n=normTxt(val);return f.acc.some(a=>normTxt(a)===n);}
 const v=parseNum(val);if(v===null)return false;return Math.abs(v-f.a)<0.006;}

function checkTask(){
 if(cur.done)return;
 const t=cur.task;let allOk=true;
 if(t.setAns){
  const vals=t.fields.map((f,i)=>parseNum($('#fin'+i).value));
  if(vals.some(v=>v===null)){allOk=false;}
  else{const want=t.fields.map(f=>f.a).sort((a,b)=>a-b);
   const got=vals.slice().sort((a,b)=>a-b);
   allOk=want.every((w,i)=>Math.abs(w-got[i])<0.006);}
  t.fields.forEach((f,i)=>{const el=$('#fin'+i);if(el)el.classList.add(allOk?'is-ok':'is-bad');});
 }else{
  t.fields.forEach((f,i)=>{const el=$('#fin'+i);const okf=fieldOK(f,el.value);
   el.classList.add(okf?'is-ok':'is-bad');
   if(!okf)allOk=false;});
 }
 finishAttempt(allOk);
}

function finishAttempt(ok){
 const fb=$('#tfb');const t=cur.task;
 if(ok){
  cur.done=true;
  const base={1:10,2:15,3:25}[t.lvl];
  let xp=cur.tries>0?Math.ceil(base/2):base;
  /* Kombo-Bonus */
  let cbonus=0;
  if(sess&&cur.tries===0){
   sess.combo=(sess.combo||0)+1;
   if(sess.combo>state.bestCombo){state.bestCombo=sess.combo;}
   if(sess.combo>=8)cbonus=15;else if(sess.combo>=5)cbonus=10;else if(sess.combo>=3)cbonus=5;
   if(typeof questProg==='function')questProg('combo',sess.combo);
  }
  const boosted=state.boost>0;
  addXP(xp+cbonus);
  if(typeof sfx!=='undefined'){sfx.ok();if(sess&&sess.combo>=3)sfx.combo(sess.combo);}
  const s=st(cur.modId);s.c++;s.a++;if(t.lvl===3)s.t++;
  noteResult(cur.modId,t.lvl,true);
  if(typeof questProg==='function'){questProg('task',1);if(t.lvl===3)questProg('lvl3',1);if(t.game)questProg('game',1);}
  let msg=ico('check')+' '+pick(praise)+' <b>+'+((xp+cbonus)*(boosted?2:1))+' XP</b>';
  if(cbonus)msg+=' <span class="combochip">'+ico('flame','sm')+' Kombo x'+sess.combo+' +'+cbonus+'</span>';
  if(boosted)msg+=' <span class="combochip">'+ico('bolt','sm')+' Boost</span>';
  fb.className='fb ok';fb.innerHTML=msg;
  if(typeof floatXP==='function')floatXP('+'+((xp+cbonus)*(boosted?2:1))+' XP');
  lockTask(true);
  if(typeof charAnswer==='function')charAnswer(true,sess?sess.combo:0);
  if(sess&&sess.type==='boss')bossReact(true);
  if(cur.autoNext){const tk=cur.task;setTimeout(()=>{if(cur.task===tk&&cur.done)nextTask();},700);}
 }else{
  cur.tries++;
  if(typeof sfx!=='undefined')sfx.bad();
  if(sess&&sess.combo>=3)toast(ico('flame','sm')+' Kombo verloren – gleich neu aufbauen!');
  if(sess)sess.combo=0;
  if(cur.tries===1&&!cur.strict){
   /* Erster Fehlversuch: freundlich, ohne Wertung – sofort wieder änderbar. */
   fb.className='fb bad';fb.innerHTML=ico('repeat')+' '+pick(retry);
   const bc=$('#bCheck');if(bc)bc.textContent='Nochmal prüfen';
   syncChrome();
  }else{
   cur.done=true;
   const s=st(cur.modId);s.a++;
   noteResult(cur.modId,t.lvl,false);
   if(sess&&sess.shields!=null){sess.shields--;if(typeof sfx!=='undefined')sfx.shield();}
   state.errors.push({m:cur.modId,lvl:t.lvl});
   if(state.errors.length>40)state.errors.shift();
   save();
   fb.className='fb bad';fb.innerHTML=ico('spark')+' '+pick(wrongMsg);
   revealSteps();
   lockTask(false);
   if(typeof charAnswer==='function')charAnswer(false,0);
   if(sess&&sess.type==='boss')bossReact(false);
  }
 }
}

let _ac=null;
function ac(){
 if(!state.snd)return null;
 try{if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended')_ac.resume();
  return _ac;}catch(e){return null;}
}
function tone(freq,dur,type,vol,delay){
 const c=ac();if(!c)return;
 try{
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t0);o.stop(t0+dur+0.03);
 }catch(e){}
}
function slide(f1,f2,dur,vol){
 const c=ac();if(!c)return;
 try{const t0=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f1,t0);
  o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.03);
 }catch(e){}
}

function countUp(el,to,dur){
 if(!el)return;dur=dur||900;
 const from=0,t0=Date.now();
 (function step(){
  const p=Math.min(1,(Date.now()-t0)/dur);
  const e=1-Math.pow(1-p,3);
  el.textContent=Math.round(from+(to-from)*e);
  if(p<1)requestAnimationFrame(step);else el.textContent=to;
 })();
}

 {id:'tasks25',txt:'25 Aufgaben richtig lösen',goal:25,k:'task'},
 {id:'lvl3',txt:'3 Transfer-Aufgaben (Level 3) schaffen',goal:3,k:'lvl3'},
 {id:'combo5',txt:'Eine Kombo von 5 erreichen',goal:5,k:'combo'},
 {id:'games3',txt:'3 Minispiele gewinnen',goal:3,k:'game'},
 {id:'sess1',txt:'Ein Tagestraining abschließen',goal:1,k:'sess'},
 {id:'rev1',txt:'Eine fällige Wiederholung erledigen',goal:1,k:'rev'},
 {id:'blitz1',txt:'Eine Blitzrunde spielen',goal:1,k:'blitz'},
 {id:'goal',txt:'Das Tagesziel von '+GOAL+' XP erreichen',goal:1,k:'goal'}
];
function ensureQuests(){
 const t=dstr();
 if(state.quests&&state.quests.d===t)return state.quests.list;
 const pool=QUESTPOOL.slice();
 const list=[];
 const seed=parseInt(t.replace(/-/g,''),10);
 for(let i=0;i<3&&pool.length;i++){
  const idx=(seed*(i+7))%pool.length;
  const q=pool.splice(idx,1)[0];
  list.push({id:q.id,txt:q.txt,goal:q.goal,k:q.k,cur:0,done:false});
 }
 state.quests={d:t,list:list};save();
 return list;
}
function questProg(kind,n){
 const list=ensureQuests();let changed=false;
 list.forEach(q=>{
  if(q.done||q.k!==kind)return;
  q.cur=(kind==='combo')?Math.max(q.cur,n):q.cur+(n||1);
  if(q.cur>=q.goal){q.done=true;changed=true;
   sfx.quest();toast(ico('check','sm')+' Ziel geschafft: <b>'+q.txt+'</b>');
   addChest('silver','Tagesziel erfüllt');}
 });
 save();
 if(changed&&$('#questBox'))renderHome();
}
function questHTML(){
 const list=ensureQuests();
 let h='<div class="card" id="questBox"><h2>'+ico('target')+'Tagesaufgaben</h2>';
 list.forEach(q=>{
  const p=Math.min(100,Math.round(q.cur/q.goal*100));
  h+='<div class="quest'+(q.done?' done':'')+'"><div class="qtop"><span>'+(q.done?ico('check','sm')+' ':'')+q.txt+'</span><b>'+Math.min(q.cur,q.goal)+' / '+q.goal+'</b></div>';
  h+='<div class="pbar"><div style="width:'+p+'%"></div></div></div>';
 });
 h+='<p class="hint">Jede erfüllte Aufgabe bringt eine Silbertruhe.</p></div>';
 return h;
}

/* ============ Automatische Speicherung (Doppel-Sicherung) ============ */
let _idb=null,_saveT=null,_lastSave=0,_dirty=false;

/* --- IndexedDB als zweite, robustere Kopie --- */
function idbOpen(){
 return new Promise(res=>{
  if(_idb)return res(_idb);
  try{
   if(typeof indexedDB==='undefined')return res(null);
   const r=indexedDB.open('mbtDB',1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('save'))db.createObjectStore('save');};
   r.onsuccess=()=>{_idb=r.result;res(_idb);};
   r.onerror=()=>res(null);
  }catch(e){res(null);}
 });
}
function idbPut(obj){
 return idbOpen().then(db=>{
  if(!db)return false;
  try{
   const tx=db.transaction('save','readwrite');
   tx.objectStore('save').put(JSON.stringify(obj),'state');
   return true;
  }catch(e){return false;}
 }).catch(()=>false);
}
function idbGet(){
 return idbOpen().then(db=>new Promise(res=>{
  if(!db)return res(null);
  try{
   const rq=db.transaction('save','readonly').objectStore('save').get('state');
   rq.onsuccess=()=>{try{res(rq.result?JSON.parse(rq.result):null);}catch(e){res(null);}};
   rq.onerror=()=>res(null);
  }catch(e){res(null);}
 })).catch(()=>null);
}

/* --- Speicher-Schutz beim Browser anfordern (verhindert automatisches Löschen) --- */
function askPersist(){
 try{
  if(navigator.storage&&navigator.storage.persist){
   navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist();});
  }
 }catch(e){}
}

/* --- Sofortspeicherung an wichtigen Punkten --- */
function saveNow(reason){
 if(_saveT){clearTimeout(_saveT);_saveT=null;}   /* gebündelte Speicherung überholen */
 state.savedAt=Date.now();
 try{localStorage.setItem('mbtState',JSON.stringify(state));}catch(e){}
 idbPut(state);
 _lastSave=Date.now();_dirty=false;
 if(reason==='flash')flashSaved();
}
function flashSaved(){
 const el=document.getElementById('saveDot');
 if(!el)return;
 el.innerHTML=ico('check','sm')+' gespeichert';
 el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
 setTimeout(()=>el.classList.remove('on'),1900);
}
function saveAgo(){
 if(!state.savedAt)return 'noch nicht';
 const s=Math.floor((Date.now()-state.savedAt)/1000);
 if(s<10)return 'gerade eben';
 if(s<60)return 'vor '+s+' Sekunden';
 if(s<3600)return 'vor '+Math.floor(s/60)+' Minuten';
 if(s<86400)return 'vor '+Math.floor(s/3600)+' Stunden';
 return 'vor '+Math.floor(s/86400)+' Tagen';
}

/* --- Wiederherstellung beim Start: nimmt immer den weiter fortgeschrittenen Stand --- */
function restoreBest(){
 return idbGet().then(bak=>{
  if(!bak)return false;
  const cur=state;
  const better=(bak.xp||0)>(cur.xp||0)||((bak.savedAt||0)>(cur.savedAt||0)&&(bak.xp||0)>=(cur.xp||0));
  if(better){
   state=Object.assign(state,bak);
   try{localStorage.setItem('mbtState',JSON.stringify(state));}catch(e){}
   updHeader();
   if(typeof renderHome==='function'&&!sess&&!les)renderHome();
   toast(ico('save','sm')+' Fortschritt wiederhergestellt ('+(state.xp||0)+' XP)');
   return true;
  }
  return false;
 }).catch(()=>false);
}

/* --- Automatik: beim Verlassen, Wechseln, Schließen --- */
function autoSaveHooks(){
 try{
  document.addEventListener('visibilitychange',()=>{
   if(document.visibilityState==='hidden')saveNow();
   else{_lastSave=0;askPersist();}
  });
  window.addEventListener('pagehide',()=>saveNow());
  window.addEventListener('beforeunload',()=>saveNow());
  window.addEventListener('blur',()=>saveNow());
  /* Sicherheitsnetz: alle 20 Sekunden, falls etwas offen blieb */
  setInterval(()=>{if(_dirty)saveNow();},20000);
 }catch(e){}
}

/* ============ Charakter-System ============
   Entspricht <Character type state size className/> – hier als String-Renderer,
   weil die App ihre Views über HTML-Strings aufbaut.

   character('x','happy','md')     -> HTML-String zum Einsetzen
   charState(el,'sad')             -> Zustand wechseln, ohne neu zu rendern
   charPulse(el,'happy',1400)      -> Zustand zeigen, danach zurück auf idle
*/
const CHAR_STATES=['idle','happy','sad','thinking','wave','celebrate','talking'];
const CHAR_SIZES={sm:1,md:1,lg:1};

function character(type,state,size,cls){
 const svg=CHAR_SVG[type];
 if(!svg)return '';
 state=CHAR_STATES.indexOf(state)>=0?state:'idle';
 size=CHAR_SIZES[size]?size:'md';
 return '<span class="char char--'+size+' is-'+state+(cls?' '+cls:'')+'" data-char="'+type+'">'+svg+'</span>';
}

function charState(el,state){
 el=typeof el==='string'?document.querySelector(el):el;
 if(!el||CHAR_STATES.indexOf(state)<0)return;
 if(el.classList.contains('is-'+state)){
  /* gleicher Zustand: einmalige Animation neu anstoßen */
  el.classList.remove('is-'+state);void el.offsetWidth;
 }else{
  for(let i=0;i<CHAR_STATES.length;i++)el.classList.remove('is-'+CHAR_STATES[i]);
 }
 el.classList.add('is-'+state);
}

function charPulse(el,state,ms){
 el=typeof el==='string'?document.querySelector(el):el;
 if(!el)return;
 charState(el,state);
 if(el._charT)clearTimeout(el._charT);
 el._charT=setTimeout(()=>charState(el,'idle'),ms||1500);
}
