    fields:[{l:'Ergebnis:',type:'txt',acc:[t1+'+'+t2,t2+'+'+t1]}],
    steps:['x-Terme: '+A+' − '+C+' = '+X,'y-Terme: '+B+' + '+D+' = '+Y,'Ergebnis: <b>'+t1+' + '+t2+'</b>'],hint:'z. B. 3x+2y'};}
  if(v===1){
   const k=ri(2,5),a=ri(1,7),m=ri(1,6);
   return {q:'Vereinfache: '+k+'(x + '+a+') + '+co(m,'x'),
    fields:[{l:'Ergebnis:',type:'txt',acc:linAcc(k+m,k*a)}],
    steps:['Ausmultiplizieren: '+k+'(x + '+a+') = '+linStr(k,k*a),co(k,'x')+' + '+co(m,'x')+' = '+co(k+m,'x'),'Ergebnis: <b>'+linStr(k+m,k*a)+'</b>'],hint:'z. B. 7x+12'};}
  if(pick([0,1,2])===0){
   const a=ri(2,6),b=ri(1,7),c=ri(1,5);
   return {q:'Vereinfache: '+co(a,'x')+' − ('+linStr(c,b)+')',
    fields:[{l:'Ergebnis:',type:'txt',acc:linAcc(a-c,-b)}],
    steps:['Minus vor der Klammer dreht beide Vorzeichen: '+linStr(-c,-b),
     'x-Terme: '+a+' − '+c+' = '+(a-c),'Ergebnis: <b>'+linStr(a-c,-b)+'</b>'],hint:'z. B. 3x-7'};
  }
  let g2=pick([2,3,4,5,6]),a=ri(1,6),b=ri(1,9),tries=0;
  while(gcd(a,b)!==1&&tries<20){a=ri(1,6);b=ri(1,9);tries++;}
  if(gcd(a,b)!==1){a=2;b=3;}
  const acc=linAcc(a,b).map(s=>g2+'('+s+')');
  return {q:'Klammere so viel wie möglich aus: '+linStr(g2*a,g2*b),
   fields:[{l:'Ergebnis:',type:'txt',acc:acc}],
   steps:['Größter gemeinsamer Teiler von '+(g2*a)+' und '+(g2*b)+' ist '+g2,'Ergebnis: <b>'+g2+'('+linStr(a,b)+')</b>','Probe durch Ausmultiplizieren!'],hint:'z. B. 6(x+2)'};
 }
 if(pick([0,1])===0){
  let a=ri(2,6),k=pick([-3,-2,2,3]),c=ri(1,4),d=ri(1,6),g=0;
  while(a+k*c===0&&g<10){c=ri(1,4);g++;}if(a+k*c===0)a++;
  const X=a+k*c,C=k*d;
  const kd=k<0?'− '+(-k):'+ '+k;
  return {q:'Vereinfache: '+co(a,'x')+' '+kd+'('+linStr(c,d)+')',
   fields:[{l:'Ergebnis:',type:'txt',acc:linAcc(X,C)}],
   steps:['Klammer ausmultiplizieren: '+k+'('+linStr(c,d)+') = '+linStr(k*c,k*d),'x-Terme: '+a+' + ('+(k*c)+') = '+X,'Ergebnis: <b>'+linStr(X,C)+'</b>'],hint:'z. B. 5y-2'};}
 const k=pick([2,3,4,5]),c=ri(2,6);
 return {q:'Klammere vollständig aus: '+co(k,'a²')+' + '+co(k*c,'a'),
  fields:[{l:'Ergebnis:',type:'txt',acc:[k+'a(a+'+c+')','a·'+k+'(a+'+c+')',k+'a('+c+'+a)']}],
  steps:['Beide Terme enthalten '+k+' und a','Gemeinsamer Faktor: '+k+'a','Ergebnis: <b>'+k+'a(a + '+c+')</b>'],hint:'z. B. 3a(a+2)'};
}},

/* ---------- B2 Lineare Gleichungen ---------- */
{id:'glg',ic:'scale',t:'Lineare Gleichungen',blk:1,
ex:'<p>Eine Gleichung ist wie eine Waage: Was du links machst, musst du auch rechts machen. Ziel: <b>x allein auf einer Seite</b>.</p>'+
'<div class="merk"><b>Strategie:</b><br>1. Klammern auflösen.<br>2. Alle x-Terme auf eine Seite, alle Zahlen auf die andere (durch + / −).<br>3. Zusammenfassen.<br>4. Durch die Zahl vor dem x teilen.<br>5. <b>Probe machen!</b> Einsetzen und prüfen.</div>',
exm:[
 {q:'2x + 3 = 11',steps:['Beide Seiten − 3:  2x = 8','Beide Seiten : 2:  <b>x = 4</b>','Probe: 2 · 4 + 3 = 11 ✓']},
 {q:'3x + 5 = 2x + 12',steps:['Beide Seiten − 2x:  x + 5 = 12','Beide Seiten − 5:  <b>x = 7</b>','Probe: 3·7+5 = 26 und 2·7+12 = 26 ✓']}],
gen:function(lvl){
 if(lvl===1){
  const v=pick([0,1,2]);
  if(v===0){const x=ri(-9,15),a=ri(1,20);
   return {q:'Löse: x + '+a+' = '+(x+a),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten − '+a,'x = '+(x+a)+' − '+a+' = <b>'+x+'</b>']};}
  if(v===1){const a=ri(2,9),x=ri(-6,12);
   return {q:'Löse: '+co(a,'x')+' = '+(a*x),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten : '+a,'x = '+(a*x)+' : '+a+' = <b>'+x+'</b>']};}
  const a=ri(2,7),x=ri(-5,10),b=ri(1,15),c=a*x+b;
  return {q:'Löse: '+linStr(a,b)+' = '+c,fields:[{l:'x =',a:x}],
   steps:['Beide Seiten − '+b+':  '+co(a,'x')+' = '+(c-b),'Beide Seiten : '+a+':  <b>x = '+x+'</b>','Probe: '+a+'·'+x+'+'+b+' = '+c+' ✓']};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const a=ri(2,6),b=ri(1,8),x=ri(-5,9),c=a*(x+b);
   return {q:'Löse: '+a+'(x + '+b+') = '+c,fields:[{l:'x =',a:x}],
    steps:['Beide Seiten : '+a+':  x + '+b+' = '+(c/a),'Beide Seiten − '+b+':  <b>x = '+x+'</b>']};}
  if(v===1){
   const a=ri(3,9),c=ri(1,5),x=ri(-6,9),b=ri(1,12);
   const cc=Math.min(a-1,c);const d=b+(a-cc)*x;
   return {q:'Löse: '+linStr(a,b)+' = '+linStr(cc,d),fields:[{l:'x =',a:x}],
    steps:['Beide Seiten − '+co(cc,'x')+':  '+linStr(a-cc,b)+' = '+d,'Beide Seiten − '+b+':  '+co(a-cc,'x')+' = '+(d-b),'Beide Seiten : '+(a-cc)+':  <b>x = '+x+'</b>']};}
  const b=ri(2,6),c=ri(2,9),a=ri(1,8),x=b*c-a;
  return {q:'Löse: '+frac('x + '+a,b)+' = '+c,fields:[{l:'x =',a:x}],
   steps:['Beide Seiten · '+b+':  x + '+a+' = '+(b*c),'Beide Seiten − '+a+':  <b>x = '+x+'</b>']};
 }
 if(pick([0,1])===0){
  let a=ri(2,6),c=ri(1,5),g=0;while(a-c<1&&g<10){c=ri(1,5);g++;}if(a<=c)a=c+1;
  const b=ri(1,6),d=ri(1,6),x=ri(-5,8),e=(a-c)*x+(a*b-c*d);
  return {q:'Löse: '+a+'(x + '+b+') − '+c+'(x + '+d+') = '+e,fields:[{l:'x =',a:x}],
   steps:['Ausmultiplizieren: '+linStr(a,a*b)+' − ('+linStr(c,c*d)+') = '+e,'Zusammenfassen: '+linStr(a-c,a*b-c*d)+' = '+e,'Beide Seiten − '+(a*b-c*d)+':  '+co(a-c,'x')+' = '+(e-(a*b-c*d)),'Beide Seiten : '+(a-c)+':  <b>x = '+x+'</b>']};}
 if(pick([0,1])===0){
  const k=ri(2,4),a=ri(1,6),x=ri(-4,8),c=ri(1,Math.max(1,k-1));
  const rhs=k*(x+a)-c*x;
  return {q:'Löse: '+k+'(x + '+a+') = '+co(c,'x')+' '+(rhs<0?'− '+(-rhs):'+ '+rhs),fields:[{l:'x =',a:x}],
   steps:['Ausmultiplizieren: '+linStr(k,k*a)+' = '+linStr(c,rhs),
    'Beide Seiten − '+co(c,'x')+':  '+linStr(k-c,k*a)+' = '+rhs,
    'Beide Seiten − '+(k*a)+', dann : '+(k-c)+':  <b>x = '+x+'</b>']};
 }
 let p=ri(2,4),x=ri(1,9),q2=ri(1,9),r=ri(2,5),s=0,g=0,found=false;
 for(g=0;g<60;g++){x=ri(-4,9);q2=ri(1,9);if((p*x-q2)%r===0){s=(p*x-q2)/r;found=true;break;}}
 if(!found){p=2;x=5;q2=4;r=2;s=3;}
 return {q:'Löse: '+frac(linStr(p,-q2),r)+' = '+s,fields:[{l:'x =',a:x}],
  steps:['Beide Seiten · '+r+':  '+linStr(p,-q2)+' = '+(s*r),'Beide Seiten + '+q2+':  '+co(p,'x')+' = '+(s*r+q2),'Beide Seiten : '+p+':  <b>x = '+x+'</b>']};
}},

/* ---------- B3 Ungleichungen ---------- */
{id:'ung',ic:'ineq',t:'Ungleichungen',blk:1,
ex:'<p>Ungleichungen löst du fast genauso wie Gleichungen – mit <b>einer</b> wichtigen Ausnahme.</p>'+
'<div class="merk"><b>Merke:</b> Wenn du mit einer <b>negativen Zahl multiplizierst oder dividierst</b>, dreht sich das Ungleichheitszeichen um!<br>−2x &gt; 8  →  x &lt; −4</div>'+
'<p>Bei Plus und Minus passiert dem Zeichen nichts.</p>',
exm:[
 {q:'2x − 4 &lt; 6',steps:['Beide Seiten + 4:  2x &lt; 10','Beide Seiten : 2 (positiv, Zeichen bleibt):  <b>x &lt; 5</b>']},
 {q:'−3x ≤ 12',steps:['Beide Seiten : (−3) → <b>Zeichen dreht sich um!</b>','<b>x ≥ −4</b>']}],
gen:function(lvl){
 const signs=['<','>','<=','>='];
 if(lvl===1){
  const sign=pick(signs);
  if(pick([0,1])===0){
   const a=ri(2,6),sol=ri(-6,9),b=a*sol;
   return {q:'Löse: '+co(a,'x')+' '+disp[sign]+' '+b,
    fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,sign)}],
    steps:['Beide Seiten : '+a+' (positiv → Zeichen bleibt)','<b>x '+disp[sign]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};}
  const a=ri(1,12),sol=ri(-6,12),b=sol+a;
  return {q:'Löse: x + '+a+' '+disp[sign]+' '+b,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,sign)}],
   steps:['Beide Seiten − '+a,'<b>x '+disp[sign]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};
 }
 if(lvl===2){
  const a=ri(2,5),sol=ri(-8,8),b=-a*sol,sign=pick(signs);
  return {q:'Löse: −'+co(a,'x')+' '+disp[sign]+' '+b,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(sol,flipS[sign])}],
   steps:['Beide Seiten : (−'+a+')','<b>Achtung: Zeichen dreht sich um!</b>','<b>x '+disp[flipS[sign]]+' '+sol+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};
 }
 if(pick([0,1])===0){
  const k=ri(2,4),m=ri(-6,6),c=ri(5,20),d=c-k*m,sign=pick(['>','>=']);
  return {q:'Löse: '+c+' − '+co(k,'x')+' '+disp[sign]+' '+d,
   fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(m,flipS[sign])}],
   steps:['Beide Seiten − '+c+':  −'+co(k,'x')+' '+disp[sign]+' '+(d-c),'Beide Seiten : (−'+k+') → Zeichen dreht sich um!','<b>x '+disp[flipS[sign]]+' '+m+'</b>'],hint:'Schreibe z. B. x<4 oder x>=-2'};}
 const a=ri(1,3),b=a+ri(1,3),e=ri(1,6),x0=ri(-5,9),f=a*e+x0*(a-b),sign=pick(['<','<=']);
 return {q:'Löse: '+a+'(x + '+e+') '+disp[sign]+' '+linStr(b,f),
  fields:[{l:'Lösung:',type:'txt',acc:ineqAcc(x0,flipS[sign])}],
  steps:['Ausmultiplizieren: '+linStr(a,a*e)+' '+disp[sign]+' '+linStr(b,f),'Beide Seiten − '+co(b,'x')+':  '+linStr(a-b,a*e)+' '+disp[sign]+' '+f,'Beide Seiten − '+(a*e)+':  '+co(a-b,'x')+' '+disp[sign]+' '+(f-a*e),'Durch '+(a-b)+' (negativ!) → Zeichen dreht sich um: <b>x '+disp[flipS[sign]]+' '+x0+'</b>'],hint:'Schreibe z. B. x>9'};
}},

/* ---------- B4 Binomische Formeln ---------- */
{id:'bin',ic:'binom',t:'Binomische Formeln',blk:1,
ex:'<p>Die drei binomischen Formeln brauchst du ständig – beim Ausmultiplizieren <b>und</b> rückwärts beim Faktorisieren.</p>'+
'<div class="merk"><span class="formel">(a + b)² = a² + 2ab + b²</span><br><span class="formel">(a − b)² = a² − 2ab + b²</span><br><span class="formel">(a + b)(a − b) = a² − b²</span></div>'+
'<p>Rückwärts: Steht da x² + 6x + 9, frage dich: Ist das (x + 3)²? Prüfe: 2 · x · 3 = 6x ✓</p>',
exm:[
 {q:'(x + 3)²',steps:['a = x, b = 3','a² + 2ab + b² = x² + 2·x·3 + 3²','= <b>x² + 6x + 9</b>']},
 {q:'x² − 10x + 25 faktorisieren',steps:['x² = (x)², 25 = 5² – passt zur 2. Formel?','Prüfe Mittelterm: 2 · x · 5 = 10x ✓ (mit Minus)','= <b>(x − 5)²</b>']}],
gen:function(lvl){
 if(lvl===1){
  const a=ri(1,9),plus=pick([true,false]);
  const inner='(x '+(plus?'+':'−')+' '+a+')²';
  const mid=plus?2*a:-2*a;
  return {q:'Multipliziere aus: '+inner,
   fields:[{l:'Ergebnis:',type:'txt',acc:[polyStr(1,mid,a*a)]}],
   steps:['Binomische Formel: (a '+(plus?'+':'−')+' b)² = a² '+(plus?'+':'−')+' 2ab + b²','a = x, b = '+a,'x² '+(plus?'+':'−')+' 2·'+a+'·x + '+(a*a)+' = <b>'+polyStr(1,mid,a*a)+'</b>'],
   hint:'z. B. x^2+6x+9 (nach fallenden Potenzen sortieren)'};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const a=ri(2,3),b=ri(1,5),plus=pick([true,false]);
   const mid=plus?2*a*b:-2*a*b;
   return {q:'Multipliziere aus: ('+co(a,'x')+' '+(plus?'+':'−')+' '+b+')²',
    fields:[{l:'Ergebnis:',type:'txt',acc:[polyStr(a*a,mid,b*b)]}],
    steps:['a = '+co(a,'x')+', b = '+b,'('+co(a,'x')+')² = '+co(a*a,'x²')+',  2 · '+co(a,'x')+' · '+b+' = '+co(2*a*b,'x')+',  '+b+'² = '+(b*b),'Ergebnis: <b>'+polyStr(a*a,mid,b*b)+'</b>'],hint:'z. B. 4x^2+4x+1'};}
  const a=ri(1,9),v=pick(['x','m','a']);
  return {q:'Multipliziere aus: ('+v+' + '+a+')('+v+' − '+a+')',
   fields:[{l:'Ergebnis:',type:'txt',acc:[v+'^2-'+(a*a)]}],
   steps:['3. binomische Formel: (a + b)(a − b) = a² − b²','= <b>'+v+'² − '+(a*a)+'</b>'],hint:'z. B. x^2-16'};
 }
 const v=pick([0,1,2]);
 if(v===0){
  const a=ri(1,9),plus=pick([true,false]);
  const mid=plus?2*a:-2*a;
  const acc=plus?['(x+'+a+')^2','('+a+'+x)^2']:['(x-'+a+')^2','('+a+'-x)^2'];
  return {q:'Faktorisiere mit einer binomischen Formel: '+polyStr(1,mid,a*a),
   fields:[{l:'Ergebnis:',type:'txt',acc:acc}],
   steps:['x² = (x)² und '+(a*a)+' = '+a+'²','Prüfe Mittelterm: 2 · x · '+a+' = '+(2*a)+'x ✓','= <b>(x '+(plus?'+':'−')+' '+a+')²</b>'],hint:'z. B. (x+3)^2'};}
 if(v===1){
  const c=pick([2,3,4,5]),b=ri(1,7),v2=pick(['y','x']);
  return {q:'Faktorisiere: '+co(c*c,v2+'²')+' − '+(b*b),
   fields:[{l:'Ergebnis:',type:'txt',acc:['('+c+v2+'+'+b+')('+c+v2+'-'+b+')','('+c+v2+'-'+b+')('+c+v2+'+'+b+')']}],
   steps:[co(c*c,v2+'²')+' = ('+co(c,v2)+')² und '+(b*b)+' = '+b+'²','3. binomische Formel rückwärts: a² − b² = (a + b)(a − b)','= <b>('+co(c,v2)+' + '+b+')('+co(c,v2)+' − '+b+')</b>'],hint:'z. B. (3y+4)(3y-4)'};}
 const a=ri(2,3),b=ri(1,6),v2=pick(['m','x']);
 return {q:'Multipliziere aus: ('+co(a,v2)+' − '+b+')('+co(a,v2)+' + '+b+')',
  fields:[{l:'Ergebnis:',type:'txt',acc:[co(a*a,v2+'^2')+'-'+(b*b)]}],
  steps:['3. binomische Formel: a² − b²','a = '+co(a,v2)+', b = '+b,'= <b>'+co(a*a,v2+'²')+' − '+(b*b)+'</b>'],hint:'z. B. 4m^2-25'};
}},

/* ---------- B5 Faktorisieren ---------- */
{id:'fak',ic:'factor',t:'Faktorisieren',blk:1,
ex:'<p>Faktorisieren heißt: eine Summe in ein <b>Produkt</b> verwandeln. Das ist das Gegenteil vom Ausmultiplizieren – und der Schlüssel zum Lösen quadratischer Gleichungen.</p>'+
'<div class="merk"><b>Drei Werkzeuge:</b><br>1. <b>Gemeinsamen Faktor ausklammern:</b> 6x + 12 = 6(x + 2)<br>2. <b>Binomische Formeln rückwärts</b><br>3. <b>Trinom zerlegen:</b> x² + 5x + 6 = (x + 2)(x + 3) – suche zwei Zahlen mit Produkt 6 und Summe 5.</div>',
exm:[
 {q:'2x² + 6x',steps:['Gemeinsamer Faktor: 2x','= <b>2x(x + 3)</b>','Probe: 2x · x + 2x · 3 = 2x² + 6x ✓']},
 {q:'x² − 2x − 8',steps:['Suche zwei Zahlen: Produkt −8, Summe −2','−4 und +2 passen: (−4)·2 = −8, −4+2 = −2','= <b>(x − 4)(x + 2)</b>']}],
gen:function(lvl){
 if(lvl===1){
  let g2=pick([2,3,4,5,6,7]),a=ri(1,5),b=ri(1,7),tries=0;
  while(gcd(a,b)!==1&&tries<20){a=ri(1,5);b=ri(1,7);tries++;}
  if(gcd(a,b)!==1){a=1;}
  const minus=pick([true,false]);const ib=minus?-b:b;
  const inner=linStr(a,ib)+'';
  const shown=co(g2*a,'x')+(g2*ib<0?' − '+Math.abs(g2*ib):' + '+(g2*ib));
  const acc=linAcc(a,ib).map(s=>g2+'('+s+')');
  return {q:'Klammere den größten gemeinsamen Faktor aus: '+shown,
   fields:[{l:'Ergebnis:',type:'txt',acc:acc}],
   steps:['ggT von '+(g2*a)+' und '+Math.abs(g2*ib)+' ist '+g2,'= <b>'+g2+'('+inner+')</b>','Probe durch Ausmultiplizieren!'],hint:'z. B. 4(2x+3)'};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const a=ri(2,9),v=pick(['x','a']);
   return {q:'Faktorisiere: '+v+'² + '+co(a,v),
    fields:[{l:'Ergebnis:',type:'txt',acc:[v+'('+v+'+'+a+')','('+v+'+'+a+')'+v,'('+v+'+'+a+')·'+v]}],
    steps:['Beide Terme enthalten '+v,'= <b>'+v+'('+v+' + '+a+')</b>'],hint:'z. B. x(x+5)'};}
  const k=ri(2,4),a=ri(2,6),v=pick(['x','m']);
  return {q:'Faktorisiere vollständig: '+co(k,v+'²')+' − '+co(k*a,v),
   fields:[{l:'Ergebnis:',type:'txt',acc:[k+v+'('+v+'-'+a+')','('+v+'-'+a+')'+k+v]}],
   steps:['Gemeinsamer Faktor: '+k+v,'= <b>'+k+v+'('+v+' − '+a+')</b>'],hint:'z. B. 4m(m-2)'};
 }
 let a=ri(-6,6),b=ri(-6,6),g=0;
 while((a===0||b===0||a===b||a+b===0)&&g<40){a=ri(-6,6);b=ri(-6,6);g++;}
 if(a===0||b===0||a===b||a+b===0){a=2;b=5;}
 const p=a+b,q2=a*b;
 return {q:'Faktorisiere das Trinom: '+polyStr(1,p,q2),
  fields:[{l:'Ergebnis:',type:'txt',acc:[facR(a)+facR(b),facR(b)+facR(a)]}],
  steps:['Suche zwei Zahlen mit <b>Produkt '+q2+'</b> und <b>Summe '+p+'</b>','Das sind '+a+' und '+b,'= <b>'+facR(a)+facR(b)+'</b>','Probe: Ausmultiplizieren ergibt wieder '+polyStr(1,p,q2)+' ✓'],hint:'z. B. (x+2)(x-3)'};
}},

/* ---------- B6 Bruchterme ---------- */
{id:'brt',ic:'fracx',t:'Bruchterme & Bruchgleichungen',blk:1,
ex:'<p>Bruchterme sind Brüche mit Variablen. Es gelten dieselben Regeln wie bei Zahlbrüchen – plus eine neue: Der <b>Nenner darf nie 0 werden</b> (Definitionsmenge!).</p>'+
'<div class="merk"><b>Merke:</b><br>• Gleiche Nenner: nur Zähler verrechnen: '+frac(2,'x')+' + '+frac(3,'x')+' = '+frac(5,'x')+'<br>• Verschiedene Nenner: erst Hauptnenner bilden.<br>• Bruchgleichungen: mit dem Hauptnenner multiplizieren – aber vorher notieren, welche x verboten sind.</div>',
exm:[
 {q:frac(1,'x')+' + '+frac(1,'2x'),steps:['Hauptnenner: 2x','Erweitern: '+frac(1,'x')+' = '+frac(2,'2x'),frac(2,'2x')+' + '+frac(1,'2x')+' = <b>'+frac(3,'2x')+'</b>']},
 {q:frac(3,'x − 1')+' = 6 lösen',steps:['Definitionsmenge: x ≠ 1 (sonst Nenner = 0)','Mal (x − 1): 3 = 6(x − 1) = 6x − 6','+6, dann :6: 9 = 6x → <b>x = 1,5</b> ✓ (erlaubt, da ≠ 1)']}],
gen:function(lvl){
 if(lvl===1){
  const c2=pick([2,3,4]),mult=ri(2,4);
  return {q:'Kürze: '+frac((c2*mult)+'x²',c2+'x'),
   fields:[{l:'Ergebnis:',type:'txt',acc:coAcc(mult,'x')}],
   steps:['Zahlen kürzen: '+(c2*mult)+' : '+c2+' = '+mult,'x² : x = x','= <b>'+co(mult,'x')+'</b>'],hint:'z. B. 2x'};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const a=ri(1,7),b=ri(1,7);
   return {q:'Fasse zusammen: '+frac(a,'x')+' + '+frac(b,'x'),
    fields:[{l:'Ergebnis:',type:'txt',acc:[(a+b)+'/x']}],
    steps:['Gleiche Nenner → Zähler addieren','= <b>'+frac(a+b,'x')+'</b>'],hint:'z. B. 5/x'};}
  if(v===1){const k=pick([2,3,4]);
   return {q:'Fasse zusammen: '+frac(1,'x')+' + '+frac(1,k+'x'),
    fields:[{l:'Ergebnis:',type:'txt',acc:[(k+1)+'/('+k+'x)',(k+1)+'/'+k+'x']}],
    steps:['Hauptnenner: '+k+'x','Erweitern: '+frac(1,'x')+' = '+frac(k,k+'x'),frac(k,k+'x')+' + '+frac(1,k+'x')+' = <b>'+frac(k+1,k+'x')+'</b>'],hint:'z. B. 3/(2x)'};}
  let c=ri(2,7),d=ri(1,5),g=0;while(2*c-d<=0&&g<10){c=ri(2,7);g++;}
  const num=2*c-d;
  return {q:'Fasse zusammen: '+frac(c,'a')+' − '+frac(d,'2a'),
   fields:[{l:'Ergebnis:',type:'txt',acc:[num+'/(2a)',num+'/2a']}],
   steps:['Hauptnenner: 2a','Erweitern: '+frac(c,'a')+' = '+frac(2*c,'2a'),frac(2*c,'2a')+' − '+frac(d,'2a')+' = <b>'+frac(num,'2a')+'</b>'],hint:'z. B. 5/(2a)'};
 }
 const v=pick([0,1,2]);
 if(v===0){const a=ri(2,12),b=pick([2,3,4,6]);
  return {q:'Löse (beachte: x ≠ 0): '+frac(a,'x')+' = '+b,
   fields:[{l:'x = (Bruch oder Dezimalzahl)',a:a/b}],
   steps:['Definitionsmenge: x ≠ 0','Beide Seiten · x:  '+a+' = '+co(b,'x'),'Beide Seiten : '+b+':  <b>x = '+fracTxt(a,b)+'</b>']};}
 if(v===1){const d=pick([2,3,4]),c=ri(1,9),b=d*ri(1,3),a=ri(1,8),x=c*b/d-a;
  return {q:'Löse: '+frac('x + '+a,b)+' = '+frac(c,d),
   fields:[{l:'x =',a:x}],
   steps:['Über Kreuz multiplizieren: '+d+'(x + '+a+') = '+c+' · '+b,linStr(d,d*a)+' = '+(c*b),'− '+(d*a)+', dann : '+d+':  <b>x = '+x+'</b>']};}
 const k=pick([2,3]),s=3*ri(1,4),x=2*k*s/3;
 return {q:'Löse: '+frac('x',k)+' + '+frac('x',2*k)+' = '+s,
  fields:[{l:'x =',a:x}],
  steps:['Hauptnenner: '+(2*k)+' → beide Seiten · '+(2*k),'2x + x = '+(2*k*s),'3x = '+(2*k*s)+' → <b>x = '+fmt(x)+'</b>']};
}},

/* ---------- B7 Quadratische Gleichungen ---------- */
{id:'qua',ic:'roots',t:'Quadratische Gleichungen',blk:1,
ex:'<p>Quadratische Gleichungen (mit x²) haben meist <b>zwei Lösungen</b>. Die schnellsten Wege:</p>'+
'<div class="merk"><b>Werkzeugkasten:</b><br>1. <b>Ausklammern</b> (wenn kein konstantes Glied): x² − 5x = 0 → x(x − 5) = 0 → x = 0 oder x = 5<br>2. <b>Faktorisieren</b>: x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0<br>3. <b>Wurzel ziehen</b>: x² = 9 → x = ±3<br><br><b>Nullprodukt-Regel:</b> Ein Produkt ist 0, wenn (mindestens) ein Faktor 0 ist.</div>',
exm:[
 {q:'x² − 5x = 0',steps:['x ausklammern: x(x − 5) = 0','Nullprodukt: x = 0 oder x − 5 = 0','<b>x₁ = 0, x₂ = 5</b>']},
 {q:'x² + 6x + 8 = 0',steps:['Zwei Zahlen mit Produkt 8, Summe 6: → 2 und 4','(x + 2)(x + 4) = 0','<b>x₁ = −2, x₂ = −4</b>']}],
gen:function(lvl){
 if(lvl===1){
  const a=ri(2,9),neg=pick([true,false]);
  const p2=neg?-a:a;
  return {q:'Löse: x² '+(neg?'−':'+')+' '+co(a,'x')+' = 0',
   fields:[{l:'x₁ =',a:0},{l:'x₂ =',a:-p2}],setAns:true,
   steps:['x ausklammern: x(x '+(neg?'−':'+')+' '+a+') = 0','Nullprodukt-Regel: x = 0 oder x '+(neg?'−':'+')+' '+a+' = 0','<b>x₁ = 0, x₂ = '+(-p2)+'</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const c=ri(2,9);
   return {q:'Löse: x² − '+(c*c)+' = 0',
    fields:[{l:'x₁ =',a:c},{l:'x₂ =',a:-c}],setAns:true,
    steps:['+ '+(c*c)+':  x² = '+(c*c),'Wurzel ziehen (zwei Lösungen!): <b>x = ±'+c+'</b>','Oder: 3. binomische Formel (x−'+c+')(x+'+c+') = 0']};}
  let r1=ri(-6,6),r2=ri(-6,6),g=0;
  while((r1===0||r2===0||r1===r2)&&g<30){r1=ri(-6,6);r2=ri(-6,6);g++;}
  if(r1===0||r2===0||r1===r2){r1=2;r2=-3;}
  const p2=-(r1+r2),q2=r1*r2;
  return {q:'Löse: '+polyStr(1,p2,q2)+' = 0',
   fields:[{l:'x₁ =',a:r1},{l:'x₂ =',a:r2}],setAns:true,
   steps:['Suche zwei Zahlen mit Produkt '+q2+' und Summe '+p2+': → '+(-r1)+' und '+(-r2),'Faktorisieren: '+facR(-r1)+facR(-r2)+' = 0','Nullprodukt: <b>x₁ = '+r1+', x₂ = '+r2+'</b>','Alternative: pq-Formel mit p = '+p2+', q = '+q2]};
 }
 if(pick([0,1])===0){
  const k=pick([2,3]),a=ri(2,7);
  return {q:'Löse: '+co(k,'x²')+' − '+co(k*a,'x')+' = 0',
   fields:[{l:'x₁ =',a:0},{l:'x₂ =',a:a}],setAns:true,
   steps:['Durch '+k+' teilen: x² − '+co(a,'x')+' = 0','x ausklammern: x(x − '+a+') = 0','<b>x₁ = 0, x₂ = '+a+'</b>']};}
 let r1=ri(-6,6),r2=ri(-6,6),g=0;
 while((r1===0||r2===0||r1===r2||r1+r2===0)&&g<30){r1=ri(-6,6);r2=ri(-6,6);g++;}
 if(r1===0||r2===0||r1===r2||r1+r2===0){r1=2;r2=-7;}
 const B=-(r1+r2),C=-r1*r2;
 return {q:'<b>Anders als gewohnt:</b> Löse x² '+(B<0?'− '+(-B):'+ '+B)+'x = '+C,
  fields:[{l:'x₁ =',a:r1},{l:'x₂ =',a:r2}],setAns:true,
  steps:['Erst alles auf eine Seite: '+polyStr(1,B,-C)+' = 0','Zwei Zahlen mit Produkt '+(-C)+' und Summe '+B+': → '+(-r1)+' und '+(-r2),facR(-r1)+facR(-r2)+' = 0','<b>x₁ = '+r1+', x₂ = '+r2+'</b>'],
  hint:'Bringe die Gleichung zuerst in die Form ... = 0'};
}},

/* ---------- B8 Textaufgaben ---------- */
{id:'txt',ic:'text',t:'Textaufgaben übersetzen',blk:1,
ex:'<p>Textaufgaben sind Übersetzungsarbeit: Deutsch → Mathematik. Genau diese Fähigkeit brauchst du bei <b>unbekannten Aufgaben</b> in Klausuren.</p>'+
'<div class="merk"><b>Strategie in 4 Schritten:</b><br>1. <b>Was ist gesucht?</b> Nenne es x.<br>2. <b>Übersetze</b> den Text Stück für Stück in eine Gleichung.<br>3. <b>Löse</b> die Gleichung.<br>4. <b>Antworte im Satz</b> und prüfe, ob das Ergebnis sinnvoll ist.</div>'+
'<p>Übersetzungshilfen: „das Dreifache" → 3x · „um 5 mehr" → +5 · „die Summe" → + · „ergibt" → =</p>',
exm:[
 {q:'Das Dreifache einer Zahl minus 4 ist 11. Welche Zahl?',steps:['Gesucht: die Zahl x','Übersetzen: 3x − 4 = 11','+4: 3x = 15 → :3: <b>x = 5</b>','Probe: 3·5 − 4 = 11 ✓']},
 {q:'Die Summe zweier aufeinanderfolgender Zahlen ist 31.',steps:['Kleinere Zahl: x, größere: x + 1','x + (x + 1) = 31','2x + 1 = 31 → 2x = 30 → <b>x = 15</b>','Die Zahlen sind 15 und 16.']}],
gen:function(lvl){
 if(lvl===1){
  const x=ri(3,30),a=ri(3,20),plus=pick([true,false]);
  const b=plus?x+a:x-a;
  return {q:'Eine Zahl '+(plus?'plus':'minus')+' '+a+' ergibt '+b+'. Wie heißt die Zahl?',
   fields:[{l:'Die Zahl:',a:x}],
   steps:['Gleichung: x '+(plus?'+':'−')+' '+a+' = '+b,(plus?'− ':'+ ')+a+' auf beiden Seiten','<b>x = '+x+'</b>']};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){const k=pick([2,3,4,5]),x=ri(2,12),a=ri(1,10),b=k*x-a;
   return {q:'Das '+['','','Doppelte','Dreifache','Vierfache','Fünffache'][k]+' einer Zahl minus '+a+' ist '+b+'. Welche Zahl?',
    fields:[{l:'Die Zahl:',a:x}],
    steps:['Gleichung: '+k+'x − '+a+' = '+b,'+ '+a+':  '+k+'x = '+(b+a),': '+k+':  <b>x = '+x+'</b>']};}
  if(v===1){const n=ri(5,40),S=2*n+1;
   return {q:'Die Summe zweier aufeinanderfolgender natürlicher Zahlen ist '+S+'. Wie heißt die <b>kleinere</b> Zahl?',
    fields:[{l:'Kleinere Zahl:',a:n}],
    steps:['Kleinere Zahl x, größere x + 1','x + (x + 1) = '+S,'2x + 1 = '+S+' → 2x = '+(S-1)+' → <b>x = '+n+'</b>']};}
  const net=ri(2,10)*100;
  return {q:'Ein Laptop kostet mit 19 % Mehrwertsteuer '+fmt(net*1.19)+' €. Wie hoch ist der <b>Nettopreis</b> (ohne MwSt.)?',
   fields:[{l:'Nettopreis (€):',a:net}],
   steps:['Brutto = Netto · 1,19','Netto = '+fmt(net*1.19)+' : 1,19','<b>= '+net+' €</b>'],
   hint:'Nicht einfach 19 % abziehen – die MwSt. wurde auf den Nettopreis gerechnet!'};
 }
 if(pick([0,1])===0){
  const x=ri(3,15),a=ri(2,8),U=2*(2*x+a);
  return {q:'Ein Rechteck ist '+a+' cm länger als breit. Sein Umfang beträgt '+U+' cm. Wie breit ist es?',
   fields:[{l:'Breite (cm):',a:x}],
   steps:['Breite x, Länge x + '+a,'Umfang: 2 · (x + x + '+a+') = '+U,'2 · (2x + '+a+') = '+U+'  →  4x + '+(2*a)+' = '+U,'4x = '+(U-2*a)+'  →  <b>x = '+x+' cm</b>']};}
 const k=pick([2,3,4]),s=ri(8,16),S=(k+1)*s;
 return {q:'Ein Vater ist '+k+'-mal so alt wie sein Sohn. Zusammen sind sie '+S+' Jahre alt. Wie alt ist der Sohn?',
  fields:[{l:'Alter des Sohnes:',a:s}],
  steps:['Sohn: x Jahre, Vater: '+k+'x Jahre','x + '+k+'x = '+S,co(k+1,'x')+' = '+S+'  →  <b>x = '+s+'</b>','Der Vater ist '+(k*s)+' Jahre alt. Probe: '+s+' + '+(k*s)+' = '+S+' ✓']};
}},

/* ---------- C1 Funktionsbegriff ---------- */
{id:'fun',ic:'map',t:'Funktionsbegriff',blk:2,
ex:'<p>Eine Funktion ist eine Zuordnung, die <b>jedem x genau einen y-Wert</b> zuordnet. f(3) = 5 heißt: Setze 3 ein, es kommt 5 heraus.</p>'+
'<div class="merk"><b>Merke:</b><br>• f(x) = 2x + 1: „Nimm x, verdopple es, addiere 1."<br>• <b>Einsetzen:</b> f(3) = 2 · 3 + 1 = 7<br>• Keine Funktion: wenn einem x <b>zwei</b> y-Werte zugeordnet werden (z. B. x ↦ ±x).<br>• y-Achsenabschnitt: f(0) berechnen. Nullstelle: f(x) = 0 lösen.</div>',
exm:[
 {q:'f(x) = x + 2: Wertetabelle für x = −1, 0, 1, 2',steps:['f(−1) = −1 + 2 = 1','f(0) = 2, f(1) = 3, f(2) = 4','Jedem x gehört <b>genau ein</b> y → Funktion ✓']},
 {q:'Nullstelle von f(x) = 2x − 6',steps:['Nullstelle: f(x) = 0 setzen','2x − 6 = 0 → 2x = 6','<b>x = 3</b>']}],
gen:function(lvl){
 if(lvl===1){
  const v1=pick([0,1,2]);
  if(v1===2){
   let m=pick([-2,-1,1,2]),b=ri(-3,3),x0=0,y0=99,g=0;
   while((Math.abs(y0)>4||x0===0)&&g<40){x0=ri(-3,3);y0=m*x0+b;g++;}
   if(Math.abs(y0)>4||x0===0){m=1;b=0;x0=2;y0=2;}
   return {q:'Der Graph zeigt eine Funktion f. Lies ab: f('+x0+') = ?'+
    graphSVG([{f:x=>m*x+b},{dot:[x0,y0],col:'#ffc233'}]),
    fields:[{l:'f('+x0+') =',a:y0}],
    steps:['Gehe auf der x-Achse zu x = '+x0,'Der markierte Punkt liegt auf Höhe y = '+y0,'<b>f('+x0+') = '+y0+'</b>']};}
  if(v1===0){
   let m=ri(-4,4);if(m===0)m=2;const b=ri(-6,8),x0=ri(-4,6);
   return {q:'f(x) = '+linStr(m,b)+'. Berechne f('+x0+').',
    fields:[{l:'f('+x0+') =',a:m*x0+b}],
    steps:['Einsetzen: f('+x0+') = '+m+' · '+(x0<0?'('+x0+')':x0)+(b>=0?' + '+b:' − '+(-b)),'= '+(m*x0)+(b>=0?' + '+b:' − '+(-b))+' = <b>'+(m*x0+b)+'</b>']};}
  const c=ri(-6,6),x0=ri(-4,5);
  return {q:'f(x) = x² '+(c>=0?'+ '+c:'− '+(-c))+'. Berechne f('+x0+').',
   fields:[{l:'f('+x0+') =',a:x0*x0+c}],
   steps:['Einsetzen: ('+x0+')² = '+(x0*x0)+' (Quadrat ist nie negativ!)',(x0*x0)+(c>=0?' + '+c:' − '+(-c))+' = <b>'+(x0*x0+c)+'</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const mc=shufMC(['x ↦ 2x + 1 (jedem x genau ein Wert)','x ↦ ±'+wz('x')+' (zwei Werte pro x)','Jeder Zahl werden ihre beiden Nachbarzahlen zugeordnet'],0);
   return {q:'Welche Zuordnung ist eine <b>Funktion</b>?',mc:mc,
    steps:['Funktion = jedem x wird <b>genau ein</b> y zugeordnet','Bei ± gibt es zwei Werte → keine Funktion','x ↦ 2x + 1 ist eine Funktion ✓']};}
  const m=ri(2,5),b=ri(-6,6),x0=ri(-4,7),v=m*x0+b;
  return {q:'f(x) = '+linStr(m,b)+'. Für welches x gilt f(x) = '+v+'?',
   fields:[{l:'x =',a:x0}],
   steps:['Gleichung aufstellen: '+linStr(m,b)+' = '+v,(b>=0?'− '+b:'+ '+(-b))+':  '+co(m,'x')+' = '+(v-b),': '+m+':  <b>x = '+x0+'</b>']};
 }
 const m=ri(2,5),z=ri(-5,6)||2,b=-m*z;
 return {q:'f(x) = '+linStr(m,b)+'. Bestimme den <b>y-Achsenabschnitt</b> und die <b>Nullstelle</b>.',
  fields:[{l:'y-Achsenabschnitt:',a:b},{l:'Nullstelle x =',a:z}],
  steps:['y-Achsenabschnitt: f(0) = '+b,'Nullstelle: '+linStr(m,b)+' = 0','<b>x = '+z+'</b>']};
}},

/* ---------- C2 Lineare Funktionen ---------- */
{id:'lin',ic:'line',t:'Lineare Funktionen',blk:2,
ex:'<p>Lineare Funktionen haben die Form <span class="formel">y = mx + b</span> – ihr Graph ist eine Gerade.</p>'+
'<div class="merk"><b>Merke:</b><br>• <b>m = Steigung</b>: um wie viel y steigt, wenn x um 1 wächst. m = '+frac('y₂ − y₁','x₂ − x₁')+'<br>• <b>b = y-Achsenabschnitt</b>: dort schneidet die Gerade die y-Achse.<br>• <b>Schnittpunkt zweier Geraden:</b> Terme gleichsetzen, nach x auflösen, y berechnen.</div>'+
graphSVG([{f:x=>2*x+1},{dot:[0,1],col:'#ffc233'},{dot:[1,3],col:'#35d39a'}])+
'<p class="hint" style="text-align:center">y = 2x + 1: Start bei b = 1 (orange), pro Schritt nach rechts geht es m = 2 nach oben (grün).</p>',
exm:[
 {q:'Gerade durch (0, 2) und (2, 6)',steps:['m = '+frac('6 − 2','2 − 0')+' = '+frac(4,2)+' = 2','b: bei x = 0 ist y = 2 → b = 2','<b>y = 2x + 2</b>']},
 {q:'Schnittpunkt von y = 2x + 1 und y = x + 4',steps:['Gleichsetzen: 2x + 1 = x + 4','− x: x + 1 = 4 → <b>x = 3</b>','Einsetzen: y = 2·3 + 1 = <b>7</b> → Schnittpunkt (3, 7)']}],
gen:function(lvl){
 if(lvl===1){
  const v1=pick([0,1,2]);
  if(v1===2){
   let m=pick([-3,-2,-1,1,2,3]),b=ri(-3,3),g=0;
   while(Math.abs(m+b)>4&&g<20){b=ri(-3,3);g++;}
   if(Math.abs(m+b)>4){m=1;b=1;}
   return {q:'Lies aus dem Graphen die Steigung m und den y-Achsenabschnitt b ab. (Die Punkte bei x = 0 und x = 1 sind markiert.)'+
    graphSVG([{f:x=>m*x+b},{dot:[0,b],col:'#ffc233'},{dot:[1,m+b],col:'#35d39a'}]),
    fields:[{l:'m =',a:m},{l:'b =',a:b}],
    steps:['b: Wo schneidet die Gerade die y-Achse? Beim orangen Punkt (0 | '+b+') → b = '+b,'m: Von x = 0 zu x = 1 geht es um '+(m>0?m+' nach oben':(-m)+' nach unten')+' → m = '+m,'<b>y = '+linStr(m,b)+'</b>'],
    hint:'1 nach rechts – wie viele Kästchen nach oben/unten?'};}
  if(v1===0){
   let m=ri(-4,4);if(m===0)m=3;const b=ri(-5,5),x1=ri(-4,2),x2=x1+ri(1,4);
   const y1=m*x1+b,y2=m*x2+b;
   return {q:'Eine Gerade geht durch ('+x1+' | '+y1+') und ('+x2+' | '+y2+'). Bestimme die Steigung m.',
    fields:[{l:'m =',a:m}],
    steps:['m = '+frac('y₂ − y₁','x₂ − x₁')+' = '+frac(y2+' − ('+y1+')',x2+' − ('+x1+')'),'= '+frac(y2-y1,x2-x1)+' = <b>'+m+'</b>']};}
  let m=ri(-5,5);if(m===0)m=-2;const b=ri(-8,8);
  return {q:'y = '+linStr(m,b)+'. Lies ab: Steigung und y-Achsenabschnitt.',
   fields:[{l:'Steigung m =',a:m},{l:'y-Achsenabschnitt b =',a:b}],
   steps:['Form y = mx + b','m = '+m+' (Zahl vor dem x)','b = '+b+' (Zahl ohne x)']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   let m=ri(-4,4);if(m===0)m=2;const b=ri(-6,6);
   return {q:'Stelle die Geradengleichung auf: m = '+m+', b = '+b,
    fields:[{l:'y =',type:'txt',acc:linAcc(m,b).map(s=>'y='+s).concat(linAcc(m,b))}],
    steps:['In y = mx + b einsetzen','<b>y = '+linStr(m,b)+'</b>'],hint:'z. B. y=2x+1'};}
  let m=ri(-3,3);if(m===0)m=2;const b=ri(-5,5),x1=ri(-3,1),x2=x1+ri(1,4);
  const y1=m*x1+b,y2=m*x2+b;
  return {q:'Bestimme die Gleichung der Geraden durch ('+x1+' | '+y1+') und ('+x2+' | '+y2+').',
   fields:[{l:'y =',type:'txt',acc:linAcc(m,b).map(s=>'y='+s).concat(linAcc(m,b))}],
   steps:['m = '+frac(y2+' − ('+y1+')',x2+' − ('+x1+')')+' = '+m,'b über Punkt ('+x1+' | '+y1+'): '+y1+' = '+m+' · ('+x1+') + b → b = '+b,'<b>y = '+linStr(m,b)+'</b>'],hint:'z. B. y=2x+1'};
 }
 let m1=ri(-3,4),m2=ri(-3,4),g=0;
 while((m1===m2||m1===0||m2===0)&&g<30){m1=ri(-3,4);m2=ri(-3,4);g++;}
 if(m1===m2||m1===0||m2===0){m1=2;m2=-1;}
 const xs=ri(-4,6),b1=ri(-5,5),ys=m1*xs+b1,b2=ys-m2*xs;
 return {q:'Bestimme den Schnittpunkt der Geraden y = '+linStr(m1,b1)+' und y = '+linStr(m2,b2)+'.',
  fields:[{l:'x =',a:xs},{l:'y =',a:ys}],
  steps:['Gleichsetzen: '+linStr(m1,b1)+' = '+linStr(m2,b2),'x-Terme auf eine Seite: '+co(m1-m2,'x')+' = '+(b2-b1),'x = '+xs,'Einsetzen: y = '+m1+' · ('+xs+')'+(b1>=0?' + '+b1:' − '+(-b1))+' = <b>'+ys+'</b>']};
}},

/* ---------- C3 Quadratische Funktionen ---------- */
{id:'qfk',ic:'parab',t:'Quadratische Funktionen',blk:2,
ex:'<p>Der Graph einer quadratischen Funktion ist eine <b>Parabel</b>. Die Scheitelpunktform verrät fast alles:</p>'+
'<div class="merk"><span class="formel">f(x) = a(x − d)² + e</span><br>• Scheitelpunkt: <b>S(d | e)</b> – Achtung: bei (x − 2)² ist d = +2!<br>• a &gt; 0: nach <b>oben</b> geöffnet (Minimum), a &lt; 0: nach <b>unten</b> (Maximum).<br>• Nullstellen: f(x) = 0 setzen und lösen (0, 1 oder 2 Lösungen).</div>'+
graphSVG([{f:x=>(x-2)*(x-2)-1},{dot:[2,-1],col:'#ffc233'}])+
'<p class="hint" style="text-align:center">f(x) = (x − 2)² − 1: Scheitel S(2 | −1), nach oben geöffnet, Nullstellen bei 1 und 3.</p>',
exm:[
 {q:'f(x) = (x − 2)² + 3',steps:['Vergleich mit a(x − d)² + e: d = 2, e = 3','Scheitelpunkt <b>S(2 | 3)</b>','a = 1 &gt; 0 → nach oben geöffnet, S ist Minimum']},
 {q:'Nullstellen von f(x) = (x − 1)² − 4',steps:['(x − 1)² − 4 = 0 → (x − 1)² = 4','Wurzel: x − 1 = ±2','x = 1 + 2 = <b>3</b> oder x = 1 − 2 = <b>−1</b>']}],
gen:function(lvl){
 const dStr=d=>d>=0?'(x − '+d+')²':'(x + '+(-d)+')²';
 const eStr=e=>e>=0?' + '+e:' − '+(-e);
 if(lvl===1){
  const v1=pick([0,1,2]);
  if(v1===2){
   const a=pick([1,-1]),d=ri(-3,3),e=a>0?ri(-3,1):ri(-1,3);
   return {q:'Der Graph zeigt eine Parabel. Lies den <b>Scheitelpunkt</b> ab (er ist markiert).'+
    graphSVG([{f:x=>a*(x-d)*(x-d)+e},{dot:[d,e],col:'#ffc233'}]),
    fields:[{l:'x-Wert des Scheitels:',a:d},{l:'y-Wert des Scheitels:',a:e}],
    steps:['Der Scheitel ist der '+(a>0?'tiefste':'höchste')+' Punkt der Parabel','Markierter Punkt: <b>S('+d+' | '+e+')</b>']};}
  if(v1===0){
   const d=ri(-5,6),e=ri(-8,8);
   return {q:'f(x) = '+dStr(d)+eStr(e)+'. Bestimme den Scheitelpunkt S(d | e).',
    fields:[{l:'d =',a:d},{l:'e =',a:e}],
    steps:['Scheitelpunktform: a(x − d)² + e → S(d | e)','Achtung Vorzeichen: '+dStr(d)+' bedeutet d = '+d,'<b>S('+d+' | '+e+')</b>']};}
  let a=ri(-3,3);if(a===0)a=-1;const c=ri(-5,5);
  const mc=shufMC(['nach oben geöffnet','nach unten geöffnet'],a>0?0:1);
  return {q:'f(x) = '+polyStr(a,0,c)+'. Wie ist die Parabel geöffnet?',mc:mc,
   steps:['Entscheidend ist die Zahl vor x²: a = '+a,a>0?'a &gt; 0 → <b>nach oben</b>':'a &lt; 0 → <b>nach unten</b>']};
 }
 if(lvl===2){
  const v2=pick([0,1,2]);
  if(v2===2){
   const a=pick([1,-1]),d=ri(-2,2),e=pick([-3,-2,-1,0,1,2,3]);
   const zeros=(a>0?(e<0?2:e===0?1:0):(e>0?2:e===0?1:0));
   const mc=shufMC(['keine Nullstelle','genau eine Nullstelle','zwei Nullstellen'],zeros);
   return {q:'Wie viele <b>Nullstellen</b> hat die abgebildete Parabel?'+
    graphSVG([{f:x=>a*(x-d)*(x-d)+e}]),mc:mc,
    steps:['Nullstellen = Schnittpunkte mit der <b>x-Achse</b>','Die Parabel '+(zeros===2?'schneidet die x-Achse zweimal':zeros===1?'berührt die x-Achse genau im Scheitel':'schneidet die x-Achse gar nicht'),'→ <b>'+['keine','genau eine','zwei'][zeros]+' Nullstelle'+(zeros===2?'n':'')+'</b>']};}
  if(v2===0){
   const d=ri(-4,5),k=ri(1,5);
   return {q:'Bestimme die Nullstellen von f(x) = '+dStr(d)+' − '+(k*k)+'.',
    fields:[{l:'x₁ =',a:d+k},{l:'x₂ =',a:d-k}],setAns:true,
    steps:[dStr(d)+' − '+(k*k)+' = 0 → '+dStr(d)+' = '+(k*k),'Wurzel ziehen: x − ('+d+') = ±'+k,'<b>x₁ = '+(d+k)+', x₂ = '+(d-k)+'</b>']};}
  let r1=ri(-5,5),r2=ri(-5,5),g=0;while((r1===r2)&&g<20){r2=ri(-5,5);g++;}if(r1===r2)r2=r1+2;
  return {q:'f(x) = '+facR(r1)+' · '+facR(r2)+'. Lies die Nullstellen ab.',
   fields:[{l:'x₁ =',a:r1},{l:'x₂ =',a:r2}],setAns:true,
   steps:['Nullprodukt: ein Faktor muss 0 sein',facR(r1)+' = 0 → x = '+r1,facR(r2)+' = 0 → x = '+r2]};
 }
 const p=2*ri(1,5)*pick([-1,1]);
 const xs=-p/2,ys=-p*p/4;
 return {q:'Bestimme den Scheitelpunkt von f(x) = '+polyStr(1,p,0)+' <b>ohne</b> zu zeichnen.',
  fields:[{l:'x-Wert des Scheitels:',a:xs},{l:'y-Wert des Scheitels:',a:ys}],
  steps:['Nullstellen: x(x '+(p>=0?'+ '+p:'− '+(-p))+') = 0 → x = 0 und x = '+(-p),'Der Scheitel liegt in der <b>Mitte</b> der Nullstellen: x = '+xs,'y-Wert: f('+xs+') = '+(xs*xs)+' '+(p*xs>=0?'+ '+(p*xs):'− '+(-p*xs))+' = <b>'+ys+'</b>'],
  hint:'Die Parabel ist symmetrisch – der Scheitel liegt genau zwischen den Nullstellen.'};
}},

/* ---------- C4 Exponentialfunktionen ---------- */
{id:'exp',ic:'expo',t:'Exponentialfunktionen',blk:2,
ex:'<p>Exponentielles Wachstum heißt: Der Bestand wird in jedem Schritt <b>mit demselben Faktor multipliziert</b> (nicht addiert!).</p>'+
'<div class="merk"><b>Merke:</b><br>• Wachstum um p %: Faktor <b>1 + p/100</b> (z. B. +10 % → · 1,1)<br>• Abnahme um p %: Faktor <b>1 − p/100</b> (z. B. −20 % → · 0,8)<br>• Nach n Schritten: Startwert · Faktorⁿ<br>• Exponentialfunktionen überholen <b>jede</b> Potenzfunktion – irgendwann.</div>',
exm:[
 {q:'100 € wachsen jährlich um 10 %. Kontostand nach 2 Jahren?',steps:['Faktor: 1,1','Nach 1 Jahr: 100 · 1,1 = 110 €','Nach 2 Jahren: 110 · 1,1 = <b>121 €</b> (nicht 120!)']},
 {q:'200 g halbieren sich jedes Jahr. Nach 3 Jahren?',steps:['Faktor: 0,5','200 · 0,5 · 0,5 · 0,5 = 200 · 0,5³','= 200 · '+frac(1,8)+' = <b>25 g</b>']}],
gen:function(lvl){
 if(lvl===1){
  if(pick([0,1])===0){
   const a=pick([2,3,5]),n=a===5?ri(2,4):ri(2,5);
   return {q:'Berechne: '+a+'<sup>'+n+'</sup>',
    fields:[{l:'Ergebnis:',a:Math.pow(a,n)}],
    steps:[a+' wird '+n+'-mal mit sich selbst multipliziert','= <b>'+Math.pow(a,n)+'</b>']};}
  const n=ri(1,3);
  return {q:'100 € wachsen jedes Jahr um 10 %. Wie viel sind es nach '+n+' Jahr'+(n>1?'en':'')+'?',
   fields:[{l:'Betrag (€):',a:100*Math.pow(1.1,n)}],
   steps:['Wachstumsfaktor: 1,1','100 · 1,1'+(n>1?'<sup>'+n+'</sup>':'')+' = <b>'+fmt(100*Math.pow(1.1,n))+' €</b>','Zinseszins: Es wird immer vom neuen Betrag gerechnet!']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const S=pick([200,400,800,1000]),n=ri(1,4);
   return {q:'Von '+S+' g eines Stoffes halbiert sich die Menge jedes Jahr. Wie viel ist nach '+n+' Jahr'+(n>1?'en':'')+' übrig?',
    fields:[{l:'Menge (g):',a:S/Math.pow(2,n)}],
    steps:['Faktor 0,5 pro Jahr, '+n+'-mal anwenden',S+' · 0,5'+(n>1?'<sup>'+n+'</sup>':'')+' = '+S+' : '+Math.pow(2,n)+' = <b>'+fmt(S/Math.pow(2,n))+' g</b>']};}
  const p=pick([5,10,15,20,25,50]),up=pick([true,false]);
  const f=up?1+p/100:1-p/100;
  return {q:'Ein Bestand '+(up?'wächst':'schrumpft')+' jedes Jahr um '+p+' %. Mit welchem <b>Faktor</b> wird pro Jahr multipliziert?',
   fields:[{l:'Faktor:',a:f}],
   steps:[p+' % = '+fmt(p/100),(up?'Wachstum: 1 + ':'Abnahme: 1 − ')+fmt(p/100)+' = <b>'+fmt(f)+'</b>'],hint:'z. B. 1,15 oder 0,8'};
 }
 if(pick([0,1])===0){
  const a=ri(2,6),n=ri(2,6),b=a*Math.pow(2,n);
  return {q:'Eine Bakterienkultur startet mit '+a+' Zellen und <b>verdoppelt</b> sich jede Stunde. Nach wie vielen Stunden sind es '+b+' Zellen?',
   fields:[{l:'Stunden:',a:n}],
   steps:['Gleichung: '+a+' · 2<sup>n</sup> = '+b,': '+a+':  2<sup>n</sup> = '+Math.pow(2,n),'2 hoch wie viel ergibt '+Math.pow(2,n)+'? → <b>n = '+n+'</b>']};}
 const mc=shufMC(['y = 2<sup>x</sup> (exponentiell)','y = x² (Potenzfunktion)','y = 100x (linear)'],0);
 return {q:'Welche Funktion wächst <b>langfristig</b> am schnellsten?',mc:mc,
  steps:['Exponentialfunktionen multiplizieren immer wieder mit 2','Vergleich bei x = 20: 2²⁰ ≈ 1 000 000, aber 20² = 400 und 100 · 20 = 2000','<b>Exponentiell schlägt am Ende alles.</b>']};
}},

/* ---------- C5 Logarithmen ---------- */
{id:'log',ic:'key',t:'Logarithmen',blk:2,
ex:'<p>Der Logarithmus stellt die Frage: <b>„Hoch wie viel?"</b> – er ist die Umkehrung des Potenzierens.</p>'+
'<div class="merk"><span class="formel">log<sub>2</sub>(8) = 3, weil 2³ = 8</span><br>• log<sub>a</sub>(a<sup>k</sup>) = k<br>• log<sub>a</sub>(1) = 0, denn a⁰ = 1<br>• Gleichung a<sup>x</sup> = b lösen heißt: x = log<sub>a</sub>(b)</div>',
exm:[
 {q:'log<sub>10</sub>(1000)',steps:['Frage: 10 hoch wie viel ergibt 1000?','10³ = 1000','→ <b>log<sub>10</sub>(1000) = 3</b>']},
 {q:'3<sup>x</sup> = 81 lösen',steps:['3 hoch wie viel ergibt 81?','3¹=3, 3²=9, 3³=27, 3⁴=81','<b>x = 4</b>']}],
gen:function(lvl){
 if(lvl===1){
  const a=pick([2,3,5,10]),k=a>=5?ri(1,3):ri(1,4);
  return {q:'Berechne: log<sub>'+a+'</sub>('+Math.pow(a,k)+')',
   fields:[{l:'Ergebnis:',a:k}],
   steps:['Frage: '+a+' hoch wie viel ergibt '+Math.pow(a,k)+'?',a+'<sup>'+k+'</sup> = '+Math.pow(a,k)+' → <b>'+k+'</b>']};
 }
 if(lvl===2){
  const a=pick([2,3,5,10]),k=a>=5?ri(1,3):ri(2,4);
  return {q:'Löse: '+a+'<sup>x</sup> = '+Math.pow(a,k),
   fields:[{l:'x =',a:k}],
   steps:['Frage: '+a+' hoch wie viel ergibt '+Math.pow(a,k)+'?','Probieren: '+a+'¹ = '+a+', '+a+'² = '+(a*a)+' …','<b>x = '+k+'</b> (das ist log<sub>'+a+'</sub>('+Math.pow(a,k)+'))']};
 }
 const v=pick([0,1,2]);
 if(v===0){const a=pick([2,3,10]),k=ri(1,3);
  return {q:'<b>Vorsicht, Bruch:</b> Berechne log<sub>'+a+'</sub>('+frac(1,Math.pow(a,k))+')',
   fields:[{l:'Ergebnis:',a:-k}],
   steps:[frac(1,Math.pow(a,k))+' = '+a+'<sup>−'+k+'</sup> (negativer Exponent = Kehrwert)','log<sub>'+a+'</sub>('+a+'<sup>−'+k+'</sup>) = <b>−'+k+'</b>']};}
 if(v===1){const a=pick([2,5,7,10]);
  return {q:'Berechne: log<sub>'+a+'</sub>(1)',
   fields:[{l:'Ergebnis:',a:0}],
   steps:['Frage: '+a+' hoch wie viel ergibt 1?','Jede Zahl hoch 0 ergibt 1','→ <b>0</b>']};}
 const k=ri(2,5);
 return {q:'Löse: 10<sup>x</sup> = '+('1'+'0'.repeat(k)),
  fields:[{l:'x =',a:k}],
  steps:['Zähle die Nullen: '+('1'+'0'.repeat(k))+' hat '+k+' Nullen','10<sup>'+k+'</sup> = '+('1'+'0'.repeat(k))+' → <b>x = '+k+'</b>']};
}},

/* ---------- D1 Folgen & Grenzwerte ---------- */
{id:'fol',ic:'limit',t:'Folgen & Grenzwerte',blk:3,
ex:'<p>Grenzwerte beschreiben, was passiert, wenn n <b>riesig</b> wird. Das ist die Grundidee der gesamten Analysis.</p>'+
'<div class="merk"><b>Merke:</b><br>• '+frac(1,'n')+' wird immer kleiner: 1; 0,5; 0,1; 0,001; … → <b>geht gegen 0</b><br>• „Geht gegen 0" heißt: kommt 0 beliebig nahe, ohne sie erreichen zu müssen.<br>• Trick bei Brüchen: '+frac('2n + 3','n')+' = 2 + '+frac(3,'n')+' → geht gegen <b>2</b></div>',
exm:[
 {q:'Grenzwert von '+frac('3n + 1','n'),steps:['Aufteilen: '+frac('3n','n')+' + '+frac(1,'n')+' = 3 + '+frac(1,'n'),'Für großes n: '+frac(1,'n')+' → 0','Grenzwert: <b>3</b>']}],
gen:function(lvl){
 if(lvl===1){
  if(pick([0,1])===0){
   const s=ri(1,10),d=ri(2,7);
   const terms=[s,s+d,s+2*d,s+3*d];
   return {q:'Wie geht die Folge weiter? '+terms.join('; ')+'; …',
    fields:[{l:'Nächstes Glied:',a:s+4*d}],
    steps:['Von Glied zu Glied wird immer +'+d+' gerechnet',terms[3]+' + '+d+' = <b>'+(s+4*d)+'</b>']};}
  const r=pick([2,3]),s=pick([1,2,3]);
  const terms=[s,s*r,s*r*r,s*r*r*r];
  return {q:'Wie geht die Folge weiter? '+terms.join('; ')+'; …',
   fields:[{l:'Nächstes Glied:',a:s*Math.pow(r,4)}],
   steps:['Jedes Glied wird mit '+r+' multipliziert',terms[3]+' · '+r+' = <b>'+(s*Math.pow(r,4))+'</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const n=pick([100,1000,10000]);
   return {q:'Berechne das Folgenglied '+frac(1,'n')+' für n = '+n+'.',
    fields:[{l:'Wert:',a:1/n}],
    steps:[frac(1,n)+' = '+fmt(1/n),'Je größer n, desto näher kommt der Wert an <b>0</b>']};}
  const mc=shufMC(['Sie geht gegen 0','Sie wächst über alle Grenzen','Sie geht gegen 1'],0);
  return {q:'Was passiert mit der Folge '+frac(1,'n')+', wenn n immer größer wird?',mc:mc,
   steps:[frac(1,2)+' = 0,5; '+frac(1,100)+' = 0,01; '+frac(1,'1 Mio.')+' = 0,000001','Die Werte kommen 0 beliebig nahe → <b>Grenzwert 0</b>']};
 }
 if(pick([0,1])===0){
  const k=ri(2,7),c=ri(1,9);
  return {q:'Bestimme den Grenzwert von '+frac(k+'n + '+c,'n')+' für n → ∞.',
   fields:[{l:'Grenzwert:',a:k}],
   steps:['Aufteilen: '+frac(k+'n','n')+' + '+frac(c,'n')+' = '+k+' + '+frac(c,'n'),frac(c,'n')+' geht gegen 0','Grenzwert: <b>'+k+'</b>'],
   hint:'Teile den Bruch in zwei Brüche auf.'};}
 const k=ri(2,9);
 return {q:'Bestimme den Grenzwert von '+k+' − '+frac(1,'n')+' für n → ∞.',
  fields:[{l:'Grenzwert:',a:k}],
  steps:[frac(1,'n')+' geht gegen 0','Also bleibt: '+k+' − 0 = <b>'+k+'</b>']};
}},

/* ---------- D2 Ableitungen ---------- */
{id:'abl',ic:'tangent',t:'Ableitungen',blk:3,
ex:'<p>Die Ableitung f′(x) gibt die <b>Steigung</b> des Graphen an jeder Stelle an – bei Kurven ändert sie sich von Punkt zu Punkt.</p>'+
'<div class="merk"><b>Regeln:</b><br><span class="formel">(x<sup>n</sup>)′ = n · x<sup>n−1</sup></span> (Potenzregel: Exponent nach vorn, dann um 1 verringern)<br><span class="formel">(a · f)′ = a · f′</span> (Faktor bleibt stehen)<br><span class="formel">(f + g)′ = f′ + g′</span> (Summand für Summand)<br>• Konstanten fallen weg: (5)′ = 0<br>• (x)′ = 1</div>',
exm:[
 {q:'f(x) = x³',steps:['Potenzregel: Exponent 3 nach vorn','Exponent um 1 verringern: 3 − 1 = 2','<b>f′(x) = 3x²</b>']},
 {q:'f(x) = 2x⁵ − 4x² + 7',steps:['(2x⁵)′ = 2 · 5x⁴ = 10x⁴','(−4x²)′ = −8x','(7)′ = 0','<b>f′(x) = 10x⁴ − 8x</b>']}],
gen:function(lvl){
 const powS=(c,e)=>e===0?(''+c):e===1?co(c,'x'):co(c,'x^'+e);
 const powH=(c,e)=>e===0?(''+c):e===1?co(c,'x'):co(c,'x<sup>'+e+'</sup>');
 if(lvl===1){
  const n=ri(2,7);
  return {q:'Leite ab: f(x) = x<sup>'+n+'</sup>',
   fields:[{l:'f′(x) =',type:'txt',acc:[powS(n,n-1)]}],
   steps:['Potenzregel: Exponent nach vorn, dann um 1 verringern','f′(x) = '+n+' · x<sup>'+n+'−1</sup> = <b>'+powH(n,n-1)+'</b>'],
   hint:'z. B. 3x^2'};
 }
 if(lvl===2){
  const v=pick([0,1,2]);
  if(v===0){
   const a=ri(2,7),n=ri(2,5);
   return {q:'Leite ab: f(x) = '+powH(a,n),
    fields:[{l:'f′(x) =',type:'txt',acc:[powS(a*n,n-1)]}],
    steps:['Faktor '+a+' bleibt stehen, Potenzregel für x<sup>'+n+'</sup>','f′(x) = '+a+' · '+n+' · x<sup>'+(n-1)+'</sup> = <b>'+powH(a*n,n-1)+'</b>'],hint:'z. B. 10x^4'};}
  if(v===1){
   const n=ri(2,5),b=ri(2,9);
   const t1=powS(n,n-1);
   return {q:'Leite ab: f(x) = x<sup>'+n+'</sup> + '+co(b,'x'),
    fields:[{l:'f′(x) =',type:'txt',acc:[t1+'+'+b,b+'+'+t1]}],
    steps:['Summand für Summand ableiten','(x<sup>'+n+'</sup>)′ = '+powH(n,n-1)+' und ('+co(b,'x')+')′ = '+b,'<b>f′(x) = '+powH(n,n-1)+' + '+b+'</b>'],hint:'z. B. 3x^2+5'};}
  const x0=ri(-4,5);
  return {q:'f(x) = x². Wie groß ist die <b>Steigung</b> des Graphen an der Stelle x = '+x0+'?',
   fields:[{l:'Steigung:',a:2*x0}],
   steps:['Ableitung bilden: f′(x) = 2x','Stelle einsetzen: f′('+x0+') = 2 · ('+x0+')','= <b>'+(2*x0)+'</b>']};
 }
 if(pick([0,1])===0){
  const a=ri(2,5),m=ri(3,5),b=ri(2,6),c=ri(1,9);
  const t1=powS(a*m,m-1),t2=powS(-2*b,1);
  return {q:'Leite ab: f(x) = '+powH(a,m)+' − '+powH(b,2)+' + '+c,
   fields:[{l:'f′(x) =',type:'txt',acc:[t1+t2,(t2.startsWith('-')?t2:'+'+t2)+'+'+t1,t2+'+'+t1]}],
   steps:['('+powH(a,m)+')′ = '+powH(a*m,m-1),'(−'+powH(b,2)+')′ = −'+co(2*b,'x'),'('+c+')′ = 0 (Konstante fällt weg)','<b>f′(x) = '+powH(a*m,m-1)+' − '+co(2*b,'x')+'</b>'],hint:'z. B. 10x^4-8x'};}
 if(pick([0,1])===0){
  const a=ri(2,4),n=ri(2,3),x0=ri(1,3);
  const abl=a*n,val=abl*Math.pow(x0,n-1);
  return {q:'f(x) = '+co(a,'x<sup>'+n+'</sup>')+'. Wie groß ist die <b>Steigung an der Stelle x = '+x0+'</b>?',
   fields:[{l:'f′('+x0+') =',a:val}],
   steps:['Ableiten: f′(x) = '+co(abl,n-1===1?'x':'x<sup>'+(n-1)+'</sup>'),
    'Einsetzen: f′('+x0+') = '+abl+' · '+x0+(n-1>1?'<sup>'+(n-1)+'</sup>':''),
    '= <b>'+val+'</b>']};
 }
 const B=2*ri(1,6);
 return {q:'<b>Anwendung:</b> f(x) = x² − '+B+'x. An welcher Stelle ist die Steigung gleich 0 (Extremstelle)?',
  fields:[{l:'x =',a:B/2}],
  steps:['Ableiten: f′(x) = 2x − '+B,'Null setzen: 2x − '+B+' = 0','2x = '+B+' → <b>x = '+(B/2)+'</b>','Dort hat die Parabel ihren Scheitel (Minimum).']};
}},

/* ---------- D3 Integrale ---------- */
{id:'int',ic:'area',t:'Integrale',blk:3,
ex:'<p>Ein Integral misst die <b>Fläche unter einem Graphen</b>. Die Stammfunktion F ist die „Rückwärts-Ableitung": F′(x) = f(x).</p>'+
'<div class="merk"><b>Merke:</b><br><span class="formel">∫ x<sup>n</sup> dx = '+frac('x<sup>n+1</sup>','n + 1')+' + C</span> (Exponent +1, dann dadurch teilen)<br>• Kontrolle: Stammfunktion ableiten → es muss wieder f herauskommen!<br>• Bestimmtes Integral: '+'∫<sub>a</sub><sup>b</sup> f(x) dx = F(b) − F(a)</div>',
exm:[
 {q:'∫ 3x² dx',steps:['Exponent + 1: aus x² wird x³','Durch neuen Exponenten teilen: 3 · '+frac('x³',3)+' = x³','<b>F(x) = x³ + C</b> — Probe: (x³)′ = 3x² ✓']},
 {q:'∫₀² x dx (Fläche unter y = x von 0 bis 2)',steps:['Stammfunktion: F(x) = '+frac('x²',2),'F(2) − F(0) = '+frac(4,2)+' − 0','= <b>2</b> (das Dreieck mit Ecken (0|0), (2|0), (2|2))']}],
gen:function(lvl){
 if(lvl===1){
  const n=ri(1,4);
  const acc=['x^'+(n+1),'x^'+(n+1)+'+c'];
  return {q:'Bestimme eine Stammfunktion: ∫ '+co(n+1,n===1?'x':'x<sup>'+n+'</sup>')+' dx',
   fields:[{l:'F(x) =',type:'txt',acc:acc}],
   steps:['Exponent + 1: aus x<sup>'+n+'</sup> wird x<sup>'+(n+1)+'</sup>','Durch '+(n+1)+' teilen: '+(n+1)+' · '+frac('x<sup>'+(n+1)+'</sup>',n+1)+' = x<sup>'+(n+1)+'</sup>','<b>F(x) = x<sup>'+(n+1)+'</sup> + C</b>','Probe: (x<sup>'+(n+1)+'</sup>)′ = '+co(n+1,'x<sup>'+n+'</sup>')+' ✓'],
   hint:'z. B. x^3 (das +C darfst du weglassen)'};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const b=2*ri(1,4);
   return {q:'Berechne die Fläche unter y = x von 0 bis '+b+':  ∫₀'+'<sup>'+b+'</sup> x dx',
    fields:[{l:'Fläche:',a:b*b/2}],
    steps:['Stammfunktion: F(x) = '+frac('x²',2),'F('+b+') − F(0) = '+frac(b+'²',2)+' − 0 = '+(b*b/2),'Kontrolle: Dreieck mit Breite '+b+' und Höhe '+b+' → ½ · '+b+' · '+b+' = <b>'+(b*b/2)+'</b> ✓']};}
  const c=ri(2,6),b=ri(2,6);
  return {q:'Berechne: ∫₀<sup>'+b+'</sup> '+c+' dx',
   fields:[{l:'Ergebnis:',a:c*b}],
   steps:['Fläche unter der waagerechten Linie y = '+c,'Rechteck: Breite '+b+' · Höhe '+c+' = <b>'+(c*b)+'</b>']};
 }
 if(pick([0,1])===0){
  const b=pick([3,6]);
  return {q:'Berechne: ∫₀<sup>'+b+'</sup> x² dx',
   fields:[{l:'Ergebnis:',a:b*b*b/3}],
   steps:['Stammfunktion: F(x) = '+frac('x³',3),'F('+b+') − F(0) = '+frac(b+'³',3)+' − 0','= '+frac(b*b*b,3)+' = <b>'+(b*b*b/3)+'</b>']};}
 const mc=shufMC(['Unter y = 2x (doppelt so hoch wie y = x)','Unter y = x','Beide Flächen sind gleich groß'],0);
 return {q:'Welche Fläche auf [0; 2] ist größer: unter y = x oder unter y = 2x?',mc:mc,
  steps:['∫₀² x dx = '+frac(4,2)+' = 2','∫₀² 2x dx = [x²]₀² = 4','<b>y = 2x liefert die doppelte Fläche.</b>']};
}},

/* ---------- D4 Trigonometrie ---------- */
{id:'tri',ic:'angle',t:'Trigonometrie',blk:3,
ex:'<p>Im <b>rechtwinkligen</b> Dreieck verbinden Sinus, Cosinus und Tangens die Winkel mit den Seiten.</p>'+
'<div class="merk"><b>GAGA-Hühnerhof:</b><br><span class="formel">sin(α) = '+frac('Gegenkathete','Hypotenuse')+'</span> <span class="formel">cos(α) = '+frac('Ankathete','Hypotenuse')+'</span> <span class="formel">tan(α) = '+frac('Gegenkathete','Ankathete')+'</span><br>• Hypotenuse: die längste Seite (gegenüber vom rechten Winkel)<br>• Gegenkathete: liegt dem Winkel α <b>gegenüber</b><br>• Pythagoras: a² + b² = c² · Winkelsumme: 180°<br>• Wichtige Werte: sin(30°) = 0,5 · cos(60°) = 0,5 · tan(45°) = 1</div>',
exm:[
 {q:'Katheten 3 cm und 4 cm – wie lang ist die Hypotenuse?',steps:['Pythagoras: c² = 3² + 4² = 9 + 16 = 25','c = '+wz(25),'<b>c = 5 cm</b>']},
 {q:'sin(30°) = 0,5 und Hypotenuse = 8 cm. Gegenkathete?',steps:['sin(α) = Gegenkathete : Hypotenuse','0,5 = G : 8','G = 8 · 0,5 = <b>4 cm</b>']}],
gen:function(lvl){
 if(lvl===1){
  if(pick([0,1])===0){
   const w=pick([['sin(30°)',0.5],['cos(60°)',0.5],['tan(45°)',1],['sin(90°)',1],['cos(0°)',1],['sin(0°)',0]]);
   return {q:'Gib den Wert an: '+w[0],
    fields:[{l:w[0]+' =',a:w[1]}],
    steps:['Auswendig-Werte (kommen ständig vor):','sin(30°) = 0,5 · cos(60°) = 0,5 · tan(45°) = 1','sin(0°) = 0 · sin(90°) = 1 · cos(0°) = 1'],hint:'z. B. 0,5 oder 1/2'};}
  return {q:'Wie groß ist die Summe der Innenwinkel in <b>jedem</b> Dreieck?',
   fields:[{l:'Grad:',a:180}],
   steps:['In jedem Dreieck: α + β + γ = <b>180°</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const t=pick([[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25]]);
   if(pick([0,1])===0){
    return {q:'Ein rechtwinkliges Dreieck hat die Katheten '+t[0]+' cm und '+t[1]+' cm. Wie lang ist die Hypotenuse?',
     fields:[{l:'Hypotenuse (cm):',a:t[2]}],
     steps:['Pythagoras: c² = '+t[0]+'² + '+t[1]+'² = '+(t[0]*t[0])+' + '+(t[1]*t[1])+' = '+(t[2]*t[2]),'c = '+wz(t[2]*t[2])+' = <b>'+t[2]+' cm</b>']};}
   return {q:'Hypotenuse '+t[2]+' cm, eine Kathete '+t[0]+' cm. Wie lang ist die andere Kathete?',
    fields:[{l:'Kathete (cm):',a:t[1]}],
    steps:['Pythagoras umstellen: b² = c² − a²','b² = '+(t[2]*t[2])+' − '+(t[0]*t[0])+' = '+(t[1]*t[1]),'b = <b>'+t[1]+' cm</b>']};}
  const H=2*ri(2,10);
  return {q:'Im rechtwinkligen Dreieck ist α = 30° und die Hypotenuse '+H+' cm lang. Berechne die Gegenkathete von α.',
   fields:[{l:'Gegenkathete (cm):',a:H/2}],
   steps:['sin(30°) = '+frac('Gegenkathete','Hypotenuse'),'0,5 = G : '+H,'G = '+H+' · 0,5 = <b>'+(H/2)+' cm</b>']};
 }
 if(pick([0,1])===0){
  let a=ri(20,80),b=ri(20,80),g=0;while(a+b>150&&g<20){b=ri(20,80);g++;}if(a+b>150)b=150-a;
  return {q:'In einem Dreieck sind α = '+a+'° und β = '+b+'°. Wie groß ist γ?',
   fields:[{l:'γ (Grad):',a:180-a-b}],
   steps:['Winkelsumme: α + β + γ = 180°','γ = 180° − '+a+'° − '+b+'° = <b>'+(180-a-b)+'°</b>']};}
 const t=pick([[3,4,5],[5,12,13]]),s=ri(2,4);
 return {q:'<b>Transfer:</b> Im rechtwinkligen Dreieck gilt sin(α) = '+frac(t[0],t[2])+' und die Hypotenuse ist '+(t[2]*s)+' cm lang. Wie lang ist die Gegenkathete von α?',
  fields:[{l:'Gegenkathete (cm):',a:t[0]*s}],
  steps:['sin(α) = G : Hypotenuse','G = sin(α) · Hypotenuse = '+frac(t[0],t[2])+' · '+(t[2]*s),'= <b>'+(t[0]*s)+' cm</b>']};
}},

/* ---------- D5 Vektoren ---------- */
{id:'vek',ic:'vector',t:'Vektoren',blk:3,
ex:'<p>Ein Vektor beschreibt eine <b>Verschiebung</b>: wie weit nach rechts/links und wie weit nach oben/unten.</p>'+
'<div class="merk"><b>Merke:</b><br>• Addition: komponentenweise. (1|2) + (3|4) = (4|6)<br>• Länge (Pythagoras!): |(3|4)| = '+wz('3² + 4²')+' = '+wz(25)+' = 5<br>• Vielfaches: (2|4) = 2 · (1|2) → die Vektoren sind <b>parallel</b>.<br>• Gerade in Parameterform: Startpunkt + t · Richtungsvektor</div>',
exm:[
 {q:'(2|−1) + (−3|5)',steps:['x-Komponenten: 2 + (−3) = −1','y-Komponenten: −1 + 5 = 4','Ergebnis: <b>(−1|4)</b>']},
 {q:'Länge von (3|4)',steps:['Pythagoras: |v| = '+wz('3² + 4²'),'= '+wz('9 + 16')+' = '+wz(25),'= <b>5</b>']}],
gen:function(lvl){
 const vs=(x,y)=>'('+x+' | '+y+')';
 if(lvl===1){
  const a=ri(-9,9),b=ri(-9,9),c=ri(-9,9),d=ri(-9,9);
  if(pick([0,1])===0){
   return {q:'Berechne: '+vs(a,b)+' + '+vs(c,d),
    fields:[{l:'x-Komponente:',a:a+c},{l:'y-Komponente:',a:b+d}],
    steps:['Komponentenweise addieren','x: '+a+' + ('+c+') = '+(a+c)+',  y: '+b+' + ('+d+') = '+(b+d),'Ergebnis: <b>'+vs(a+c,b+d)+'</b>']};}
  return {q:'Berechne: '+vs(a,b)+' − '+vs(c,d),
   fields:[{l:'x-Komponente:',a:a-c},{l:'y-Komponente:',a:b-d}],
   steps:['Komponentenweise subtrahieren','x: '+a+' − ('+c+') = '+(a-c)+',  y: '+b+' − ('+d+') = '+(b-d),'Ergebnis: <b>'+vs(a-c,b-d)+'</b>']};
 }
 if(lvl===2){
  if(pick([0,1])===0){
   const t=pick([[3,4,5],[6,8,10],[5,12,13],[8,6,10],[12,5,13],[8,15,17],[9,12,15]]);
   const x=t[0]*pick([-1,1]),y=t[1]*pick([-1,1]);
   return {q:'Berechne die Länge des Vektors '+vs(x,y)+'.',
    fields:[{l:'Länge:',a:t[2]}],
    steps:['|v| = '+wz('x² + y²')+' (Pythagoras)','= '+wz(x+'² + ('+y+')²')+' = '+wz((x*x)+' + '+(y*y))+' = '+wz(t[2]*t[2]),'= <b>'+t[2]+'</b>']};}
  const a=ri(1,5),b=ri(1,5),k=ri(2,4),isMult=pick([true,false]);
  const w=isMult?[k*a,k*b]:[k*a,k*b+ri(1,3)];
  const mc=shufMC(['Ja','Nein'],isMult?0:1);
  return {q:'Ist '+vs(w[0],w[1])+' ein Vielfaches von '+vs(a,b)+'?',mc:mc,
   steps:['Prüfe: '+w[0]+' : '+a+' = '+fmt(w[0]/a)+' und '+w[1]+' : '+b+' = '+fmt(w[1]/b),isMult?'Beide Male Faktor '+k+' → <b>ja, Vielfaches (parallel)</b>':'Verschiedene Faktoren → <b>kein Vielfaches</b>']};
 }
 if(pick([0,1])===0){
  const p1=ri(-4,4),p2=ri(-4,4),r1=ri(1,4),r2=ri(1,4),t0=ri(1,3);
  return {q:'Gerade g: <b>x</b> = '+vs(p1,p2)+' + t · '+vs(r1,r2)+'. Welcher Punkt ergibt sich für t = '+t0+'?',
   fields:[{l:'x-Koordinate:',a:p1+t0*r1},{l:'y-Koordinate:',a:p2+t0*r2}],
   steps:['t = '+t0+' einsetzen','x: '+p1+' + '+t0+' · '+r1+' = '+(p1+t0*r1)+',  y: '+p2+' + '+t0+' · '+r2+' = '+(p2+t0*r2),'Punkt: <b>'+vs(p1+t0*r1,p2+t0*r2)+'</b>']};}
 const p1=ri(-3,3),p2=ri(-3,3),r1=ri(1,3),r2=ri(1,3),t0=ri(1,3),on=pick([true,false]);
 const q1=p1+t0*r1,q2=on?p2+t0*r2:p2+t0*r2+1;
 const mc=shufMC(['Ja','Nein'],on?0:1);
 return {q:'Liegt der Punkt P'+vs(q1,q2)+' auf der Geraden g: <b>x</b> = '+vs(p1,p2)+' + t · '+vs(r1,r2)+'?',mc:mc,
  steps:['x-Gleichung: '+p1+' + t · '+r1+' = '+q1+' → t = '+t0,'Mit t = '+t0+' die y-Koordinate prüfen: '+p2+' + '+t0+' · '+r2+' = '+(p2+t0*r2),on?'Stimmt mit '+q2+' überein → <b>P liegt auf g</b>':'Ergibt '+(p2+t0*r2)+', aber P hat y = '+q2+' → <b>P liegt nicht auf g</b>']};
}}
];

function shufMC(opts,correctIdx){
 const idx=opts.map((_,i)=>i);
 for(let i=idx.length-1;i>0;i--){const j=ri(0,i);const tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}
 return {opts:idx.map(i=>opts[i]),a:idx.indexOf(correctIdx)};}
